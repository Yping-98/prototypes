<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI质培中台 - 课程完成标准与作业管理</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; background:#f2f3f5; color:#303133; font-size:14px; line-height:1.5; }
  button, input, select, textarea { font-family:inherit; font-size:14px; }
  .layout { display:flex; height:100%; }
  .sidebar { width:220px; background:#001529; color:rgba(255,255,255,.65); flex-shrink:0; display:flex; flex-direction:column; }
  .logo { height:56px; display:flex; align-items:center; justify-content:center; gap:8px; overflow:hidden; }
  .logo-icon { width:32px; height:32px; border-radius:8px; background:#409eff; color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; }
  .logo-title { color:#fff; font-size:18px; font-weight:600; white-space:nowrap; }
  .menu { flex:1; overflow:auto; }
  .menu-sub, .menu-item { height:56px; display:flex; align-items:center; gap:8px; padding:0 20px; color:rgba(255,255,255,.65); cursor:pointer; font-size:14px; }
  .menu-sub:hover, .menu-item:hover { color:#fff; background:rgba(255,255,255,.08); }
  .menu-item { padding-left:48px; border-radius:4px; }
  .menu-item.active { color:#fff; background:#409eff; }
  .menu-children { display:none; }
  .menu-group.open .menu-children { display:block; }
  .menu-ico { width:16px; height:16px; flex-shrink:0; }
  .menu-arrow { margin-left:auto; width:12px; height:12px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(-45deg); }
  .menu-group.open .menu-arrow { transform:rotate(45deg); }
  .main { flex:1; min-width:0; display:flex; flex-direction:column; background:#f2f3f5; }
  .header { height:56px; background:#fff; border-bottom:1px solid #e4e7ed; display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0; }
  .header-left, .user-info { display:flex; align-items:center; gap:16px; }
  .fold { width:18px; height:18px; color:#303133; }
  .breadcrumb { display:flex; align-items:center; gap:8px; color:#606266; font-size:14px; }
  .breadcrumb .sep { color:#c0c4cc; }
  .breadcrumb .curr { color:#303133; }
  .user-info { color:#303133; cursor:pointer; gap:6px; }
  .avatar { width:28px; height:28px; border-radius:50%; background:#409eff; color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .caret { width:12px; height:12px; color:#909399; }
  .content { padding:10px; flex:1; overflow:auto; }
  .card { background:#fff; border:1px solid #ebeef5; border-radius:4px; padding:20px; }
  .filter-form, .filter-panel { display:flex; flex-wrap:wrap; align-items:center; }
  .fi { display:flex; align-items:center; gap:12px; margin:0 32px 18px 0; }
  .fi.right { margin-left:auto; margin-right:0; }
  .filter-panel { gap:12px; }
  .filter-panel > * { margin-bottom:18px; }
  .input, select, textarea { height:32px; padding:0 11px; border:1px solid #dcdfe6; border-radius:4px; color:#606266; background:#fff; outline:none; }
  textarea.input { height:auto; padding:8px 10px; resize:vertical; }
  .input:focus, select:focus, textarea:focus { border-color:#409eff; }
  .input.err { border-color:#f56c6c; }
  .input.short { width:88px; }
  .btn { height:32px; padding:0 14px; border-radius:4px; border:1px solid #dcdfe6; background:#fff; color:#606266; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
  .btn:hover { color:#409eff; border-color:#c6e2ff; background:#ecf5ff; }
  .btn.primary { background:#409eff; border-color:#409eff; color:#fff; }
  .btn.primary:hover { background:#66b1ff; border-color:#66b1ff; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.link { border:0; background:none; color:#409eff; height:auto; padding:0 4px; }
  .btn.link:hover { background:none; text-decoration:underline; }
  .btn.link.danger { color:#f56c6c; }
  .btn.link:disabled { color:#c0c4cc; text-decoration:none; }
  .spacer { margin-left:auto; display:flex; gap:12px; }
  .table-scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { background:#f6f7fa; color:#303133; font-weight:600; text-align:left; padding:8px 12px; border-bottom:1px solid #ebeef5; white-space:nowrap; }
  td { padding:8px 12px; border-bottom:1px solid #ebeef5; color:#606266; vertical-align:middle; background:#fff; }
  tbody tr:hover td { background:#f5f7fa; }
  .sticky-left, .sticky-right { position:sticky; z-index:1; }
  .sticky-left { left:0; }
  .sticky-right { right:0; box-shadow:-1px 0 0 #ebeef5; }
  thead .sticky-left, thead .sticky-right { z-index:2; background:#f6f7fa; }
  .ops .btn.link + .btn.link { margin-left:12px; }
  .link { color:#409eff; cursor:pointer; background:none; border:0; padding:0; }
  .link:hover { text-decoration:underline; }
  .tag { display:inline-block; padding:0 8px; height:22px; line-height:20px; border-radius:4px; font-size:12px; border:1px solid transparent; }
  .tag.gray { background:#f4f4f5; color:#909399; border-color:#e9e9eb; }
  .tag.green { background:#f0f9eb; color:#67c23a; border-color:#e1f3d8; }
  .tag.orange { background:#fdf6ec; color:#e6a23c; border-color:#faecd8; }
  .tag.blue { background:#ecf5ff; color:#409eff; border-color:#d9ecff; }
  .tag.red { background:#fef0f0; color:#f56c6c; border-color:#fde2e2; }
  .tag.purple { background:#f4ecff; color:#7c4dff; border-color:#e6d8ff; }
  .pager { margin-top:16px; display:flex; justify-content:flex-end; align-items:center; gap:8px; color:#606266; font-size:14px; }
  .pager-btn { min-width:32px; height:32px; padding:0 4px; border:0; border-radius:2px; background:#f0f2f5; color:#606266; }
  .pager-btn.active { background:#409eff; color:#fff; }
  .pager-size, .pager-jump { height:32px; border:1px solid #dcdfe6; border-radius:4px; background:#fff; color:#606266; padding:0 8px; }
  .pager-jump { width:48px; text-align:center; }
  .head { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .head-title { font-size:16px; font-weight:600; color:#303133; }
  .stat-row { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px; }
  .stat-card { background:#fff; border:1px solid #ebeef5; border-radius:4px; padding:16px 20px; }
  .stat-num { font-size:26px; font-weight:600; color:#303133; }
  .stat-num.blue { color:#409eff; }
  .stat-num.green { color:#67c23a; }
  .stat-label { margin-top:4px; color:#909399; }
  .progress { display:flex; align-items:center; gap:8px; min-width:120px; }
  .progress-track { flex:1; height:8px; background:#ebeef5; border-radius:100px; overflow:hidden; }
  .progress.thick .progress-track { height:10px; }
  .progress-bar { height:100%; background:#409eff; border-radius:100px; }
  .progress-text { min-width:42px; font-size:12px; color:#606266; white-space:nowrap; }
  .date-range { height:32px; display:inline-flex; align-items:center; gap:8px; padding:0 11px; border:1px solid #dcdfe6; border-radius:4px; background:#fff; color:#a8abb2; }
  .mine-stat { display:flex; gap:16px; margin-bottom:8px; }
  .mine-stat .item { flex:1; padding:16px 20px; background:#fff; border:1px solid #ebeef5; border-radius:8px; }
  .mine-stat span { display:block; font-size:13px; color:#909399; }
  .mine-stat b { display:block; margin-top:8px; font-size:24px; font-weight:600; color:#303133; }
  .subtabs { display:flex; border-bottom:1px solid #e4e7ed; margin:4px 0 12px; }
  .subtabs button { height:40px; padding:0 20px; border:0; background:none; color:#303133; cursor:pointer; }
  .subtabs button.active { color:#409eff; box-shadow:inset 0 -2px 0 #409eff; }
  .icon-btn { width:24px; height:24px; border-radius:50%; border:1px solid #dcdfe6; background:#fff; color:#606266; cursor:pointer; }
  .icon-btn:disabled { color:#c0c4cc; cursor:not-allowed; }
  .learn-page { display:flex; flex-direction:column; gap:6px; }
  .learn-bar { display:flex; align-items:center; gap:12px; }
  .learn-title { font-size:16px; font-weight:600; }
  .learn-count { font-size:13px; color:#909399; }
  .alert { margin-top:6px; padding:8px 12px; background:#ecf5ff; color:#409eff; border-radius:4px; font-size:13px; }
  .stage-row { display:flex; gap:10px; min-height:420px; }
  .stage-main { flex:3; min-width:0; padding:16px; background:#fff; border:1px solid #ebeef5; border-radius:8px; }
  .stage-now { margin-bottom:12px; font-weight:600; }
  .stage-list { flex:1; min-width:260px; max-width:340px; padding:16px; background:#fff; border:1px solid #ebeef5; border-radius:8px; display:flex; flex-direction:column; }
  .stage-list-title { font-weight:600; margin-bottom:10px; }
  .course-head, .cw { display:flex; align-items:center; gap:8px; padding:10px; border-radius:6px; cursor:pointer; }
  .course-head:hover, .cw:hover { background:#f5f7fa; }
  .cw.active, .course-head.active { background:#ecf5ff; }
  .course-head.locked, .cw.locked { color:#c0c4cc; cursor:not-allowed; }
  .course-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cw-sub { margin-top:2px; font-size:12px; color:#909399; }
  .course-cws { padding-left:14px; }
  .stage-tip { margin-top:8px; font-size:12px; color:#909399; }
  .pass-line { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .import-block p { margin:16px 0 8px; line-height:1.6; }
  .import-block p:first-child { margin-top:0; }
  .no-file { color:#f56c6c; font-size:12px; padding-left:10px; margin-top:6px; }
  .file-ok { color:#606266; font-size:12px; padding-left:10px; margin-top:6px; }
  .member-tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .member-tag { display:inline-flex; align-items:center; gap:4px; height:24px; padding:0 8px; border:1px solid #d9ecff; background:#ecf5ff; color:#409eff; border-radius:4px; font-size:12px; }
  .member-tag button { border:0; background:none; color:#409eff; cursor:pointer; line-height:1; }
  .suggest { margin-top:6px; border:1px solid #ebeef5; border-radius:4px; background:#fff; }
  .suggest button { display:block; width:100%; text-align:left; border:0; background:#fff; padding:8px 12px; cursor:pointer; }
  .suggest button:hover { background:#f5f7fa; }
  .time-line { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tabs { display:flex; gap:0; border-bottom:1px solid #e4e7ed; margin-bottom:16px; }
  .tabs button { height:40px; padding:0 16px; border:0; background:none; color:#303133; cursor:pointer; border-bottom:2px solid transparent; }
  .tabs button.active { color:#409eff; border-bottom-color:#409eff; }
  .q-box { border:1px solid #ebeef5; border-radius:4px; padding:12px; margin-bottom:12px; background:#fff; }
  .thumb-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .thumb { width:72px; height:72px; object-fit:cover; border:1px solid #ebeef5; border-radius:4px; }
  .thumb-wrap { position:relative; }
  .thumb-wrap button { position:absolute; top:-6px; right:-6px; width:18px; height:18px; border:0; border-radius:50%; background:#f56c6c; color:#fff; cursor:pointer; }
  .catalog-item { padding:12px; border-bottom:1px solid #ebeef5; cursor:pointer; }
  .catalog-item.active { background:#ecf5ff; }
  .catalog-item.locked { color:#c0c4cc; cursor:not-allowed; }
  .drawer-mask, .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000; display:none; }
  .drawer-mask.show, .modal-mask.show { display:block; }
  .modal-mask { z-index:1200; display:none; align-items:center; justify-content:center; }
  .modal-mask.show { display:flex; }
  .drawer { position:fixed; top:0; right:0; height:100%; background:#fff; z-index:1001; display:none; flex-direction:column; box-shadow:-2px 0 8px rgba(0,0,0,.12); width:800px; max-width:100%; }
  .drawer.show { display:flex; }
  .drawer.narrow { width:640px; }
  .drawer.score { width:720px; }
  .drawer.wide { width:900px; }
  .drawer-hd, .drawer-ft { height:56px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .drawer-hd { border-bottom:1px solid #ebeef5; font-size:16px; font-weight:600; }
  .drawer-ft { border-top:1px solid #ebeef5; justify-content:flex-end; gap:8px; }
  .drawer-bd { flex:1; overflow:auto; padding:20px; }
  .x { border:0; background:none; font-size:20px; color:#909399; cursor:pointer; }
  .section-title { position:relative; padding-left:10px; margin:8px 0 14px; font-size:15px; font-weight:600; }
  .section-title::before { content:""; position:absolute; left:0; top:3px; width:3px; height:16px; background:#409eff; border-radius:2px; }
  .form-row { display:flex; margin-bottom:16px; }
  .form-label { width:88px; text-align:right; padding-right:12px; line-height:32px; color:#606266; flex-shrink:0; }
  .req { color:#f56c6c; margin-right:2px; }
  .form-ctrl { flex:1; min-width:0; }
  .help { margin-top:4px; color:#909399; font-size:12px; }
  .cw-bar { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .inline-panel { padding:16px; margin-bottom:12px; background:#f5f7fa; border:1px solid #ebeef5; border-radius:8px; }
  .radios label { margin-right:16px; line-height:32px; }
  .std-cell { display:flex; align-items:center; gap:6px; }
  .hint { color:#909399; font-size:12px; white-space:nowrap; }
  .q-item { border:1px solid #ebeef5; border-radius:6px; padding:12px; margin-bottom:10px; background:#fafafa; }
  .q-hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .q-title { font-weight:600; line-height:1.6; margin-bottom:8px; }
  .count { text-align:right; color:#909399; font-size:12px; }
  .answer { background:#f5f7fa; border-radius:4px; padding:10px 12px; margin:8px 0 14px; white-space:pre-wrap; }
  .grade-list { display:flex; flex-wrap:wrap; gap:12px; }
  .grade-list label { display:flex; align-items:center; gap:4px; }
  .modal { width:420px; background:#fff; border-radius:4px; overflow:hidden; }
  .modal-hd, .modal-ft { padding:14px 16px; }
  .modal-hd { font-weight:600; border-bottom:1px solid #ebeef5; }
  .modal-bd { padding:20px 16px; color:#606266; }
  .modal-ft { display:flex; justify-content:flex-end; gap:8px; border-top:1px solid #ebeef5; }
  .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#edf2fc; color:#909399; border:1px solid #e4e7ed; padding:10px 16px; border-radius:4px; z-index:2000; display:none; max-width:80vw; }
  .toast.show { display:block; }
  .toast.ok { background:#f0f9eb; color:#67c23a; border-color:#e1f3d8; }
  .toast.warn { background:#fdf6ec; color:#e6a23c; border-color:#faecd8; }
  .player-wrap { display:grid; grid-template-columns:1fr 280px; gap:12px; }
  .stage { background:#111; border-radius:4px; min-height:320px; color:#fff; display:flex; flex-direction:column; }
  .stage-view { flex:1; display:flex; align-items:center; justify-content:center; font-size:15px; padding:24px; text-align:center; }
  .controls { display:flex; align-items:center; gap:10px; padding:10px 12px; background:#1f1f1f; }
  .controls input[type=range] { flex:1; }
  .time { color:#ddd; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .play-status { background:#fff; border:1px solid #ebeef5; border-radius:4px; padding:12px 14px; margin-top:12px; }
  .play-status div { margin-bottom:4px; }
  .side-item { padding:10px 12px; border-bottom:1px solid #ebeef5; cursor:pointer; }
  .side-item.active { background:#ecf5ff; }
  .doc-page { background:#fff; color:#303133; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .empty { text-align:center; color:#909399; padding:28px 0; }
  .exam-hold { min-height:220px; display:flex; align-items:center; justify-content:center; color:#909399; font-size:16px; text-align:center; padding:24px; }
  .exam-score { font-size:22px; font-weight:600; margin:4px 0 12px; }
  .exam-score.pass { color:#67c23a; }
  .exam-score.fail { color:#f56c6c; }
  .opt-line { display:flex; align-items:flex-start; gap:8px; margin:6px 0; color:#303133; }
  .ans-row { margin-top:8px; font-size:13px; }
  .ans-ok { color:#67c23a; }
  .ans-no { color:#f56c6c; }
  .ans-key { color:#409eff; }
  .ans-ana { margin-top:4px; color:#606266; }
  .back-row { margin-bottom:12px; }
  @media (max-width: 900px) {
    .sidebar { display:none; }
    .player-wrap { grid-template-columns:1fr; }
    .drawer, .drawer.narrow, .drawer.score { width:100%; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo"><span class="logo-icon">质</span><span class="logo-title">AI质培中台</span></div>
    <div class="menu">
      <div class="menu-group" id="menu-home">
        <div class="menu-sub" id="toggle-home"><svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg><span>工作台</span><i class="menu-arrow"></i></div>
        <div class="menu-children">
          <div class="menu-item">首页</div>
          <div class="menu-item" data-nav="points">积分管理</div>
        </div>
      </div>
      <div class="menu-group open" id="menu-learn">
        <div class="menu-sub" id="toggle-learn"><svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5A2.5 2.5 0 0 1 6.5 8H20"/></svg><span>在线学习</span><i class="menu-arrow"></i></div>
        <div class="menu-children">
          <div class="menu-item active" data-nav="course">课程管理</div>
          <div class="menu-item" data-nav="homework">作业管理</div>
          <div class="menu-item" data-nav="project">学习项目</div>
          <div class="menu-item">课程中心</div>
          <div class="menu-item" data-nav="learn">我的学习</div>
        </div>
      </div>
      <div class="menu-group" id="menu-exam">
        <div class="menu-sub" id="toggle-exam"><svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></svg><span>在线考试</span><i class="menu-arrow"></i></div>
        <div class="menu-children">
          <div class="menu-item" data-nav="my-exam">我的考试</div>
          <div class="menu-item" data-nav="exam">考试管理</div>
        </div>
      </div>
      <div class="menu-group">
        <div class="menu-sub"><svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.7.9 1.2 1.6 1.3H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>系统管理</span><i class="menu-arrow"></i></div>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="header">
      <div class="header-left">
        <svg class="fold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
        <div class="breadcrumb" id="crumb"></div>
      </div>
      <div class="user-info"><span class="avatar">李</span><span>李营平</span><svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></div>
    </header>
    <div class="content" id="app"></div>
  </div>
</div>

<div class="drawer-mask" id="mask"></div>

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
function pad(n) { return String(n).padStart(2, "0"); }
function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  return pad(Math.floor(sec / 60)) + ":" + pad(sec % 60);
}
function fmtDur(sec) {
  if (!sec) return "—";
  return formatDuration(sec);
}
function formatDuration(seconds) {
  const s = Math.max(0, Math.floor(seconds || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const parts = [];
  if (h) parts.push(h + "小时");
  if (m) parts.push(m + "分");
  if (sec || !parts.length) parts.push(sec + "秒");
  return parts.join("");
}
function nowStamp() {
  const d = new Date();
  const text = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  const ts = Number(text.replace(/\D/g, ""));
  return { text, ts };
}
function videoTotal(list) {
  return list.filter(c => c.type === "video").reduce((s, c) => s + (c.duration || 0), 0);
}
function maxMinutes(duration) { return Math.floor((duration || 0) / 60); }
function toast(msg, type) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (type === "ok" ? " ok" : type === "warn" ? " warn" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = "toast"; }, 2200);
}
function ask(message) {

  });
}

};

function openDrawer(title, html, foot, size) {
  const drawer = document.getElementById("drawer");
  drawer.className = "drawer show" + (size ? " " + size : "");
  document.getElementById("mask").classList.add("show");
  document.getElementById("drawer-title").textContent = title;
  document.getElementById("drawer-body").innerHTML = html;
  document.getElementById("drawer-foot").innerHTML = foot || "";
}
function closeDrawer() {
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("mask").classList.remove("show");
  document.getElementById("drawer-foot").innerHTML = "";
}

function setCrumb(parts) {
  document.getElementById("crumb").innerHTML = parts.map((p, i) => {
    const sep = i ? '<span class="sep">/</span>' : "";
    return sep + '<span class="' + (i === parts.length - 1 ? "curr" : "") + '">' + esc(p.text) + "</span>";
  }).join("");
}

function courseStatusTag(status) {
  const cls = status === "已发布" ? "green" : status === "已下架" ? "red" : "gray";
  return `<span class="tag ${cls}">${esc(status)}</span>`;
}
function courseOps(c) {
  const ops = [];
  if (c.status !== "已下架") ops.push(`<button class="btn link" data-edit-course="${c.id}">编辑</button>`);
  if (c.status !== "已发布") ops.push(`<button class="btn link" data-course-act="publish" data-id="${c.id}">${c.status === "已下架" ? "重新发布" : "发布"}</button>`);
  else if (!c.referenceCount) ops.push(`<button class="btn link" data-course-act="offline" data-id="${c.id}">下架</button>`);
  if (c.status === "草稿") ops.push(`<button class="btn link danger" data-course-act="del" data-id="${c.id}">删除</button>`);
  return ops.join("");
}

    <span>前往</span>

}
function progressHtml(percent, label, thick) {
  const p = Math.max(0, Math.min(100, Number(percent) || 0));
  return `<div class="progress${thick ? " thick" : ""}"><div class="progress-track"><div class="progress-bar" style="width:${p}%"></div></div><span class="progress-text">${label == null ? p + "%" : label}</span></div>`;
}
function tagOf(label) {
  const map = { "草稿": "gray", "已结束": "gray", "未开始": "orange", "进行中": "blue", "学习中": "blue", "已完成": "green", "已发布": "green", "已下架": "red", "已上架": "green" };
  return `<span class="tag ${map[label] || "gray"}">${esc(label)}</span>`;
}
function examTag(status) {

}

async function onCourseAction(id, act) {
  const c = courses.find(x => x.id === id);
  if (!c) return;
  if (act === "publish") {
    if (!c.coursewares.length) return toast("发布前请至少添加一个课件", "warn");
    const ok = await ask("确认" + (c.status === "已下架" ? "重新发布" : "发布") + "课程「" + c.name + "」？");
    if (!ok) return;
    c.status = "已发布";
    toast("发布成功", "ok");
    render();
    return;
  }
  if (act === "offline") {
    const ok = await ask("确认下架课程「" + c.name + "」？");
    if (!ok) return;
    c.status = "已下架";
    toast("下架成功", "ok");
    render();
    return;
  }
  if (act === "del") {
    const ok = await ask("确认删除草稿课程「" + c.name + "」？");
    if (!ok) return;
    courses.splice(courses.findIndex(x => x.id === id), 1);
    toast("删除成功", "ok");
    render();
  }
}

function bindCourseEditor() {

    input.oninput = () => {

      uid: ++uidSeq, name: title, type, duration: type === "video" ? fileDuration : 0,

function validateStandards() {
  const total = videoTotal(editingCourse.coursewares);
  let ok = true;
  editingCourse.coursewares.forEach(w => {
    w._err = false;
    if (w.type !== "video") return;
    if (!w.standard) { w._err = true; ok = false; toast("请填写视频课件的完成标准", "warn"); return; }
    if (!/^\d+$/.test(w.standard) || Number(w.standard) <= 0) { w._err = true; ok = false; toast("完成标准仅可输入大于 0 的数字", "warn"); return; }
    const seconds = Number(w.standard) * 60;
    if (seconds > w.duration) { w._err = true; ok = false; toast("完成标准不能超过该视频时长", "warn"); return; }
    if (seconds > total) { w._err = true; ok = false; toast("完成标准不能超过课程总时长", "warn"); }
  });
  return ok;
}
function saveCourse(publish) {
  editingCourse.name = (document.getElementById("c-name")?.value || "").trim();
  if (!editingCourse.name) return toast("请输入课程名称", "warn");
  if (publish && !editingCourse.coursewares.length) return toast("发布前请至少添加一个课件", "warn");
  if (!validateStandards()) { drawCourseEditor(); return; }
  if (courseMode === "edit") {
    const src = courses.find(c => c.id === editingCourse.id);
    src.name = editingCourse.name;
    src.coursewares = editingCourse.coursewares.map(w => ({ ...w }));
    const active = src.coursewares.find(w => w.uid === activeCwUid);
    if (!active && src.coursewares[0]) activeCwUid = src.coursewares[0].uid;
  } else if (editingCourse.name) {
    const n = nowStamp();
    courses.push({
      ...editingCourse,
      id: ++uidSeq,
      status: publish ? "已发布" : "草稿",
      isPublic: true,
      referenceCount: 0,
      completedCount: 0,
      learnerCount: 0,
      updater: CURRENT_USER,
      updatedAt: n.text,
      refs: [],
      coursewares: editingCourse.coursewares.map(w => ({ ...w }))
    });
  }
  closeDrawer();
  toast(publish ? "已保存" : "已保存草稿", "ok");
  render();
}

            <div>${done ? '<span class="tag green">已完成</span>' : '<span class="tag gray">未完成</span>'}</div>
          ` : `<div>完成标准：看完全部文件</div><div>${cw.docDone ? '<span class="tag green">已完成</span>' : '<span class="tag gray">未完成</span>'}</div>`}

          <div class="hint">${w.type === "video" ? "视频 · " + (w.standard || "未设") + " 分钟" : "文档 · 看完全部文件"} · ${isCwDone(w) ? "已完成" : "未完成"}</div>
        </div>`).join("")}
      </div>
    </div>`;
  document.getElementById("leave-learn").onclick = () => { stopPlay(true); view = "learn"; render(); };
  document.querySelectorAll("[data-cw]").forEach(el => {
    el.onclick = () => {
      stopPlay(true);

      playerNote = "已切换课件";

  const toggle = document.getElementById("toggle-play");
  if (toggle) toggle.onclick = () => { playing ? pauseByUser() : startPlay(); };
  const seek = document.getElementById("seek");

    const note = document.querySelector(".play-status");

      const lines = note.querySelectorAll("div");
      if (lines[3]) lines[3].textContent = "当前播放位置：" + fmt(cw.position);
      if (lines[5]) lines[5].textContent = "状态：" + playerNote;
    }
  };
  const prev = document.getElementById("doc-prev");
  const next = document.getElementById("doc-next");
  const finish = document.getElementById("doc-finish");
  if (prev) prev.onclick = () => { cw.docPage = Math.max(1, cw.docPage - 1); render(); };
  if (next) next.onclick = () => { cw.docPage += 1; render(); };
  if (finish) finish.onclick = () => {
    cw.docDone = true;
    toast("已看完全部文件，文档课件完成", "ok");
    render();
  };
}
function isCwDone(w) {
  if (w.type === "doc") return !!w.docDone;
  const need = /^\d+$/.test(w.standard) ? Number(w.standard) * 60 : Infinity;
  return w.watched >= need;
}
function flushSync(cw) {
  lastSync = "观看进度 " + fmt(cw.watched) + " · 当前播放 " + fmt(cw.position);
  syncBucket = 0;
}
function startPlay() {
  const cw = currentCw();
  if (cw.type !== "video") return;
  if (!/^\d+$/.test(cw.standard) || Number(cw.standard) <= 0) {
    toast("请先在课程管理中填写该视频的完成标准", "warn");
    return;
  }
  if (isCwDone(cw)) { playerNote = "该视频已完成"; renderPlayer(); return; }
  playing = true;
  playerNote = "播放中，正在累计观看时长";
  clearInterval(playTimer);
  playTimer = setInterval(() => {
    const cur = currentCw();
    if (!playing || view !== "player" || cur.type !== "video") return stopPlay(false);
    cur.watched += 1;
    cur.position = Math.min(cur.duration, cur.position + 1);
    syncBucket += 1;
    if (syncBucket >= 5) flushSync(cur);
    const need = Number(cur.standard) * 60;
    if (cur.watched >= need) {
      flushSync(cur);
      playing = false;
      clearInterval(playTimer);
      playerNote = "累计观看时长已达到完成标准";
      toast("视频课件已完成", "ok");
    }
    if (view === "player") renderPlayer();
  }, 1000);
  renderPlayer();
}
function pauseByUser() {
  const cw = currentCw();
  if (cw.type === "video") flushSync(cw);
  playing = false;
  clearInterval(playTimer);
  playerNote = "已暂停，停止累计";
  if (view === "player") renderPlayer();
}
function stopPlay(sync) {
  if (sync && playing) {
    const cw = currentCw();
    if (cw && cw.type === "video") flushSync(cw);
  }
  playing = false;
  clearInterval(playTimer);
}
function pauseByLeave(reason) {
  if (view !== "player" || !playing) return;
  const cw = currentCw();
  if (!cw || cw.type !== "video") return;
  flushSync(cw);
  playing = false;
  clearInterval(playTimer);
  playerNote = reason;
  toast(reason, "warn");
  renderPlayer();
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) pauseByLeave("已切换窗口，视频已暂停");

function exportDetail() {
  const h = homeworks.find(x => x.id === detailHwId);
  const rows = detailRecords();
  if (!rows.length) return toast("当前没有可导出的数据", "warn");
  const headers = ["姓名","部门","完成状态","作业成绩","完成时间","关联项目"].concat(h.questions.map((_, i) => "题目" + (i+1)));
  const lines = [headers.join(",")];
  rows.forEach(r => {
    const base = [r.name, r.dept, r.done, r.grade, r.finishedAt, r.project];
    const answers = h.questions.map((_, i) => r.answers[i] || "");
    lines.push(base.concat(answers).map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
  });
  const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = h.name + "-作业明细.csv";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出当前筛选结果", "ok");
}

function sanitizePositive(value) {
  let v = String(value || "").replace(/[^\d.]/g, "");
  const dot = v.indexOf(".");
  if (dot >= 0) v = v.slice(0, dot + 1) + v.slice(dot + 1).replace(/\./g, "");
  return v;
}
function isPositive(value) {
  return /^\d+(\.\d+)?$/.test(String(value)) && Number(value) > 0;
}
function examById(id) { return exams.find(e => e.id === id); }
function examGate(ex) {
  if (!ex) return "missing";
  if (ex.attempts && ex.attempts[CURRENT_USER]) return "done";
  if (!(ex.members || []).includes(CURRENT_USER)) return "out";
  const start = Date.parse(String(ex.startAt || "").replace(/-/g, "/"));
  const end = Date.parse(String(ex.endAt || "").replace(/-/g, "/"));
  const now = Date.now();
  if (start && now < start) return "early";
  if (end && now > end) return "late";
  return "open";
}
function predecessorDone(item) {
  if (item.done) return true;
  if (item.kind !== "exam") return false;
  const gate = examGate(examById(item.examId));
  return gate === "done" || gate === "out" || gate === "late";
}
function isItemLocked(item) {
  if (project.order !== "按课程顺序") return false;
  const idx = project.items.findIndex(x => x.uid === item.uid);
  return idx > 0 && !predecessorDone(project.items[idx - 1]);
}
function itemKindTag(it) {
  if (it.kind === "homework") return ` <span class="tag orange">作业</span>`;
  if (it.kind === "exam") return ` <span class="tag blue">考试</span>`;
  return "";
}
function itemStatusTag(it) {
  if (it.kind === "homework") return tagOf("已上架");
  if (it.kind === "exam") return examTag((examById(it.examId) || {}).status || "未开始");
  return tagOf("已发布");
}

function renderExamStage(main, ex, afterSubmit) {
  if (!ex) { main.innerHTML = `<div class="exam-hold">未找到考试</div>`; return; }
  const gate = examGate(ex);
  const attempt = ex.attempts && ex.attempts[CURRENT_USER];
  if (attempt) { main.innerHTML = examResultHtml(ex, attempt); return; }
  if (gate === "out") { main.innerHTML = `<div class="exam-hold">你不在本场考试的参考人员范围内，暂时不可考试</div>`; return; }
  if (gate === "early") { main.innerHTML = `<div class="exam-hold">考试还未开始，暂时不可考试</div>`; return; }
  if (gate === "late") { main.innerHTML = `<div class="exam-hold">考试已结束，暂时不可考试</div>`; return; }
  main.innerHTML = `
    <div class="section-title">${esc(ex.name)}</div>
    <p class="help">${esc(ex.startAt)} 至 ${esc(ex.endAt)} · ${ex.durationMinutes ? "答题时长 " + ex.durationMinutes + " 分钟" : "不限时"} · 总分 ${ex.paperScore || 100} · 合格分 ${ex.passScore || 0}</p>
    ${(ex.questions || []).map((q, i) => `<div class="q-box">
      <div class="q-title">${i + 1}.（${esc(q.type)}，${q.score} 分）${esc(q.content)}</div>
      ${(q.options || []).map((opt, oi) => `<label class="opt-line"><input type="${q.type === "多选" ? "checkbox" : "radio"}" name="eq-${i}" value="${q.type === "判断" ? esc(opt) : optionLetter(oi)}"> <span>${q.type === "判断" ? "" : optionLetter(oi) + ". "}${esc(opt)}</span></label>`).join("")}
    </div>`).join("")}
    <button class="btn primary" id="submit-exam">提交答卷</button>`;
  const submit = document.getElementById("submit-exam");
  if (submit) submit.onclick = async () => {
    const picks = (ex.questions || []).map((q, i) => {
      const chosen = [...main.querySelectorAll(`input[name="eq-${i}"]:checked`)].map(el => el.value);
      return q.type === "多选" ? chosen.sort().join("") : (chosen[0] || "");
    });
    const unanswered = picks.filter(v => !v).length;
    const ok = await ask(unanswered ? "还有 " + unanswered + " 题未作答，确认提交？提交后不可修改。" : "确认提交答卷？提交后不可修改。");
    if (!ok) return;
    const details = ex.questions.map((q, i) => {
      const studentAnswer = picks[i];
      const correct = studentAnswer === q.answer;
      return { type: q.type, content: q.content, options: q.options, score: q.score, answer: q.answer, analysis: q.analysis || "", studentAnswer, correct, gotScore: correct ? q.score : 0 };
    });
    const score = details.reduce((sum, q) => sum + q.gotScore, 0);
    ex.attempts[CURRENT_USER] = { score, submittedAt: nowStamp().text, details };
    ex.attendedCount = Object.keys(ex.attempts).length;
    const grants = [];
    const grantPoint = (amount, reason) => {
      let user = pointUsers.find(u => u.name === CURRENT_USER);
      if (!user) {
        user = { id: Date.now(), name: CURRENT_USER, dept: "培训部", points: 0 };
        pointUsers.push(user);
      }
      user.points += Number(amount);
      pointLogs.push({ id: ++pointLogSeq, userId: user.id, type: "增加", points: Number(amount), reason, time: nowStamp().text, operator: CURRENT_USER });
    };
    projects.forEach(p => (p.items || []).forEach(it => {
      if (it.kind !== "exam" || it.examId !== ex.id) return;
      it.done = true;
      if (p.pointRule === "课程制" && isPositive(p.coursePoints) && !it.coursePointGranted) {
        it.coursePointGranted = true;
        grantPoint(p.coursePoints, "完成" + (p.name || "学习项目") + "中的" + ex.name);
        grants.push("课程积分 " + p.coursePoints);
      }
    }));
    let tip = "考试已完成，得分 " + score;
    if (isPositive(ex.points) && !(ex.pointsGranted && ex.pointsGranted[CURRENT_USER])) {
      ex.pointsGranted = ex.pointsGranted || {};
      ex.pointsGranted[CURRENT_USER] = true;
      grantPoint(ex.points, "完成" + ex.name);
      grants.push("考试积分 " + ex.points);
    }
    if (grants.length) tip += "，获得" + grants.join("，获得");
    toast(tip, "ok");
    if (afterSubmit) afterSubmit();
  };
}

function userLogs(userId) {

function filteredLogs() {
  return pointLogs.filter(row => {
    const user = pointUsers.find(u => u.id === row.userId);
    if (!user) return false;
    if (logFilter.name && !user.name.includes(logFilter.name.trim())) return false;
    if (logFilter.type && row.type !== logFilter.type) return false;
    const day = row.time.slice(0, 10);
    if (logFilter.from && day < logFilter.from) return false;
    if (logFilter.to && day > logFilter.to) return false;
    return true;
  }).sort((a, b) => b.time.localeCompare(a.time));
}
function downloadCsv(filename, headers, rows) {
  if (!rows.length) return toast("当前没有可导出的数据", "warn");
  const lines = [headers.join(",")].concat(rows.map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")));
  const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出当前筛选结果", "ok");
}

    const fileInput = document.getElementById("point-file");
    if (fileInput) fileInput.onchange = () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      fileName = file.name;
      const reader = new FileReader();
      reader.onload = () => { fileText = String(reader.result || ""); draw(); };
      reader.readAsText(file);
    };
    document.getElementById("op-cancel").onclick = closeDrawer;
    document.getElementById("op-save").onclick = () => {
      if (tab === "batch") return importPointFile();
      readSingle();
      if (!mode) return toast("请选择操作类型", "warn");
      if (!isPositive(points)) return toast("请输入大于 0 的数字", "warn");
      if (!selected.length) return toast("请选择人员", "warn");
      const value = Number(points);
      if (mode === "减少") {
        const lack = selected.map(id => pointUsers.find(u => u.id === id)).filter(u => value > u.points);
        if (lack.length) return toast("减少积分不能超过该人员当前积分：" + lack.map(u => u.name).join("、"), "warn");
      }
      selected.forEach(id => applyPointChange(pointUsers.find(u => u.id === id), mode, value, reason.trim()));
      closeDrawer();
      toast(mode === "增加" ? "已增加积分" : "已减少积分", "ok");
      render();
    };
  };
  function paintPeople() {
    const box = document.getElementById("people-panel");
    if (!box) return;
    if (!panelOpen) { box.innerHTML = ""; return; }
    box.innerHTML = `<div class="inline-panel">
      <div class="section-title">批量选择人员</div>
      ${pointUsers.map(u => `<label style="display:block;margin-bottom:8px"><input type="checkbox" class="people-check" value="${u.id}" ${selected.includes(u.id) ? "checked" : ""}> ${esc(u.name)} · ${esc(u.dept)} · 当前 ${u.points}</label>`).join("")}
      <button class="btn primary" id="people-ok" type="button">确定</button>
      <button class="btn" id="people-cancel" type="button">取消</button>
    </div>`;
    document.getElementById("people-cancel").onclick = () => { panelOpen = false; box.innerHTML = ""; };
    document.getElementById("people-ok").onclick = () => {
      readSingle();
      document.querySelectorAll(".people-check").forEach(el => {
        const id = Number(el.value);
        const idx = selected.indexOf(id);
        if (el.checked && idx < 0) selected.push(id);
        if (!el.checked && idx >= 0) selected.splice(idx, 1);
      });
      panelOpen = false;
      draw();
    };
  }
  function paintTpl() {
    const box = document.getElementById("tpl-preview");
    if (!box) return;
    if (!showTpl) { box.innerHTML = ""; return; }
    box.innerHTML = `<div class="inline-panel">
      <div class="section-title">积分批量处理模板</div>
      <table>
        <thead><tr><th>姓名</th><th>操作类型</th><th>积分</th><th>原因</th></tr></thead>
        <tbody><tr><td>张伟</td><td>增加积分</td><td>10</td><td>活动补发</td></tr></tbody>
      </table>
      <p class="help">操作类型填写「增加积分」或「减少积分」。减少积分不能超过该人员当前积分。</p>
      <button class="btn primary" id="export-tpl" type="button">导出为 Excel</button>
    </div>`;
    document.getElementById("export-tpl").onclick = () => downloadCsv("积分批量处理模板.csv", ["姓名", "操作类型", "积分", "原因"], [["张伟", "增加积分", "10", "活动补发"]]);
  }
  function importPointFile() {
    if (!fileName) return toast("未选择任何文件", "warn");
    const lines = fileText.replace(/^\uFEFF/, "").split(/\r?\n/).map(line => line.trim()).filter(Boolean);
    if (lines.length < 2) return toast("文件中没有可导入的数据", "warn");
    const body = lines.slice(1);
    const errors = [];
    let count = 0;
    body.forEach((line, index) => {
      const cells = line.split(",").map(cell => cell.replace(/^"|"$/g, "").trim());
      const [name, opText, scoreText, why] = cells;
      const user = pointUsers.find(u => u.name === name);
      const op = opText === "增加积分" || opText === "增加" ? "增加" : opText === "减少积分" || opText === "减少" ? "减少" : "";
      if (!user || !op || !isPositive(scoreText)) {
        errors.push("第 " + (index + 2) + " 行无法识别");
        return;
      }
      const value = Number(scoreText);
      if (op === "减少" && value > user.points) {
        errors.push(name + "减少积分不能超过当前积分");
        return;
      }
      applyPointChange(user, op, value, why || "");
      count += 1;
    });
    if (!count) return toast(errors[0] || "文件中没有可导入的数据", "warn");
    closeDrawer();
    toast(errors.length ? "已导入 " + count + " 条，" + errors[0] : "已导入 " + count + " 条", errors.length ? "warn" : "ok");
    render();
  }
  draw();
}
function openPointDetail(id) {
  const user = pointUsers.find(u => u.id === id);
  const rows = userLogs(id);
  openDrawer("积分明细 — " + user.name, `
    <table>
      <thead><tr><th>类型</th><th>积分</th><th>原因</th><th>时间</th><th>操作人</th></tr></thead>
      <tbody>${rows.map(row => `<tr>
        <td><span class="tag ${row.type === "增加" ? "green" : "red"}">${esc(row.type)}</span></td>
        <td>${row.points}</td>
        <td>${esc(row.reason || "—")}</td>
        <td>${esc(row.time)}</td>
        <td>${esc(row.operator)}</td>
      </tr>`).join("") || `<tr><td colspan="5" class="empty">暂无积分记录</td></tr>`}</tbody>
    </table>
  `, `<button class="btn" id="detail-close">关闭</button>`, "score");
  document.getElementById("detail-close").onclick = closeDrawer;
}
document.getElementById("toggle-home").onclick = () => {
  document.getElementById("menu-home").classList.toggle("open");
};
document.getElementById("toggle-learn").onclick = () => {
  document.getElementById("menu-learn").classList.toggle("open");
};
document.getElementById("toggle-exam").onclick = () => {
  document.getElementById("menu-exam").classList.toggle("open");
};
document.body.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (!nav) return;
  stopPlay(true);
  closeDrawer();
  view = nav.dataset.nav;
  render();
});

render();
</script>
</body>
</html>
