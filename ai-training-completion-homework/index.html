function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
function pad(n) { return String(n).padStart(2, "0"); }
function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  return pad(Math.floor(sec / 60)) + ":" + pad(sec % 60);
}
function fmtDur(sec) {
  if (!sec) return "—";

function formatDuration(seconds) {
  const s = Math.max(0, Math.floor(seconds || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const parts = [];
  if (h) parts.push(h + "小时");
  if (m) parts.push(m + "分");
  if (sec || !parts.length) parts.push(sec + "秒");
  return parts.join("");
}
function nowStamp() {
  const d = new Date();
  const text = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  const ts = Number(text.replace(/\D/g, ""));
  return { text, ts };
}
function videoTotal(list) {
  return list.filter(c => c.type === "video").reduce((s, c) => s + (c.duration || 0), 0);
}
function maxMinutes(duration) { return Math.floor((duration || 0) / 60); }
function toast(msg, type) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (type === "ok" ? " ok" : type === "warn" ? " warn" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = "toast"; }, 2200);
}
function ask(message) {
  return new Promise(resolve => {
    confirmResolve = resolve;
    document.getElementById("modal-body").textContent = message;
    document.getElementById("modal-mask").classList.add("show");
  });
}
document.getElementById("modal-cancel").onclick = () => {
  document.getElementById("modal-mask").classList.remove("show");
  if (confirmResolve) confirmResolve(false);
  confirmResolve = null;
};
document.getElementById("modal-ok").onclick = () => {
  document.getElementById("modal-mask").classList.remove("show");
  if (confirmResolve) confirmResolve(true);
  confirmResolve = null;
};

function openDrawer(title, html, foot, size) {
  const drawer = document.getElementById("drawer");
  drawer.className = "drawer show" + (size ? " " + size : "");
  document.getElementById("mask").classList.add("show");
  document.getElementById("drawer-title").textContent = title;
  document.getElementById("drawer-body").innerHTML = html;
  document.getElementById("drawer-foot").innerHTML = foot || "";
}
function closeDrawer() {
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("mask").classList.remove("show");
  document.getElementById("drawer-foot").innerHTML = "";
}
document.getElementById("drawer-close").onclick = closeDrawer;
document.getElementById("mask").onclick = closeDrawer;

function setCrumb(parts) {
  document.getElementById("crumb").innerHTML = parts.map((p, i) => {
    const sep = i ? '<span class="sep">/</span>' : "";
    return sep + '<span class="' + (i === parts.length - 1 ? "curr" : "") + '">' + esc(p.text) + "</span>";
  }).join("");
}

function render() {
  document.querySelectorAll(".menu-item[data-nav]").forEach(el => {
    el.classList.toggle("active", el.dataset.nav === (view === "player" ? "learn" : view === "hw-detail" ? "homework" : view));
  });
  if (view === "course") renderCourse();
  else if (view === "learn") renderLearn();
  else if (view === "player") renderPlayer();
  else if (view === "homework") renderHomework();
  else if (view === "hw-detail") renderDetail();
}

function courseStatusTag(status) {
  const cls = status === "已发布" ? "green" : status === "已下架" ? "red" : "gray";
  return `<span class="tag ${cls}">${esc(status)}</span>`;
}
function courseOps(c) {
  const ops = [];
  if (c.status !== "已下架") ops.push(`<button class="btn link" data-edit-course="${c.id}">编辑</button>`);
  if (c.status !== "已发布") ops.push(`<button class="btn link" data-course-act="publish" data-id="${c.id}">${c.status === "已下架" ? "重新发布" : "发布"}</button>`);
  else if (!c.referenceCount) ops.push(`<button class="btn link" data-course-act="offline" data-id="${c.id}">下架</button>`);
  if (c.status === "草稿") ops.push(`<button class="btn link danger" data-course-act="del" data-id="${c.id}">删除</button>`);
  return ops.join("");
}

async function onCourseAction(id, act) {
  const c = courses.find(x => x.id === id);
  if (!c) return;
  if (act === "publish") {
    if (!c.coursewares.length) return toast("发布前请至少添加一个课件", "warn");
    const ok = await ask("确认" + (c.status === "已下架" ? "重新发布" : "发布") + "课程「" + c.name + "」？");
    if (!ok) return;
    c.status = "已发布";
    toast("发布成功", "ok");
    render();
    return;
  }
  if (act === "offline") {
    const ok = await ask("确认下架课程「" + c.name + "」？");
    if (!ok) return;
    c.status = "已下架";
    toast("下架成功", "ok");
    render();
    return;
  }
  if (act === "del") {
    const ok = await ask("确认删除草稿课程「" + c.name + "」？");
    if (!ok) return;
    courses.splice(courses.findIndex(x => x.id === id), 1);
    toast("删除成功", "ok");
    render();
  }
}

function cloneCoursewares(list) {
  return list.map(c => ({ ...c }));
}
function openCourseEditor(id) {
  courseMode = id ? "edit" : "create";
  if (id) {
    const src = courses.find(c => c.id === id);
    editingCourse = { id: src.id, name: src.name, category: src.category, status: src.status, coursewares: cloneCoursewares(src.coursewares) };
  } else {
    editingCourse = { id: 0, name: "", category: "产品知识", status: "草稿", coursewares: [] };
  }
  drawCourseEditor();
}
function drawCourseEditor() {

  openDrawer(courseMode === "edit" ? "编辑课程" : "新建课程", `

            : `<span class="hint">看完全部文件</span>`}</td>
          <td><button class="btn link danger" data-del-cw="${w.uid}">删除</button></td>
        </tr>`).join("") || `<tr><td colspan="6" class="empty">请添加课件</td></tr>`}
      </tbody>
    </table>
    <p class="help">视频填写观看分钟数，达到该时长即完成，且不能超过该视频时长和课程总时长。文档不填写分钟数，看完全部文件即完成。</p>
  `, published
    ? `<button class="btn" id="c-cancel">取消</button><button class="btn primary" id="c-save">保存全部修改</button>`
    : `<button class="btn" id="c-cancel">取消</button><button class="btn" id="c-draft">保存草稿</button><button class="btn primary" id="c-publish">保存并发布</button>`);
  bindCourseEditor();

function bindCourseEditor() {
  const name = document.getElementById("c-name");
  if (name) name.oninput = () => { editingCourse.name = name.value; };
  document.querySelectorAll(".std-input").forEach(input => {
    input.oninput = () => {
      input.value = input.value.replace(/\D/g, "");
      const w = editingCourse.coursewares.find(x => x.uid === Number(input.dataset.uid));
      if (w) { w.standard = input.value; w._err = false; }
      input.classList.remove("err");
    };
  });
  document.querySelectorAll("[data-del-cw]").forEach(btn => {
    btn.onclick = () => {
      editingCourse.coursewares = editingCourse.coursewares.filter(w => w.uid !== Number(btn.dataset.delCw));
      drawCourseEditor();
    };
  });
  const add = document.getElementById("add-cw");
  if (add) add.onclick = () => toggleAddPanel();
  const cancel = document.getElementById("c-cancel");
  if (cancel) cancel.onclick = closeDrawer;
  const save = document.getElementById("c-save");
  if (save) save.onclick = () => saveCourse(true);
  const draft = document.getElementById("c-draft");
  if (draft) draft.onclick = () => saveCourse(false);
  const pub = document.getElementById("c-publish");
  if (pub) pub.onclick = () => saveCourse(true);
}
function toggleAddPanel() {
  const box = document.getElementById("cw-panel");
  if (!box) return;
  if (box.dataset.open === "1") { box.innerHTML = ""; box.dataset.open = ""; return; }
  box.dataset.open = "1";
  box.innerHTML = `

      <div class="form-row"><div class="form-label">课件类型</div><div class="form-ctrl radios">
        <label><input type="radio" name="cw-type" value="video" checked> 视频</label>
        <label><input type="radio" name="cw-type" value="doc"> 文档</label>
      </div></div>
      <div class="form-row"><div class="form-label"><span class="req">*</span>课件名称</div>
        <div class="form-ctrl"><input class="input" id="cw-name" maxlength="50" placeholder="请输入课件名称" style="width:320px"></div></div>
      <div class="form-row"><div class="form-label"><span class="req">*</span>上传文件</div>
        <div class="form-ctrl"><button class="btn" id="cw-file" type="button">选择文件</button><span class="hint" id="cw-file-name" style="margin-left:8px">视频将解析时长，文档按全部文件完成</span></div></div>
      <button class="btn primary" id="cw-ok">确定</button>
      <button class="btn" id="cw-cancel">取消</button>
    </div>`;
  let fileReady = false;
  let fileDuration = 300;
  document.getElementById("cw-file").onclick = () => {
    fileReady = true;
    const type = document.querySelector('input[name="cw-type"]:checked').value;
    fileDuration = type === "video" ? 300 : 0;
    document.getElementById("cw-file-name").textContent = type === "video" ? "已选择视频文件，时长 5 分钟" : "已选择文档文件";
  };
  document.getElementById("cw-cancel").onclick = () => { box.innerHTML = ""; box.dataset.open = ""; };
  document.getElementById("cw-ok").onclick = () => {
    const type = document.querySelector('input[name="cw-type"]:checked').value;
    const title = document.getElementById("cw-name").value.trim();
    if (!title) return toast("请输入课件名称", "warn");
    if (!fileReady) return toast("请上传课件文件", "warn");
    if (editingCourse.coursewares.some(w => w.name === title)) return toast("同一课程下课件名称不可重复", "warn");
    editingCourse.coursewares.push({
      uid: ++uidSeq, name: title, type, duration: type === "video" ? fileDuration : 0,
      pages: type === "doc" ? 3 : 0, standard: "", watched: 0, position: 0, docPage: 1, docDone: false
    });
    drawCourseEditor();
  };
}
function validateStandards() {
  const total = videoTotal(editingCourse.coursewares);
  let ok = true;
  editingCourse.coursewares.forEach(w => {
    w._err = false;
    if (w.type !== "video") return;
    if (!w.standard) { w._err = true; ok = false; toast("请填写视频课件的完成标准", "warn"); return; }
    if (!/^\d+$/.test(w.standard) || Number(w.standard) <= 0) { w._err = true; ok = false; toast("完成标准仅可输入大于 0 的数字", "warn"); return; }
    const seconds = Number(w.standard) * 60;
    if (seconds > w.duration) { w._err = true; ok = false; toast("完成标准不能超过该视频时长", "warn"); return; }
    if (seconds > total) { w._err = true; ok = false; toast("完成标准不能超过课程总时长", "warn"); }
  });
  return ok;
}
function saveCourse(publish) {
  editingCourse.name = (document.getElementById("c-name")?.value || "").trim();
  if (!editingCourse.name) return toast("请输入课程名称", "warn");
  if (publish && !editingCourse.coursewares.length) return toast("发布前请至少添加一个课件", "warn");
  if (!validateStandards()) { drawCourseEditor(); return; }
  if (courseMode === "edit") {
    const src = courses.find(c => c.id === editingCourse.id);
    src.name = editingCourse.name;
    src.coursewares = editingCourse.coursewares.map(w => ({ ...w }));
    const active = src.coursewares.find(w => w.uid === activeCwUid);
    if (!active && src.coursewares[0]) activeCwUid = src.coursewares[0].uid;
  } else if (editingCourse.name) {
    const n = nowStamp();
    courses.push({
      ...editingCourse,
      id: ++uidSeq,
      status: publish ? "已发布" : "草稿",
      isPublic: true,
      referenceCount: 0,
      completedCount: 0,
      learnerCount: 0,
      updater: CURRENT_USER,
      updatedAt: n.text,
      refs: [],
      coursewares: editingCourse.coursewares.map(w => ({ ...w }))
    });
  }
  closeDrawer();
  toast(publish ? "已保存" : "已保存草稿", "ok");
  render();
}

function renderPlayer() {
  const course = currentCourse();
  const cw = currentCw();
  setCrumb([{ text: "在线学习" }, { text: "我的学习", nav: "learn" }, { text: "课程学习" }]);
  const standardSec = cw.type === "video" && /^\d+$/.test(cw.standard) ? Number(cw.standard) * 60 : 0;
  const done = cw.type === "video" ? cw.watched >= standardSec && standardSec > 0 : cw.docDone;
  document.getElementById("app").innerHTML = `
    <div class="back-row"><button class="btn" id="leave-learn">返回我的学习</button></div>
    <div class="player-wrap">
      <div>
        <div class="stage">
          ${cw.type === "video" ? `
            <div class="stage-view" id="stage">${playing ? "正在播放 " + esc(cw.name) : done ? "该视频已完成" : esc(cw.name)}</div>
            <div class="controls">
              <button class="btn" id="toggle-play">${playing ? "暂停" : "播放"}</button>
              <span class="time" id="play-clock">${fmt(cw.position)} / ${fmt(cw.duration)}</span>
              <input type="range" id="seek" min="0" max="${cw.duration}" value="${cw.position}">
            </div>` : `
            <div class="doc-page"><div>第 ${cw.docPage} / ${cw.pages} 页<br>${esc(cw.name)}</div></div>
            <div class="controls">
              <button class="btn" id="doc-prev" ${cw.docPage <= 1 ? "disabled" : ""}>上一页</button>
              <span class="time">第 ${cw.docPage} / ${cw.pages} 页</span>
              ${cw.docPage < cw.pages
                ? `<button class="btn primary" id="doc-next">下一页</button>`
                : `<button class="btn primary" id="doc-finish" ${cw.docDone ? "disabled" : ""}>完成阅读</button>`}
            </div>`}
        </div>
        <div class="play-status">
          <div>课件：${esc(cw.name)}（${cw.type === "video" ? "视频" : "文档"}）</div>
          ${cw.type === "video" ? `
            <div>完成标准：${cw.standard ? esc(cw.standard) + " 分钟" : "未设置"}</div>
            <div>已观看：${fmt(cw.watched)}（仅统计点击播放到暂停或退出的时间）</div>
            <div>当前播放位置：${fmt(cw.position)}</div>
            <div>最近同步：${esc(lastSync)}</div>
            <div>状态：${esc(playerNote)}</div>
            <div>${done ? '<span class="tag green">已完成</span>' : '<span class="tag gray">未完成</span>'}</div>
          ` : `<div>完成标准：看完全部文件</div><div>${cw.docDone ? '<span class="tag green">已完成</span>' : '<span class="tag gray">未完成</span>'}</div>`}
        </div>
      </div>
      <div class="card">
        <div class="section-title" style="margin:12px">${esc(course.name)}</div>
        ${course.coursewares.map(w => `<div class="side-item ${w.uid === cw.uid ? "active" : ""}" data-cw="${w.uid}">
          <div>${esc(w.name)}</div>
          <div class="hint">${w.type === "video" ? "视频 · " + (w.standard || "未设") + " 分钟" : "文档 · 看完全部文件"} · ${isCwDone(w) ? "已完成" : "未完成"}</div>
        </div>`).join("")}
      </div>
    </div>`;
  document.getElementById("leave-learn").onclick = () => { stopPlay(true); view = "learn"; render(); };
  document.querySelectorAll("[data-cw]").forEach(el => {
    el.onclick = () => {
      stopPlay(true);
      activeCwUid = Number(el.dataset.cw);
      playerNote = "已切换课件";
      render();
    };
  });
  const toggle = document.getElementById("toggle-play");
  if (toggle) toggle.onclick = () => { playing ? pauseByUser() : startPlay(); };
  const seek = document.getElementById("seek");
  if (seek) seek.oninput = () => {
    cw.position = Number(seek.value);
    playerNote = "拖动进度条只改变播放位置，不增加观看时长";
    const clock = document.getElementById("play-clock");
    if (clock) clock.textContent = fmt(cw.position) + " / " + fmt(cw.duration);
    const note = document.querySelector(".play-status");
    if (note) {
      const lines = note.querySelectorAll("div");
      if (lines[3]) lines[3].textContent = "当前播放位置：" + fmt(cw.position);
      if (lines[5]) lines[5].textContent = "状态：" + playerNote;
    }
  };
  const prev = document.getElementById("doc-prev");
  const next = document.getElementById("doc-next");
  const finish = document.getElementById("doc-finish");
  if (prev) prev.onclick = () => { cw.docPage = Math.max(1, cw.docPage - 1); render(); };
  if (next) next.onclick = () => { cw.docPage += 1; render(); };
  if (finish) finish.onclick = () => {
    cw.docDone = true;
    toast("已看完全部文件，文档课件完成", "ok");
    render();
  };
}
function isCwDone(w) {
  if (w.type === "doc") return !!w.docDone;
  const need = /^\d+$/.test(w.standard) ? Number(w.standard) * 60 : Infinity;
  return w.watched >= need;
}
function flushSync(cw) {
  lastSync = "观看进度 " + fmt(cw.watched) + " · 当前播放 " + fmt(cw.position);
  syncBucket = 0;
}
function startPlay() {
  const cw = currentCw();
  if (cw.type !== "video") return;
  if (!/^\d+$/.test(cw.standard) || Number(cw.standard) <= 0) {
    toast("请先在课程管理中填写该视频的完成标准", "warn");
    return;
  }
  if (isCwDone(cw)) { playerNote = "该视频已完成"; renderPlayer(); return; }
  playing = true;
  playerNote = "播放中，正在累计观看时长";
  clearInterval(playTimer);
  playTimer = setInterval(() => {
    const cur = currentCw();
    if (!playing || view !== "player" || cur.type !== "video") return stopPlay(false);
    cur.watched += 1;
    cur.position = Math.min(cur.duration, cur.position + 1);
    syncBucket += 1;
    if (syncBucket >= 5) flushSync(cur);
    const need = Number(cur.standard) * 60;
    if (cur.watched >= need) {
      flushSync(cur);
      playing = false;
      clearInterval(playTimer);
      playerNote = "累计观看时长已达到完成标准";
      toast("视频课件已完成", "ok");
    }
    if (view === "player") renderPlayer();
  }, 1000);
  renderPlayer();
}
function pauseByUser() {
  const cw = currentCw();
  if (cw.type === "video") flushSync(cw);
  playing = false;
  clearInterval(playTimer);
  playerNote = "已暂停，停止累计";
  if (view === "player") renderPlayer();
}
function stopPlay(sync) {
  if (sync && playing) {
    const cw = currentCw();
    if (cw && cw.type === "video") flushSync(cw);
  }
  playing = false;
  clearInterval(playTimer);
}
function pauseByLeave(reason) {
  if (view !== "player" || !playing) return;
  const cw = currentCw();
  if (!cw || cw.type !== "video") return;
  flushSync(cw);
  playing = false;
  clearInterval(playTimer);
  playerNote = reason;
  toast(reason, "warn");
  renderPlayer();
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) pauseByLeave("已切换窗口，视频已暂停");
});
window.addEventListener("blur", () => pauseByLeave("已切换窗口，视频已暂停"));
document.addEventListener("mouseout", e => {
  if (!e.relatedTarget && !e.toElement) pauseByLeave("鼠标离开当前窗口，视频已暂停");
});

    .sort((a, b) => b.ts - a.ts);

function hwActions(h) {
  const ops = [{ k: "detail", t: "明细" }];
  if (h.status === "草稿") ops.push({ k: "edit", t: "编辑" }, { k: "up", t: "上架" }, { k: "del", t: "删除" });
  else if (h.status === "上架") ops.push({ k: "edit", t: "编辑" }, { k: "down", t: "下架" });
  else ops.push({ k: "up", t: "上架" });
  return ops.map(o => `<button class="btn link ${o.k==="del"?"danger":""}" data-hw-act="${o.k}" data-id="${h.id}">${o.t}</button>`).join("");
}
async function onHwAction(id, act) {
  const h = homeworks.find(x => x.id === id);
  if (!h) return;
  if (act === "detail") {
    detailHwId = id;
    detailFilter = { name: "", status: "", project: "" };
    view = "hw-detail";
    render();
    return;
  }
  if (act === "edit") return openHwEditor(id);
  if (act === "del") {
    const ok = await ask("确认删除草稿作业「" + h.name + "」？");
    if (!ok) return;
    const idx = homeworks.findIndex(x => x.id === id);
    homeworks.splice(idx, 1);
    toast("删除成功", "ok");
    render();
    return;
  }
  if (act === "up") {
    if (!h.questions.length) return toast("请至少添加一道题目后再上架", "warn");
    const ok = await ask("确认上架作业「" + h.name + "」？");
    if (!ok) return;
    h.status = "上架";
    touchHw(h);
    toast("上架成功", "ok");
    render();
    return;
  }
  if (act === "down") {
    const ok = await ask("确认下架作业「" + h.name + "」？");
    if (!ok) return;
    h.status = "下架";
    touchHw(h);
    toast("下架成功", "ok");
    render();
  }
}
function touchHw(h) {
  const n = nowStamp();
  h.updatedAt = n.text;
  h.ts = n.ts;
  h.updater = CURRENT_USER;
}

function openHwEditor(id) {
  if (id) {
    const src = homeworks.find(x => x.id === id);
    editHw = { id: src.id, name: src.name, questions: src.questions.map(q => ({ title: q.title })) };
  } else {
    editHw = { id: 0, name: "", questions: [] };
  }
  drawHwEditor();
}
function drawHwEditor() {
  openDrawer(editHw.id ? "编辑作业" : "新增作业", `
    <div class="form-row"><div class="form-label"><span class="req">*</span>作业名称</div>
      <div class="form-ctrl"><input class="input" id="hw-edit-name" style="width:100%" value="${esc(editHw.name)}" placeholder="请输入作业名称"></div></div>
    <div class="cw-bar"><button class="btn primary" id="add-q">新增题目</button><span class="hint" style="margin-left:auto">题目均为问答题，题目名称不超过 200 字</span></div>
    <div id="q-list">
      ${editHw.questions.map((q, i) => `<div class="q-item">
        <div class="q-hd"><span>题目 ${i+1}</span><span class="tag blue">问答题</span><button class="btn link danger" data-del-q="${i}">删除</button></div>
        <textarea class="input" data-q="${i}" maxlength="200" rows="3" style="width:100%" placeholder="请输入题目名称">${esc(q.title)}</textarea>
        <div class="count"><span class="q-count">${q.title.length}</span>/200</div>
      </div>`).join("") || `<div class="empty">请新增题目</div>`}
    </div>
  `, `<button class="btn" id="hw-edit-cancel">取消</button><button class="btn primary" id="hw-edit-save">保存</button>`);
  document.getElementById("hw-edit-name").oninput = e => { editHw.name = e.target.value; };
  document.querySelectorAll("[data-q]").forEach(el => {
    el.oninput = () => {
      editHw.questions[Number(el.dataset.q)].title = el.value;
      el.parentElement.querySelector(".q-count").textContent = el.value.length;
    };
  });
  document.querySelectorAll("[data-del-q]").forEach(btn => {
    btn.onclick = () => {
      editHw.name = document.getElementById("hw-edit-name").value;
      editHw.questions.splice(Number(btn.dataset.delQ), 1);
      drawHwEditor();
    };
  });
  document.getElementById("add-q").onclick = () => {
    editHw.name = document.getElementById("hw-edit-name").value;
    editHw.questions.push({ title: "" });
    drawHwEditor();
  };
  document.getElementById("hw-edit-cancel").onclick = closeDrawer;
  document.getElementById("hw-edit-save").onclick = saveHw;
}
function saveHw() {
  editHw.name = document.getElementById("hw-edit-name").value.trim();
  if (!editHw.name) return toast("请输入作业名称", "warn");
  if (editHw.questions.some(q => !q.title.trim())) return toast("请输入题目名称", "warn");
  if (editHw.questions.some(q => q.title.trim().length > 200)) return toast("题目名称不超过 200 字", "warn");
  editHw.questions = editHw.questions.map(q => ({ title: q.title.trim() }));
  if (editHw.id) {
    const src = homeworks.find(x => x.id === editHw.id);
    src.name = editHw.name;
    src.questions = editHw.questions;
    touchHw(src);
  } else {
    const n = nowStamp();
    homeworks.push({
      id: ++hwSeq, name: editHw.name, status: "草稿", updater: CURRENT_USER, updatedAt: n.text, ts: n.ts,
      questions: editHw.questions, refs: [], records: []
    });
  }
  closeDrawer();
  toast("已保存", "ok");
  view = "homework";
  render();
}

function detailRecords() {
  const h = homeworks.find(x => x.id === detailHwId);
  if (!h) return [];
  return h.records.filter(r => {
    if (detailFilter.name && !r.name.includes(detailFilter.name.trim())) return false;
    if (detailFilter.status && r.done !== detailFilter.status) return false;
    if (detailFilter.project && !r.project.includes(detailFilter.project.trim())) return false;
    return true;
  });
}

  return `<span class="tag ${cls}">${esc(grade)}</span>`;
}

function openScore(mode, idx) {
  const h = homeworks.find(x => x.id === detailHwId);
  const rows = detailRecords();
  scoreRecord = rows[idx];
  scoreMode = mode;
  draftGrade = scoreRecord.grade || "";
  const title = (mode === "score" ? "评分 — " : "查看作业 — ") + scoreRecord.name;
  openDrawer(title, `
    ${h.questions.map((q, i) => `<div>
      <div class="q-hd"><b>题目 ${i+1}</b><span class="tag blue">问答题</span></div>
      <div>${esc(q.title)}</div>
      <div class="answer">${esc(scoreRecord.answers[i] || "未作答")}</div>
    </div>`).join("")}
    <div class="section-title">作业成绩</div>
    <div class="grade-list" id="grade-list">
      ${GRADES.map(g => `<label><input type="radio" name="grade" value="${g}" ${draftGrade===g?"checked":""}>${g}</label>`).join("")}
    </div>
    <p class="help">单选。需保存后才会更新列表中的成绩，列表展示最近一次保存结果。</p>
  `, `<button class="btn" id="score-cancel">取消</button><button class="btn primary" id="score-save" ${draftGrade?"":"disabled"}>保存</button>`, "score");
  document.getElementById("grade-list").onchange = e => {
    if (e.target.name === "grade") {
      draftGrade = e.target.value;
      document.getElementById("score-save").disabled = !draftGrade;
    }
  };
  document.getElementById("score-cancel").onclick = closeDrawer;
  document.getElementById("score-save").onclick = () => {
    if (!draftGrade) return toast("请选择作业成绩", "warn");
    scoreRecord.grade = draftGrade;
    closeDrawer();
    toast(scoreMode === "score" ? "成绩已保存" : "成绩已更新", "ok");
    render();
  };
}
function exportDetail() {
  const h = homeworks.find(x => x.id === detailHwId);
  const rows = detailRecords();
  if (!rows.length) return toast("当前没有可导出的数据", "warn");
  const headers = ["姓名","部门","完成状态","作业成绩","完成时间","关联项目"].concat(h.questions.map((_, i) => "题目" + (i+1)));
  const lines = [headers.join(",")];
  rows.forEach(r => {
    const base = [r.name, r.dept, r.done, r.grade, r.finishedAt, r.project];
    const answers = h.questions.map((_, i) => r.answers[i] || "");
    lines.push(base.concat(answers).map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
  });
  const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = h.name + "-作业明细.csv";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出当前筛选结果", "ok");
}

document.getElementById("toggle-learn").onclick = () => {
  document.getElementById("menu-learn").classList.toggle("open");
};
document.body.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (!nav) return;
  stopPlay(true);
  closeDrawer();
  view = nav.dataset.nav;
  render();
});

render();
</script>
