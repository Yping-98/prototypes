<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体验营-服务期冷静期录入拦截</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; color: #303133; background: #f0f2f5; }
.layout { display: flex; min-height: 100vh; }
.side { width: 224px; background: #001529; color: rgba(255,255,255,.75); flex-shrink: 0; }
.side .logo { height: 52px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: 600; background: #002140; }
.side .menu-item { height: 50px; display: flex; align-items: center; padding: 0 24px; cursor: pointer; gap: 10px; }
.side .menu-item:hover { color: #fff; }
.side .menu-item.active { color: #fff; background: #1890ff; }
.side .sub { background: #000c17; }
.side .sub .menu-item { padding-left: 48px; height: 44px; }
.side .ico { width: 14px; height: 14px; border: 1.5px solid currentColor; border-radius: 50%; display: inline-block; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 46px; background: #fff; display: flex; align-items: center; padding: 0 16px; color: #909399; border-bottom: 1px solid #ebeef5; }
.tags { background: #fff; padding: 12px 40px; border-bottom: 1px solid #dcdfe6; display: flex; }
.tags .tag { border: 1px solid #dcdfe6; padding: 6px 20px; margin-right: -1px; cursor: pointer; background: #fff; }
.tags .tag.active { color: #409eff; }
#diffPage { flex: 1; padding: 20px; position: relative; overflow: auto; }
.card { background: #fff; border-radius: 6px; padding: 15px; }
.search-bar { display: flex; align-items: center; gap: 10px; }
.sel, .ipt { height: 32px; border: 1px solid #dcdfe6; border-radius: 4px; padding: 0 10px; font-size: 14px; color: #606266; background: #fff; }
.ipt:focus, .sel:focus { outline: none; border-color: #409eff; }
.btn { height: 32px; padding: 0 15px; border-radius: 4px; border: 1px solid #dcdfe6; background: #fff; cursor: pointer; font-size: 14px; color: #606266; }
.btn.primary { background: #409eff; border-color: #409eff; color: #fff; }
.btn.light { background: #ecf5ff; border-color: #b3d8ff; color: #409eff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.tabs { margin-top: 20px; border: 1px solid #dcdfe6; }
.tabs-head { display: flex; background: #f5f7fa; border-bottom: 1px solid #e4e7ed; }
.tabs-head div { padding: 0 20px; height: 40px; line-height: 40px; color: #909399; cursor: pointer; }
.tabs-head div.active { background: #fff; color: #409eff; border-right: 1px solid #e4e7ed; border-left: 1px solid #e4e7ed; margin-bottom: -1px; }
.tabs-body { padding: 15px 20px; min-height: 260px; }
.desc-row { display: flex; padding: 9px 0; line-height: 22px; }
.desc-row .lb { width: 96px; color: #303133; flex-shrink: 0; }
.desc-row .ct { color: #606266; }
.remind, .desc-row .ct.remind, .desc-row .remind { color: #f56c6c; }
.ok, .desc-row .ct.ok { color: #67c23a; }
.muted { color: #909399; }
.tip { margin-top: 10px; color: #909399; font-size: 13px; }
.empty { text-align: center; color: #909399; padding: 60px 0; }
.loading { text-align: center; color: #409eff; padding: 60px 0; }
.filter { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
.filter label { color: #606266; }
.toolbar { display: flex; justify-content: space-between; margin-bottom: 12px; }
.toolbar .right { display: flex; gap: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { border-bottom: 1px solid #ebeef5; padding: 10px 8px; text-align: left; }
th { background: #f5f7fa; color: #909399; font-weight: 500; }
.mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 10vh; z-index: 50; }
.dialog { background: #fff; border-radius: 4px; width: 560px; max-width: 94vw; position: relative; }
.dialog.wide { width: 760px; }
.dialog .hd { padding: 18px 20px 10px; font-size: 16px; display: flex; justify-content: space-between; }
.dialog .hd .x { cursor: pointer; color: #909399; }
.dialog .bd { padding: 10px 20px 20px; }
.dialog .ft { padding: 10px 20px 20px; display: flex; justify-content: flex-end; gap: 10px; align-items: center; }
.form-row { display: flex; align-items: center; margin-bottom: 18px; }
.form-row .lb { width: 96px; text-align: right; padding-right: 12px; color: #606266; }
.form-row .lb i { color: #f56c6c; font-style: normal; margin-right: 2px; }
.form-row .ipt, .form-row .sel { flex: 1; }
.form-err { color: #f56c6c; font-size: 13px; margin-right: auto; }
.upload { border: 1px dashed #d9d9d9; border-radius: 6px; padding: 26px; text-align: center; color: #606266; cursor: pointer; }
.upload.has { border-color: #409eff; color: #409eff; }
.note { background: #f4f4f5; color: #606266; font-size: 13px; padding: 10px 12px; border-radius: 4px; margin-top: 14px; line-height: 20px; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 4px; font-size: 14px; z-index: 99; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
.toast.error { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
.toast.success { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
.pill { display: inline-block; padding: 0 8px; border-radius: 3px; font-size: 12px; line-height: 20px; }
.pill.fail { background: #fef0f0; color: #f56c6c; }
.pill.succ { background: #f0f9eb; color: #67c23a; }
.link { color: #409eff; cursor: pointer; }
.sum { margin-bottom: 12px; color: #606266; }
@media (max-width: 760px) { .side { display: none; } .tags { padding: 10px; } }
</style>
</head>
<body>
<div class="layout">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="topbar" id="crumb">线索查询</div>
    <div class="tags" id="tags"></div>
    <div id="diffPage"><div id="view"></div></div>
  </div>
</div>
<div id="dialogHost"></div>
<div id="toastHost"></div>

<script>
var LEADS = {
  '13800000009': { key: 'inService', phone: '13800000009', onionId: '108700009', name: '王晓雨', period: '体验营 2026-11-01 09:00:00 ~ 2027-01-31 23:59:59', inCamp: true, calm: [], entry: null },
  '13800000001': { key: 'svcCalm', phone: '13800000001', onionId: '108700001', name: '', period: '', calm: [{ t: '服务期冷静期', end: '2026-12-20 14:20:51' }], entry: { ok: false, msg: '该线索在服务期冷静期中，无法录入。' } },
  '13800000002': { key: 'followCalm', phone: '13800000002', onionId: '108700002', name: '', period: '', calm: [{ t: '跟进冷静期', end: '2026-12-05 10:00:00' }], entry: { ok: false, msg: '该线索在跟进冷静期中，无法录入' } },
  '13800000006': { key: 'bothCalm', phone: '13800000006', onionId: '108700006', name: '', period: '', calm: [{ t: '服务期冷静期', end: '2026-12-20 14:20:51' }, { t: '跟进冷静期', end: '2026-12-05 10:00:00' }], entry: { ok: false, msg: '该线索在服务期冷静期中，无法录入。' } },
  '15971423839': { key: 'otherTeam', phone: '15971423839', onionId: '108743046', name: '', period: '电销/网销 2026-09-01 13:45:31 ~ 2027-02-28 14:20:51', calm: [], entry: { ok: false, msg: '该客户在其他业务线服务期，无法录入' } },
  '13800000003': { key: 'newLead', phone: '13800000003', onionId: '108700003', name: '', period: '', calm: [], entry: { ok: true, msg: '该线索可录入至当期客户' } },
  '13800000004': { key: 'oldLead', phone: '13800000004', onionId: '108700004', name: '', period: '', calm: [], entry: { ok: true, msg: '该线索可录入至数据库' } },
  '13800000007': { key: 'locked', phone: '13800000007', onionId: '108700007', name: '', period: '', calm: [], entry: { ok: false, msg: '该线索锁定时间未过期' } },
  '13800000008': { key: 'queryFail', phone: '13800000008', onionId: '108700008', name: '', period: '', calm: null, entry: { ok: false, msg: '暂无法判断是否可录入，请稍后重试' } }
};
var DEMO_PHONE = {};
Object.keys(LEADS).forEach(function (p) { DEMO_PHONE[LEADS[p].key] = p; });
var SVC_CALM = ['13800000001', '13800000006'];

var PAGES = { current: '客户管理-当期客户', pool: '客户管理-数据库', clueSearch: '线索查询' };
var state = {
  page: 'clueSearch', opened: ['current', 'clueSearch'], qType: 'phone', qValue: '15971423839', info: null, loading: false, errMsg: '',
  dialog: null, one: { phone: '', channel: '人工录入', seat: '', err: '' }, batchFile: '', poolTab: 'tpl', poolDetail: false
};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function remeasure() { if (window.__diffRemeasure) window.__diffRemeasure(); }
function toast(type, msg) {
  var host = document.getElementById('toastHost');
  host.innerHTML = '<div class="toast ' + type + '">' + esc(msg) + '</div>';
  clearTimeout(toast.t); toast.t = setTimeout(function () { host.innerHTML = ''; }, 2600);
}

function renderSide() {
  var html = '<div class="logo">体验营</div>';
  var custActive = state.page === 'current' || state.page === 'pool';
  html += '<div class="menu-item' + (custActive ? '' : '') + '"><span class="ico"></span>客户管理</div><div class="sub">';
  html += '<div class="menu-item' + (state.page === 'current' ? ' active' : '') + '" onclick="go(\'current\')">当期客户</div>';
  html += '<div class="menu-item' + (state.page === 'pool' ? ' active' : '') + '" onclick="go(\'pool\')">数据库</div></div>';
  html += '<div class="menu-item"><span class="ico"></span>AB号审核</div>';
  html += '<div class="menu-item' + (state.page === 'clueSearch' ? ' active' : '') + '" onclick="go(\'clueSearch\')"><span class="ico"></span>线索查询</div>';
  html += '<div class="menu-item"><span class="ico"></span>线索追溯</div><div class="menu-item"><span class="ico"></span>专属售卖链接</div><div class="menu-item"><span class="ico"></span>转介绍</div><div class="menu-item"><span class="ico"></span>裂变活动</div>';
  document.getElementById('side').innerHTML = html;
}
function renderTags() {
  document.getElementById('crumb').textContent = PAGES[state.page];
  document.getElementById('tags').innerHTML = state.opened.map(function (p) {
    return '<div class="tag' + (p === state.page ? ' active' : '') + '" onclick="go(\'' + p + '\')">' + PAGES[p] + '</div>';
  }).join('');
}
function go(p) { state.page = p; if (state.opened.indexOf(p) < 0) state.opened.push(p); state.dialog = null; render(); }

function calmHtml(info) {
  if (info.calm === null) return '<span class="remind">冷静期查询失败，请稍后重试</span>';
  if (!info.calm.length) return '<span>无冷静期</span>';
  return info.calm.map(function (c) { return '<div class="remind">' + c.t + ' 至 ' + c.end + '</div>'; }).join('');
}
function renderClueSearch() {
  var info = state.info;
  var body;
  if (state.loading) body = '<div class="loading">加载中…</div>';
  else if (!info) body = '<div class="empty">' + esc(state.errMsg || '暂无数据') + '</div>';
  else {
    body = '<div class="desc-row"><span class="lb">手机号</span><span class="ct">' + info.phone + '</span></div>' +
      '<div class="desc-row"><span class="lb">洋葱ID</span><span class="ct">' + info.onionId + '</span></div>' +
      '<div class="desc-row"><span class="lb">坐席归属</span><span class="ct">' + esc(info.name) + '</span></div>' +
      '<div class="desc-row"><span class="lb">当前服务期</span><span class="ct remind">' + esc(info.period) + '</span></div>' +
      '<div class="desc-row" id="tgtCalm"><span class="lb">冷静期状态</span><span class="ct">' + calmHtml(info) + '</span></div>' +
      (info.inCamp ? '' : '<div class="desc-row" id="tgtEntryCheck"><span class="lb">录入判断</span><span class="ct ' + (info.entry.ok ? 'ok' : 'remind') + '">' + esc(info.entry.msg) + '</span></div>') +
      '<div class="desc-row"><span class="lb">封禁状态</span><span class="ct">否</span></div>' +
      '<div class="desc-row"><span class="lb">支付推送</span><span class="ct"><button class="btn light">支付推送</button><div class="tip">注：若线索不在体验营服务期，请慎重推送</div></span></div>';
  }
  return '<div class="card"><div class="search-bar">' +
    '<select class="sel" style="width:100px" onchange="state.qType=this.value;state.qValue=\'\';render()"><option value="phone"' + (state.qType === 'phone' ? ' selected' : '') + '>手机号</option><option value="onionId"' + (state.qType === 'onionId' ? ' selected' : '') + '>洋葱ID</option></select>' +
    '<input class="ipt" style="width:200px" placeholder="请输入" value="' + esc(state.qValue) + '" oninput="state.qValue=this.value" onkeydown="if(event.key===\'Enter\')search()">' +
    '<button class="btn primary" onclick="search()">查询</button></div>' +
    '<div class="tabs"><div class="tabs-head"><div class="active">撞单查询</div><div>学情报告</div><div>补差续购查询</div><div>下载海报</div></div>' +
    '<div class="tabs-body">' + body + '</div></div></div>';
}
function findLead(v) {
  if (LEADS[v]) return LEADS[v];
  var hit = null;
  Object.keys(LEADS).forEach(function (p) { if (LEADS[p].onionId === v) hit = LEADS[p]; });
  return hit;
}
function search(sync) {
  var v = (state.qValue || '').trim();
  if (!v) { toast('error', '请输入查询值'); return; }
  var hit = findLead(v);
  var finish = function () {
    state.loading = false;
    state.info = hit; state.errMsg = hit ? '' : '用户不存在';
    if (!hit) toast('error', '用户不存在');
    render();
  };
  if (sync) { finish(); return; }
  state.loading = true; render(); setTimeout(finish, 300);
}

function renderCurrent() {
  return '<div class="card"><div class="filter"><label>手机号</label><input class="ipt" style="width:180px" placeholder="请输入"><label>坐席</label><select class="sel" style="width:140px"><option>全部</option></select><button class="btn primary">查询</button><button class="btn">重置</button></div>' +
    '<div class="toolbar"><div></div><div class="right"><button class="btn primary" onclick="openDialog(\'curBatchUpload\')">批量导入</button><button class="btn primary" onclick="openDialog(\'one\')">单个录入客户</button></div></div>' +
    '<table><thead><tr><th>手机号</th><th>洋葱ID</th><th>获客渠道</th><th>归属坐席</th><th>服务期</th><th>入库时间</th></tr></thead><tbody>' +
    '<tr><td>138****0009</td><td>108700009</td><td>人工录入</td><td>王晓雨</td><td>2026-11-01 ~ 2027-01-31</td><td>2026-11-01 09:00</td></tr>' +
    '<tr><td>139****2231</td><td>108712231</td><td>抖店</td><td>李明</td><td>2026-11-03 ~ 2027-02-02</td><td>2026-11-03 14:12</td></tr>' +
    '</tbody></table></div>';
}
function renderPool() {
  return '<div class="card"><div class="filter"><label>手机号</label><input class="ipt" style="width:180px" placeholder="请输入"><button class="btn primary">查询</button><button class="btn">重置</button></div>' +
    '<div class="toolbar"><div></div><div class="right"><button class="btn primary">申请客户</button><button class="btn primary">添加冷静期客户</button><button class="btn primary" onclick="openDialog(\'one\')">单个录入客户</button><button class="btn primary" onclick="openDialog(\'poolBatch\')">批量导入</button></div></div>' +
    '<table><thead><tr><th>手机号</th><th>洋葱ID</th><th>获客渠道</th><th>最近跟进坐席</th><th>入库时间</th></tr></thead><tbody>' +
    '<tr><td>138****0004</td><td>108700004</td><td>人工录入</td><td>赵磊</td><td>2026-07-12 10:20</td></tr>' +
    '</tbody></table></div>';
}

function openDialog(d) {
  state.dialog = d;
  if (d === 'one') state.one = { phone: '', channel: '人工录入', seat: '', err: '' };
  if (d === 'curBatchUpload') state.batchFile = '';
  if (d === 'poolBatch') { state.poolTab = 'tpl'; state.batchFile = ''; state.poolDetail = false; }
  renderDialogs();
}
function closeDialog() { state.dialog = null; renderDialogs(); }
function submitOne() {
  var o = state.one;
  if (!o.phone || !o.seat) { o.err = !o.phone ? '请输入手机号' : '请选择坐席'; renderDialogs(); return; }
  if (SVC_CALM.indexOf(o.phone) >= 0) {
    o.err = '该线索在服务期冷静期中，无法录入。';
    toast('error', o.err); renderDialogs(); return;
  }
  toast('success', '录入成功'); closeDialog();
}
function renderDialogs() {
  var host = document.getElementById('dialogHost');
  var d = state.dialog, html = '';
  if (d === 'one') {
    var o = state.one;
    html = '<div class="mask"><div class="dialog"><div class="hd">单个录入客户<span class="x" onclick="closeDialog()">✕</span></div><div class="bd">' +
      '<div class="form-row"><span class="lb"><i>*</i>手机号</span><input class="ipt" placeholder="请输入手机号" value="' + esc(o.phone) + '" oninput="state.one.phone=this.value.trim()"></div>' +
      '<div class="form-row"><span class="lb"><i>*</i>获客渠道</span><select class="sel" onchange="state.one.channel=this.value"><option>人工录入</option><option>畅游裂变</option><option>转介绍</option></select></div>' +
      '<div class="form-row"><span class="lb"><i>*</i>坐席</span><select class="sel" onchange="state.one.seat=this.value"><option value="">请选择</option>' +
      ['王晓雨', '李明', '赵磊'].map(function (s) { return '<option' + (o.seat === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div>' +
      '<div class="form-row"><span class="lb">备注</span><input class="ipt" placeholder="请输入"></div></div>' +
      '<div class="ft" id="tgtOneSubmit"><span class="form-err">' + esc(o.err) + '</span><button class="btn" onclick="closeDialog()">取消</button><button class="btn primary" onclick="submitOne()">确定</button></div></div></div>';
  } else if (d === 'curBatchUpload') {
    html = '<div class="mask"><div class="dialog"><div class="hd">批量导入<span class="x" onclick="closeDialog()">✕</span></div><div class="bd">' +
      '<div class="upload' + (state.batchFile ? ' has' : '') + '" onclick="state.batchFile=\'当期客户导入-1126.xlsx\';renderDialogs()">' + (state.batchFile ? '已选择：' + state.batchFile : '点击选择 Excel 文件') + '</div>' +
      '<div class="note">以下情况无法导入：手机号已在客户管理中；渠道或订单不在洋葱系统；洋葱账号注册失败；该线索在服务期冷静期中。</div></div>' +
      '<div class="ft"><button class="btn" onclick="closeDialog()">取消</button><button class="btn primary"' + (state.batchFile ? '' : ' disabled') + ' onclick="state.dialog=\'curBatch\';renderDialogs()">确定</button></div></div></div>';
  } else if (d === 'curBatch') {
    html = '<div class="mask"><div class="dialog wide"><div class="hd">导入结果<span class="x" onclick="closeDialog()">✕</span></div><div class="bd">' +
      '<div class="sum">共 3 条，成功 1 条，失败 2 条</div><div id="tgtCurBatchResult"><table><thead><tr><th>手机号</th><th>洋葱ID</th><th>分配销售</th><th>申请手机号</th><th>结果</th></tr></thead><tbody>' +
      '<tr><td>13800000003</td><td>108700003</td><td>李明</td><td>已申请</td><td><span class="pill succ">导入成功</span></td></tr>' +
      '<tr><td>13800000001</td><td>108700001</td><td></td><td>未申请</td><td><span class="pill fail">该线索在服务期冷静期中，无法录入。</span></td></tr>' +
      '<tr><td>13900000010</td><td></td><td></td><td>未申请</td><td><span class="pill fail">洋葱账号注册失败</span></td></tr>' +
      '</tbody></table></div><div style="margin-top:12px"><span class="link">下载失败明细</span></div></div>' +
      '<div class="ft"><button class="btn primary" onclick="closeDialog()">关闭</button></div></div></div>';
  } else if (d === 'poolBatch') {
    var tabs = '<div class="tabs" style="margin-top:0"><div class="tabs-head"><div class="' + (state.poolTab === 'tpl' ? 'active' : '') + '" onclick="state.poolTab=\'tpl\';state.poolDetail=false;renderDialogs()">导入模版</div><div class="' + (state.poolTab === 'res' ? 'active' : '') + '" onclick="state.poolTab=\'res\';renderDialogs()">导入结果</div></div><div class="tabs-body" style="min-height:180px">';
    if (state.poolTab === 'tpl') {
      tabs += '<div style="margin-bottom:12px"><span class="link">查看模板</span></div><div class="upload' + (state.batchFile ? ' has' : '') + '" onclick="state.batchFile=\'数据库导入-1126.xlsx\';renderDialogs()">' + (state.batchFile ? '已选择：' + state.batchFile : '点击上传 Excel 文件') + '</div>' +
        '<div style="text-align:right;margin-top:14px"><button class="btn primary"' + (state.batchFile ? '' : ' disabled') + ' onclick="state.poolTab=\'res\';renderDialogs()">确定</button></div>';
    } else if (!state.poolDetail) {

      anchor.setAttribute("data-id", item.id);
      var index = CHANGES.indexOf(item) + 1;
      anchor.textContent = (index < 10 ? "0" : "") + index;
      anchor.style.left = (rect.left - pageRect.left + page.scrollLeft) + "px";
      anchor.style.top = (rect.top - pageRect.top + page.scrollTop) + "px";
      anchor.onclick = function (e) {
        e.stopPropagation();
        pinId = item.id;
        hoverId = null;
        if (!railOpen) {
          railOpen = true;
          syncRail();
        }
        paintCards();
        var card = document.querySelector('.diff-card[data-id="' + item.id + '"]');
        if (card) card.scrollIntoView({ block: "nearest" });
        pulse(el);
        measure();
      };
      anchor.onmouseenter = function () { hoverId = item.id; draw(); };
      anchor.onmouseleave = function () { if (hoverId === item.id) hoverId = null; draw(); };
      page.appendChild(anchor);
      anchor.style.visibility = "hidden";
      var top = document.elementFromPoint(rect.left + 11, rect.top + 11);
      anchor.style.visibility = "";
      if (top && top.closest && top.closest("#diffRail")) anchor.style.display = "none";
    });
    draw();
  }
  window.__diffRemeasure = function () { measure(); };
  function resizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if (!railOpen) return;
    var id = pinId || hoverId;
    if (!id) return;
    var card = document.querySelector('.diff-card[data-id="' + id + '"]');
    var anchor = document.querySelector('.diff-anchor[data-id="' + id + '"]');
    if (!card || !anchor || anchor.style.display === "none") return;
    var a = card.getBoundingClientRect();
    var b = anchor.getBoundingClientRect();
    var page = pageEl().getBoundingClientRect();
    if (b.bottom < page.top || b.top > page.bottom || b.right < page.left || b.left > page.right) return;
    var x1 = a.left;
    var y1 = Math.min(Math.max(a.top + a.height / 2, 8), window.innerHeight - 8);
    var x2 = b.left + b.width / 2;
    var y2 = b.top + b.height / 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo((x1 + x2) / 2, y1, (x1 + x2) / 2, y2, x2, y2);
    ctx.strokeStyle = "#f0b429";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  document.getElementById("diffCollapse").onclick = function () { railOpen = false; syncRail(); measure(); };
  fab.onclick = function () { railOpen = true; syncRail(); measure(); };
  rail.addEventListener("click", function (e) { e.stopPropagation(); });
  pageEl().addEventListener("scroll", measure);
  window.addEventListener("resize", function () { resizeCanvas(); measure(); });
  document.querySelectorAll(".table-wrap").forEach(function (node) { node.addEventListener("scroll", measure); });
  paintDemo();
  paintMods();
  paintCards();
  syncRail();
  resizeCanvas();
  measure();
})();

</script>
</body>
</html>
