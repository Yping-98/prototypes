<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体验营-服务期冷静期录入拦截</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; color: #303133; background: #f0f2f5; }
.layout { display: flex; min-height: 100vh; }
.side { width: 200px; background: #001529; color: rgba(255,255,255,.75); flex-shrink: 0; }
.side .logo { height: 50px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: 600; background: #002140; }
.side .menu-item { height: 46px; display: flex; align-items: center; padding: 0 20px; cursor: pointer; gap: 10px; font-size: 13px; }
.side .menu-item:hover { color: #fff; }
.side .menu-item.active { color: #fff; background: #1890ff; }
.side .ico { width: 13px; height: 13px; border: 1.5px solid currentColor; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.side .arrow { margin-left: auto; font-size: 10px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 40px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: #97a8be; font-size: 13px; border-bottom: 1px solid #ebeef5; }
.topbar .user { color: #606266; font-size: 12px; }
.tags { background: #fff; padding: 8px 40px; border-bottom: 1px solid #dcdfe6; display: flex; }
.tags .tag { border: 1px solid #dcdfe6; padding: 5px 18px; margin-right: -1px; cursor: pointer; background: #fff; font-size: 13px; color: #303133; }
.tags .tag.active { color: #409eff; }
#diffPage { flex: 1; padding: 20px; position: relative; overflow: auto; }
.card { background: #fff; border-radius: 6px; padding: 15px; }
.search-bar { display: flex; align-items: center; gap: 10px; }
.sel, .ipt { height: 32px; border: 1px solid #dcdfe6; border-radius: 4px; padding: 0 10px; font-size: 14px; color: #606266; background: #fff; }
.ipt:focus, .sel:focus { outline: none; border-color: #409eff; }
.btn { height: 32px; padding: 0 15px; border-radius: 4px; border: 1px solid #dcdfe6; background: #fff; cursor: pointer; font-size: 14px; color: #606266; white-space: nowrap; }
.btn.primary { background: #409eff; border-color: #409eff; color: #fff; }
.btn.light, .btn.plain { background: #ecf5ff; border-color: #b3d8ff; color: #409eff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.tabs { margin-top: 20px; border: 1px solid #dcdfe6; }
.tabs-head { display: flex; background: #f5f7fa; border-bottom: 1px solid #e4e7ed; }
.tabs-head div { padding: 0 20px; height: 40px; line-height: 40px; color: #909399; cursor: pointer; }
.tabs-head div.active { background: #fff; color: #409eff; border-right: 1px solid #e4e7ed; border-left: 1px solid #e4e7ed; margin-bottom: -1px; }
.tabs-body { padding: 15px 20px; min-height: 260px; }
.desc-row { display: flex; padding: 9px 0; line-height: 22px; }
.entry-tip { margin: -15px -20px 12px; padding: 6px 24px; font-size: 13px; line-height: 20px; }
.entry-tip.block { background: #fef0f0; color: #f56c6c; }
.entry-tip.pass { background: #f0f9eb; color: #67c23a; }
.desc-row .lb { width: 96px; color: #303133; flex-shrink: 0; }
.desc-row .ct { color: #606266; }
.remind, .desc-row .ct.remind, .desc-row .remind { color: #f56c6c; }
.ok, .desc-row .ct.ok { color: #67c23a; }
.muted { color: #909399; }
.tip { margin-top: 10px; color: #909399; font-size: 13px; }
.empty { text-align: center; color: #909399; padding: 60px 0; }
.loading { text-align: center; color: #409eff; padding: 60px 0; }

/* 客户管理（el-tabs 线条样式 + 小尺寸表单） */
.el-tabs-line { display: flex; border-bottom: 2px solid #e4e7ed; margin-bottom: 15px; }
.el-tabs-line div { padding: 0 20px 0 0; height: 40px; line-height: 40px; font-size: 14px; color: #303133; cursor: pointer; position: relative; margin-right: 20px; }
.el-tabs-line div.active { color: #409eff; }
.el-tabs-line div.active::after { content: ""; position: absolute; left: 0; right: 20px; bottom: -2px; height: 2px; background: #409eff; }
.yc-form { display: flex; flex-wrap: wrap; align-items: center; font-size: 12px; color: #606266; }
.yc-form .fi { display: inline-flex; align-items: center; margin: 0 14px 12px 0; }
.yc-form .fi > label { color: #606266; margin-right: 4px; white-space: nowrap; }
.yc-form .s-ipt, .yc-form .s-sel { height: 26px; border: 1px solid #dcdfe6; border-radius: 3px; padding: 0 8px; font-size: 12px; color: #a8abb2; background: #fff; display: inline-flex; align-items: center; justify-content: space-between; }
.yc-form .s-sel::after { content: "⌄"; color: #c0c4cc; margin-left: 6px; }
.yc-form .radio { display: inline-flex; align-items: center; margin-right: 12px; }
.yc-form .radio i { width: 12px; height: 12px; border: 1px solid #dcdfe6; border-radius: 50%; display: inline-block; margin-right: 4px; }
.yc-form .range { height: 26px; border: 1px solid #dcdfe6; border-radius: 3px; display: inline-flex; align-items: center; gap: 14px; padding: 0 10px; color: #a8abb2; font-size: 12px; }
.yc-form .range b { color: #606266; font-weight: normal; }
.btn-row { display: flex; justify-content: space-between; width: 100%; margin-bottom: 12px; }
.btn-row .btn { height: 28px; padding: 0 12px; font-size: 12px; margin-right: 8px; }
.btn-row > div:last-child .btn { margin: 0 0 0 8px; }
.tbl-wrap { overflow-x: auto; border: 1px solid #ebeef5; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { border-bottom: 1px solid #ebeef5; padding: 10px 8px; text-align: left; }
.yc-tbl th, .yc-tbl td { border-right: 1px solid #ebeef5; text-align: center; white-space: nowrap; min-width: 92px; }
th { background: #fafafa; color: #909399; font-weight: 500; }
.yc-tbl tr.cur td { background: #ecf5ff; }
.yc-tbl td.op { min-width: 200px; }
.yc-tbl .op .btn { height: 24px; padding: 0 8px; font-size: 12px; margin: 2px; }
.yc-tbl .ck { min-width: 40px; }
.pager { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 14px 0 0; font-size: 12px; color: #606266; }
.pager span.on { color: #409eff; }

.mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 8vh; z-index: 50; overflow: auto; }
.dialog { background: #fff; border-radius: 4px; width: 600px; max-width: 94vw; position: relative; margin-bottom: 40px; }
.dialog.wide { width: 760px; }
.dialog .hd { padding: 18px 20px 10px; font-size: 18px; color: #303133; display: flex; justify-content: space-between; }
.dialog .hd .x { cursor: pointer; color: #909399; font-size: 14px; }
.dialog .bd { padding: 10px 20px 20px; font-size: 14px; color: #606266; }
.dialog .ft { padding: 10px 20px 20px; display: flex; justify-content: flex-end; gap: 10px; align-items: center; }
.dialog .ft.center { justify-content: center; }
.fr { display: flex; align-items: flex-start; margin-bottom: 18px; }
.fr .lb { width: 150px; text-align: right; padding-right: 12px; color: #606266; line-height: 32px; flex-shrink: 0; }
.fr .lb.w100 { width: 100px; }
.fr .lb i { color: #f56c6c; font-style: normal; margin-right: 4px; }
.fr .ctl { flex: 1; min-width: 0; }
.fr .ctl .ipt, .fr .ctl .sel { width: 100%; }
.fr .ctl textarea { width: 100%; border: 1px solid #dcdfe6; border-radius: 4px; padding: 6px 10px; font-size: 14px; font-family: inherit; resize: none; height: 54px; }
.fr .err { color: #f56c6c; font-size: 12px; line-height: 18px; }
.fr .radio-line { line-height: 32px; display: flex; gap: 24px; }
.fr .radio-line label { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.pic-card { width: 100px; height: 100px; border: 1px dashed #cdd0d6; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; color: #8c939d; cursor: pointer; margin-right: 8px; background: #fafafa; vertical-align: top; }
.pic-card.has { border-style: solid; font-size: 12px; color: #67c23a; background: #f0f9eb; }
.line { width: 100%; line-height: 24px; }
.link { color: #409eff; cursor: pointer; text-decoration: none; }
.step-block { margin-bottom: 24px; }
.step-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #303133; }
.step-desc { color: #606266; font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
.no-file-tip { margin-left: 12px; color: #f53f3f; font-size: 12px; }
.fail-reason { color: #f56c6c; }
.import-content { text-align: center; font-size: 15px; color: #303133; padding: 10px 0; }
.file-preview { margin-top: 14px; }
.file-preview .cap { font-size: 12px; color: #909399; margin-bottom: 6px; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 4px; font-size: 14px; z-index: 99; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
.toast.error { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
.toast.success { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
@media (max-width: 760px) { .side { display: none; } .tags { padding: 8px 10px; } }
</style>
</head>
<body>
<div class="layout">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="topbar"><span id="crumb">线索查询</span><span class="user">李莹萍</span></div>
    <div class="tags" id="tags"></div>
    <div id="diffPage"><div id="view"></div></div>
  </div>
</div>
<div id="dialogHost"></div>
<div id="toastHost"></div>

<script>
var LEADS = {
  '13800000009': { key: 'inService', phone: '13800000009', onionId: '108700009', name: '王晓雨', period: '体验营 2026-11-01 09:00:00 ~ 2027-01-31 23:59:59', inCamp: true, calm: [], entry: null },
  '13800000001': { key: 'svcCalm', phone: '13800000001', onionId: '108700001', name: '', period: '', calm: [{ t: '服务期冷静期', end: '2026-12-20 14:20:51' }], entry: { ok: false, msg: '该线索在服务期冷静期中，无法录入。' } },
  '13800000002': { key: 'followCalm', phone: '13800000002', onionId: '108700002', name: '', period: '', calm: [{ t: '跟进冷静期', end: '2026-12-05 10:00:00' }], entry: { ok: false, msg: '该线索在跟进冷静期中，无法录入' } },
  '13800000006': { key: 'bothCalm', phone: '13800000006', onionId: '108700006', name: '', period: '', calm: [{ t: '服务期冷静期', end: '2026-12-20 14:20:51' }, { t: '跟进冷静期', end: '2026-12-05 10:00:00' }], entry: { ok: false, msg: '该线索在服务期冷静期中，无法录入。' } },
  '15971423839': { key: 'otherTeam', phone: '15971423839', onionId: '108743046', name: '', period: '电销/网销 2026-09-01 13:45:31 ~ 2027-02-28 14:20:51', calm: [], entry: { ok: false, msg: '该客户在其他业务线服务期，无法录入' } },
  '13800000003': { key: 'newLead', phone: '13800000003', onionId: '108700003', name: '', period: '', calm: [], entry: { ok: true, msg: '该线索可录入至当期客户' } },
  '13800000004': { key: 'oldLead', phone: '13800000004', onionId: '108700004', name: '', period: '', calm: [], entry: { ok: true, msg: '该线索可录入至数据库' } },
  '13800000007': { key: 'locked', phone: '13800000007', onionId: '108700007', name: '', period: '', calm: [], entry: { ok: false, msg: '该线索锁定时间未过期' } },
  '13800000008': { key: 'queryFail', phone: '13800000008', onionId: '108700008', name: '', period: '', calm: null, entry: { ok: false, msg: '暂无法判断是否可录入，请稍后重试' } }
};
var DEMO_PHONE = {};
Object.keys(LEADS).forEach(function (p) { DEMO_PHONE[LEADS[p].key] = p; });
var SVC_CALM = ['13800000001', '13800000006'];
var SVC_CALM_MSG = '该线索在服务期冷静期中，无法录入。';
var SEATS = ['李莹萍', '王晓雨', '李明', '赵磊'];
var CHANNELS = ['ABhao', 'rengongluru', 'xiaohongshusixin-qiwei', 'changyuliebian', 'wangyi'];

var CUR_COLS = ['期数', '洋葱ID', '手机号', '家庭标签', '跟进状态', '微信昵称', '剩余在库时长', '分配后累计学习时长', '当天累计学习时长', '客户类型', '跟进备注', '跟进时间', '意向度', '当前所在业务线', '服务期到期时间', '身份'];
var CUR_ROWS = [
  ['203', '109209754', '13735295762', '-', '新线索', 'wansheng-xin', '24天6时59分', '0时0分', '0时0分', '新用户', '', '', '', '体验营', '2027-05-25 14:52:19', '妈妈'],
  ['203', '108712231', '18977551116', '二胎家庭', '已建联', 'qingkong', '20天3时12分', '1时25分', '0时18分', '老用户', '已加微，约周末试听', '2026-11-25 19:20', '高', '体验营', '2027-05-03 10:12:40', '爸爸']
];
var POOL_COLS = ['剩余在库时长', '洋葱ID', '手机号', '家庭标签', '今日是否拨打电话', '是否轻课客户', '跟进状态', '微信昵称', '最近一次登录时间', '分配后累计学习时长', '当天累计学习时长', '客户类型', '跟进备注', '跟进时间', '意向度', '线索分配时间', '当前所在业务线', '服务期到期时间'];
var POOL_ROWS = [
  ['3天10时2分', '108700004', '13800000004', '-', '否', '非轻课客户', '待跟进', 'xiaoyu', '2026-11-24 21:03', '2时10分', '0时0分', '老用户', '', '', '', '2026-11-23 10:20', '体验营', '2027-05-22 10:20:00']
];

var PAGES = { customer: '客户管理', plan: '线索投放计划', clueSearch: '线索查询' };
var CUST_TABS = [{ k: 'current', t: '当期客户' }, { k: 'pool', t: '数据库' }, { k: 'converted', t: '已转化客户' }, { k: 'history', t: '往期非转化' }];
var state = {
  page: 'clueSearch', custTab: 'current', qType: 'phone', qValue: '15971423839', info: null, loading: false, errMsg: '',
  dialog: null, one: null, curFile: '', curFail: false, poolTab: 'template', poolFile: '', poolDetail: false
};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function remeasure() { if (window.__diffRemeasure) window.__diffRemeasure(); }
function toast(type, msg, sticky) {
  var host = document.getElementById('toastHost');
  host.innerHTML = '<div class="toast ' + type + '">' + esc(msg) + '</div>';
  clearTimeout(toast.t);
  if (!sticky) toast.t = setTimeout(function () { host.innerHTML = ''; }, 2600);
}

function renderSide() {
  var items = [['customer', '客户管理'], ['', 'AB号审核'], ['clueSearch', '线索查询'], ['', '线索追溯'], ['', '专属售卖链接'], ['', '转介绍', 1], ['', '裂变活动', 1], ['', '非服务期客户'], ['', '抖音小店']];
  document.getElementById('side').innerHTML = '<div class="logo">体验营</div>' + items.map(function (it) {
    var active = it[0] && state.page === it[0];
    return '<div class="menu-item' + (active ? ' active' : '') + '"' + (it[0] ? ' onclick="go(\'' + it[0] + '\')"' : '') + '><span class="ico"></span>' + it[1] + (it[2] ? '<span class="arrow">⌄</span>' : '') + '</div>';
  }).join('');
}
function renderTags() {
  document.getElementById('crumb').textContent = PAGES[state.page];
  document.getElementById('tags').innerHTML = ['customer', 'plan', 'clueSearch'].map(function (p) {
    return '<div class="tag' + (p === state.page ? ' active' : '') + '" onclick="go(\'' + p + '\')">' + PAGES[p] + '</div>';
  }).join('');
}
function go(p, tab) {
  if (p === 'current' || p === 'pool') { tab = p; p = 'customer'; }
  if (p === 'plan') return;
  state.page = p; if (tab) state.custTab = tab; state.dialog = null; render();
}

/* ---------- 线索查询 ---------- */
function calmHtml(info) {
  if (info.calm === null) return '<span class="remind">冷静期查询失败，请稍后重试</span>';
  if (!info.calm.length) return '<span>无冷静期</span>';
  return info.calm.map(function (c) { return '<div class="remind">' + c.t + ' 至 ' + c.end + '</div>'; }).join('');
}
function renderClueSearch() {
  var info = state.info;
  var body;
  if (state.loading) body = '<div class="loading">加载中…</div>';
  else if (!info) body = '<div class="empty">' + esc(state.errMsg || '暂无数据') + '</div>';
  else {
    body = (info.inCamp ? '' : '<div class="entry-tip ' + (info.entry.ok ? 'pass' : 'block') + '" id="tgtEntryCheck">提示：' + esc(info.entry.msg) + '</div>') +
      '<div class="desc-row"><span class="lb">手机号</span><span class="ct">' + info.phone + '</span></div>' +
      '<div class="desc-row"><span class="lb">洋葱ID</span><span class="ct">' + info.onionId + '</span></div>' +
      '<div class="desc-row"><span class="lb">坐席归属</span><span class="ct">' + esc(info.name) + '</span></div>' +
      '<div class="desc-row"><span class="lb">当前服务期</span><span class="ct remind">' + esc(info.period) + '</span></div>' +
      '<div class="desc-row" id="tgtCalm"><span class="lb">冷静期状态</span><span class="ct">' + calmHtml(info) + '</span></div>' +
      '<div class="desc-row"><span class="lb">封禁状态</span><span class="ct">否</span></div>' +
      '<div class="desc-row"><span class="lb">支付推送</span><span class="ct"><button class="btn light">支付推送</button><div class="tip">注：若线索不在体验营服务期，请慎重推送</div></span></div>';
  }
  return '<div class="card"><div class="search-bar">' +
    '<select class="sel" style="width:100px" onchange="state.qType=this.value;state.qValue=\'\';render()"><option value="phone"' + (state.qType === 'phone' ? ' selected' : '') + '>手机号</option><option value="onionId"' + (state.qType === 'onionId' ? ' selected' : '') + '>洋葱ID</option></select>' +
    '<input class="ipt" style="width:200px" placeholder="请输入" value="' + esc(state.qValue) + '" oninput="state.qValue=this.value" onkeydown="if(event.key===\'Enter\')search()">' +
    '<button class="btn primary" onclick="search()">查询</button></div>' +
    '<div class="tabs"><div class="tabs-head"><div class="active">撞单查询</div><div>学情报告</div><div>补差续购查询</div><div>下载海报</div></div>' +
    '<div class="tabs-body">' + body + '</div></div></div>';
}
function findLead(v) {
  if (LEADS[v]) return LEADS[v];
  var hit = null;
  Object.keys(LEADS).forEach(function (p) { if (LEADS[p].onionId === v) hit = LEADS[p]; });
  return hit;
}
function search(sync) {
  var v = (state.qValue || '').trim();
  if (!v) { toast('error', '请输入查询值'); return; }
  var hit = findLead(v);
  var finish = function () {
    state.loading = false;
    state.info = hit; state.errMsg = hit ? '' : '用户不存在';
    if (!hit) toast('error', '用户不存在');
    render();
  };
  if (sync) { finish(); return; }
  state.loading = true; render(); setTimeout(finish, 300);
}

/* ---------- 客户管理 ---------- */
function ipt(label, ph, w) { return '<span class="fi"><label>' + label + '</label><span class="s-ipt" style="width:' + w + 'px">' + ph + '</span></span>'; }
function sel(label, ph, w) { return '<span class="fi"><label>' + label + '</label><span class="s-sel" style="width:' + w + 'px">' + ph + '</span></span>'; }
function radio(label) { return '<span class="fi" style="margin-right:25px"><label>' + label + '</label><span class="radio"><i></i>是</span><span class="radio"><i></i>否</span></span>'; }
function range(label, a, b) { return '<span class="fi"><label>' + label + '</label><span class="range" style="width:340px">' + a + '<b>至</b>' + b + '</span></span>'; }
function table(cols, rows, opHtml, redIdx) {
  var h = '<div class="tbl-wrap"><table class="yc-tbl"><thead><tr><th class="ck">☐</th>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '<th class="op">操作 ⚙</th></tr></thead><tbody>';
  rows.forEach(function (r, i) {
    h += '<tr class="' + (i === 0 ? 'cur' : '') + '"><td class="ck">☐</td>' + r.map(function (v, j) { return '<td' + (redIdx.indexOf(j) >= 0 ? ' class="remind"' : '') + '>' + esc(v) + '</td>'; }).join('') + '<td class="op">' + opHtml + '</td></tr>';
  });
  return h + '</tbody></table></div><div class="pager"><span>‹</span><span class="on">1</span><span>›</span><span>共 ' + rows.length + ' 条</span><span>前往 1 页</span></div>';

        "blockId": "doxcnSd910JCNLCrzXoH3tKxOWf"
      }
    }
  ]
};
window.DIFF_HOOKS = {
  locate: function (change) {
    var v = change.view || {};
    document.getElementById('toastHost').innerHTML = '';
    if (v.page === 'clueSearch') {
      if (!state.info || state.info.inCamp || state.page !== 'clueSearch') loadDemo('svcCalm');
      return;
    }
    go(v.page);
    if (v.dialog === 'one') {
      state.dialog = 'one';
      state.one = defaultOne();
      state.one.phone = '13800000001'; state.one.doc = '家长主动咨询';
      if (v.page === 'current') { state.one.channel = 'rengongluru'; state.one.shots = 1; }
      toast('error', SVC_CALM_MSG, true);
    } else if (v.dialog === 'curBatch') {
      state.dialog = 'curBatch'; state.curFail = true;
    } else if (v.dialog === 'poolBatch') {
      state.dialog = 'poolBatch'; state.poolTab = 'result'; state.poolDetail = true;
    }
    renderDialogs();
  },
  setDemoState: function (id) { loadDemo(id); }
};
</script>
<script>
(function () {
  var data = window.DIFF_CHANGESET || { meta: {}, changes: [] };
  var meta = data.meta || {};
  var CHANGES = data.changes || [];
  var TYPE = { logic: "逻辑", "new": "新增", copy: "文案", enum: "枚举口径", flow: "流程", "delete": "删除" };
  var LEVEL = { page: "页面", module: "模块", field: "字段" };
  var slug = meta.slug || "prd";
  var LS_KEY = "proto-note:" + slug + ":modules:v1";
  var LS_RAIL = "proto-note:" + slug + ":rail:v1";

  var style = document.createElement("style");
  style.textContent = [
    "#diffPage, .page { position: relative; }",
    "#diffRail { position: fixed; top: 0; right: 0; width: 360px; height: 100%; z-index: 9100; background: #0c2340; color: #d7e4f2; display: flex; flex-direction: column; box-shadow: -8px 0 28px rgba(0,0,0,.28); font-size: 13px; }",
    "#diffRail.collapsed { display: none; }",
    "#diffFab { position: fixed; right: 18px; bottom: 18px; z-index: 9100; display: none; background: #0c2340; color: #fff; border: 0; border-radius: 18px; height: 36px; padding: 0 14px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }",
    "#diffFab.show { display: inline-flex; align-items: center; }",
    ".diff-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 8px; }",
    ".diff-head b { font-size: 15px; color: #fff; font-weight: 600; }",
    ".diff-icon { width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #9fc0de; cursor: pointer; }",
    ".diff-icon:hover { background: rgba(255,255,255,.08); color: #fff; }",
    ".diff-demo { display: flex; gap: 4px; padding: 0 12px 10px; }",
    ".diff-demo button { flex: 1; height: 28px; border: 0; border-radius: 6px; background: #16365a; color: #b7cbe0; padding: 0 4px; font-size: 12px; cursor: pointer; }",
    ".diff-demo button.on { background: #1f6feb; color: #fff; }",
    ".diff-mods { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 8px; }",
    ".diff-group { background: #102c4c; border-radius: 8px; padding: 8px 10px; }",
    ".diff-group .name { color: #8fb4d6; font-size: 12px; margin-bottom: 4px; }",
    ".diff-check { display: flex; align-items: center; gap: 8px; padding: 4px 0; color: #e7f0f8; cursor: pointer; }",
    ".diff-check input { accent-color: #3b82f6; }",
    "#diffCards { flex: 1; overflow: auto; padding: 4px 12px 20px; }",
    ".diff-card { background: #14365c; border: 1px solid transparent; border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer; }",
    ".diff-card:hover, .diff-card.pin { border-color: #f0b429; }",
    ".diff-no { display: inline-flex; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: #f0b429; color: #1a1a1a; font-weight: 700; font-size: 12px; align-items: center; justify-content: center; }",
    ".diff-card h4 { margin: 8px 0 4px; font-size: 14px; color: #fff; font-weight: 600; }",
    ".diff-meta { color: #8fb4d6; font-size: 12px; }",
    ".diff-card p { margin: 8px 0; line-height: 1.55; color: #d7e4f2; }",
    ".diff-ba { display: flex; gap: 8px; margin-top: 6px; line-height: 1.5; }",
    ".diff-ba span { flex: none; width: 20px; height: 20px; border-radius: 4px; background: #0c2340; color: #f0b429; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }",
    ".diff-ba div { min-width: 0; }",
    ".diff-ex { margin: 8px 0 0; padding-left: 18px; color: #c5d7ea; }",
    ".diff-ex li { margin: 2px 0; }",
    ".diff-link { display: inline-block; margin-top: 8px; color: #7cc4ff; text-decoration: none; }",
    ".diff-link:hover { text-decoration: underline; }",
    ".diff-anchor { position: absolute; z-index: 9000; width: 22px; height: 22px; border: 0; border-radius: 11px; background: #f0b429; color: #1a1a1a; font-weight: 700; font-size: 12px; padding: 0; transform: translate(-2px, -2px); box-shadow: 0 2px 8px rgba(0,0,0,.25); cursor: pointer; }",
    ".diff-anchor.pin { outline: 2px solid #fff; }",
    ".diff-pulse { animation: diffPulse 1.1s ease 2; }",
    "@keyframes diffPulse { 0% { box-shadow: 0 0 0 0 rgba(240,180,41,.7); } 100% { box-shadow: 0 0 0 8px rgba(240,180,41,0); } }",
    "#diffCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 8900; pointer-events: none; }"
  ].join("\n");
  document.head.appendChild(style);

  var rail = document.createElement("div");
  rail.id = "diffRail";
  rail.innerHTML = '<div class="diff-head"><b>变更批注</b><button class="diff-icon" id="diffCollapse" type="button" aria-label="收起批注栏">›</button></div><div class="diff-demo" id="diffDemo"></div><div class="diff-mods" id="diffMods"></div><div id="diffCards"></div>';
  var fab = document.createElement("button");
  fab.id = "diffFab";
  fab.type = "button";
  fab.textContent = "变更批注";
  var canvas = document.createElement("canvas");
  canvas.id = "diffCanvas";
  document.body.appendChild(rail);
  document.body.appendChild(fab);
  document.body.appendChild(canvas);
  var ctx = canvas.getContext("2d");

  function esc(text) {
    return String(text == null ? "" : text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function pageEl() {
    return document.getElementById("diffPage") || document.querySelector(".page") || document.body;
  }
  function prdHref(item) {
    var base = String(meta.prdUrl || "").replace(/#.*$/, "");
    var blockId = item.prd && item.prd.blockId;
    if (!base) return "";
    return base + (blockId ? "#" + blockId : "");
  }

  var modules = [];
  CHANGES.forEach(function (item) {
    var key = item.page + "::" + item.module;
    if (modules.indexOf(key) < 0) modules.push(key);
  });
  var stored = null;
  try { stored = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) { stored = null; }
  var checked = {};
  modules.forEach(function (key) {
    if (!stored) checked[key] = true;
    else checked[key] = stored[key] === undefined ? true : !!stored[key];
  });
  var railOpen = localStorage.getItem(LS_RAIL) !== "0";
  var pinId = null;
  var hoverId = null;
  var demo = (meta.demoControls && meta.demoControls[0] && meta.demoControls[0].id) || "";

  function scrollTo(el) {
    if (!el) return;
    try { el.scrollIntoView({ behavior: "instant", block: "center", inline: "nearest" }); }
    catch (e) { el.scrollIntoView(); }
    var railW = rail.classList.contains("collapsed") ? 0 : 360;
    var rect = el.getBoundingClientRect();
    var limit = window.innerWidth - railW - 28;
    if (rect.left > limit - 24) {
      var scroller = el.closest(".table-wrap") || pageEl();
      scroller.scrollLeft += rect.right - limit;
    }
  }
  function pulse(el) {
    if (!el) return;
    el.classList.remove("diff-pulse");
    void el.offsetWidth;
    el.classList.add("diff-pulse");
  }
  function visibleChanges() {
    return CHANGES.filter(function (item) { return checked[item.page + "::" + item.module]; });
  }
  function saveChecked() {
    localStorage.setItem(LS_KEY, JSON.stringify(checked));
  }
  function focusChange(change) {
    if (window.DIFF_HOOKS && typeof DIFF_HOOKS.locate === "function") DIFF_HOOKS.locate(change);
    setTimeout(function () {
      var el = document.querySelector(change.target);
      scrollTo(el);
      pulse(el);
      measure();
    }, 30);
  }

  function paintDemo() {
    var box = document.getElementById("diffDemo");
    var controls = meta.demoControls || [];
    box.innerHTML = "";
    if (!controls.length) {
      box.style.display = "none";
      return;
    }
    box.style.display = "";
    controls.forEach(function (pair) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = pair.label;
      btn.className = demo === pair.id ? "on" : "";
      btn.onclick = function () {
        demo = pair.id;
        if (window.DIFF_HOOKS && typeof DIFF_HOOKS.setDemoState === "function") DIFF_HOOKS.setDemoState(pair.id);
        paintDemo();
        measure();
      };
      box.appendChild(btn);
    });
  }
  function paintMods() {
    var box = document.getElementById("diffMods");
    box.innerHTML = "";
    var pages = [];
    modules.forEach(function (key) {
      var page = key.split("::")[0];
      if (pages.indexOf(page) < 0) pages.push(page);
    });
    pages.forEach(function (page) {
      var group = document.createElement("div");
      group.className = "diff-group";
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = page;
      group.appendChild(name);
      modules.forEach(function (key) {
        if (key.split("::")[0] !== page) return;
        var label = document.createElement("label");
        label.className = "diff-check";
        var input = document.createElement("input");
        input.type = "checkbox";
        input.checked = !!checked[key];
        input.onchange = function () {
          checked[key] = input.checked;
          saveChecked();
          if (input.checked) {
            var first = CHANGES.filter(function (item) { return item.page + "::" + item.module === key; })[0];
            pinId = first.id;
            paintCards();
            focusChange(first);
          } else {
            if (pinId && !visibleChanges().some(function (item) { return item.id === pinId; })) pinId = null;
            paintCards();
            measure();
          }
        };
        var text = document.createElement("span");
        text.textContent = key.split("::")[1];
        label.appendChild(input);
        label.appendChild(text);
        group.appendChild(label);
      });
      box.appendChild(group);
    });
  }
  function paintCards() {
    var box = document.getElementById("diffCards");
    box.innerHTML = "";
    visibleChanges().forEach(function (item) {
      var index = CHANGES.indexOf(item) + 1;
      var no = (index < 10 ? "0" : "") + index;
      var card = document.createElement("article");
      card.className = "diff-card" + (pinId === item.id ? " pin" : "");
      card.setAttribute("data-id", item.id);
      var examples = (item.examples || []).map(function (line) { return "<li>" + esc(line) + "</li>"; }).join("");
      var href = prdHref(item);
      var section = item.prd && item.prd.section;
      card.innerHTML =
        '<span class="diff-no">' + no + '</span>' +
        '<h4>' + esc(item.title) + '</h4>' +
        '<div class="diff-meta">' + esc(TYPE[item.type] || item.type) + " · " + esc(LEVEL[item.level] || item.level) + '</div>' +
        '<p>' + esc(item.desc) + '</p>' +
        '<div class="diff-ba"><span>前</span><div>' + esc(item.before) + '</div></div>' +
        '<div class="diff-ba"><span>后</span><div>' + esc(item.after) + '</div></div>' +
        (examples ? '<ul class="diff-ex">' + examples + '</ul>' : '') +
        (href && section ? '<a class="diff-link" target="_blank" rel="noopener" href="' + esc(href) + '">PRD · ' + esc(section) + '</a>' : '');
      card.onmouseenter = function () { hoverId = item.id; draw(); };
      card.onmouseleave = function () { if (hoverId === item.id) hoverId = null; draw(); };
      card.onclick = function (e) {
        if (e.target.closest("a")) return;
        pinId = item.id;
        paintCards();
        var active = document.querySelector('.diff-card[data-id="' + item.id + '"]');
        if (active) active.scrollIntoView({ block: "nearest" });
        focusChange(item);
      };
      box.appendChild(card);
    });
  }
  function syncRail() {
    rail.classList.toggle("collapsed", !railOpen);
    fab.classList.toggle("show", !railOpen);
    localStorage.setItem(LS_RAIL, railOpen ? "1" : "0");
    var page = pageEl();
    var spacer = document.getElementById("diffSpacer");
    if (railOpen) {
      if (!spacer) {
        spacer = document.createElement("div");
        spacer.id = "diffSpacer";
        spacer.style.cssText = "width:calc(100% + 360px);height:1px;pointer-events:none;";
        page.appendChild(spacer);
      }
    } else if (spacer) {
      spacer.remove();
    }
  }
  function shown(el) {
    return !!(el && el.getClientRects().length);
  }
  function measure() {
    document.querySelectorAll(".diff-anchor").forEach(function (node) { node.remove(); });
    var page = pageEl();
    var pageRect = page.getBoundingClientRect();
    visibleChanges().forEach(function (item) {
      var el = document.querySelector(item.target);
      if (!shown(el)) return;
      var rect = el.getBoundingClientRect();
      var anchor = document.createElement("button");
      anchor.type = "button";
      anchor.className = "diff-anchor" + (pinId === item.id ? " pin" : "");
      anchor.setAttribute("data-id", item.id);
      var index = CHANGES.indexOf(item) + 1;
      anchor.textContent = (index < 10 ? "0" : "") + index;
      anchor.style.left = (rect.left - pageRect.left + page.scrollLeft) + "px";
      anchor.style.top = (rect.top - pageRect.top + page.scrollTop) + "px";
      anchor.onclick = function (e) {
        e.stopPropagation();
        pinId = item.id;
        hoverId = null;
        if (!railOpen) {
          railOpen = true;
          syncRail();
        }
        paintCards();
        var card = document.querySelector('.diff-card[data-id="' + item.id + '"]');
        if (card) card.scrollIntoView({ block: "nearest" });
        pulse(el);
        measure();
      };
      anchor.onmouseenter = function () { hoverId = item.id; draw(); };
      anchor.onmouseleave = function () { if (hoverId === item.id) hoverId = null; draw(); };
      page.appendChild(anchor);
      anchor.style.visibility = "hidden";
      var top = document.elementFromPoint(rect.left + 11, rect.top + 11);
      anchor.style.visibility = "";
      if (top && top.closest && top.closest("#diffRail")) anchor.style.display = "none";
    });
    draw();
  }
  window.__diffRemeasure = function () { measure(); };
  function resizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if (!railOpen) return;
    var id = pinId || hoverId;
    if (!id) return;
    var card = document.querySelector('.diff-card[data-id="' + id + '"]');
    var anchor = document.querySelector('.diff-anchor[data-id="' + id + '"]');
    if (!card || !anchor || anchor.style.display === "none") return;
    var a = card.getBoundingClientRect();
    var b = anchor.getBoundingClientRect();
    var page = pageEl().getBoundingClientRect();
    if (b.bottom < page.top || b.top > page.bottom || b.right < page.left || b.left > page.right) return;
    var x1 = a.left;
    var y1 = Math.min(Math.max(a.top + a.height / 2, 8), window.innerHeight - 8);
    var x2 = b.left + b.width / 2;
    var y2 = b.top + b.height / 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo((x1 + x2) / 2, y1, (x1 + x2) / 2, y2, x2, y2);
    ctx.strokeStyle = "#f0b429";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  document.getElementById("diffCollapse").onclick = function () { railOpen = false; syncRail(); measure(); };
  fab.onclick = function () { railOpen = true; syncRail(); measure(); };
  rail.addEventListener("click", function (e) { e.stopPropagation(); });
  pageEl().addEventListener("scroll", measure);
  window.addEventListener("resize", function () { resizeCanvas(); measure(); });
  document.querySelectorAll(".table-wrap").forEach(function (node) { node.addEventListener("scroll", measure); });
  paintDemo();
  paintMods();
  paintCards();
  syncRail();
  resizeCanvas();
  measure();
})();

</script>
</body>
</html>
