<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>客户池列表与详情优化</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f2329;
    background: #f2f3f5;
    font-size: 13px;
  }
  button, input, textarea { font-family: inherit; font-size: 13px; }
  .app { display: flex; height: 100%; }
  .sider {
    width: 168px; background: #1f2a44; color: #c9d2e3; flex-shrink: 0;
    display: flex; flex-direction: column;
  }
  .logo {
    height: 48px; display: flex; align-items: center; padding: 0 16px;
    color: #fff; font-weight: 600; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .nav-group { padding: 12px 0; }
  .nav-title { padding: 6px 16px; color: #8b97ad; font-size: 12px; }
  .nav-item { padding: 9px 16px; cursor: default; }
  .nav-item.active { background: #2f6fed; color: #fff; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 48px; background: #fff; border-bottom: 1px solid #e5e6eb;
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
  }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 6px 12px; border-radius: 4px 4px 0 0; background: #f2f3f5; color: #4e5969;
  }
  .tab.on { background: #e8f3ff; color: #2f6fed; }
  .user { color: #4e5969; }
  .content { flex: 1; overflow: auto; padding: 12px; }
  .panel { background: #fff; border: 1px solid #e5e6eb; min-height: 100%; }
  .toolbar {
    display: flex; gap: 8px; align-items: center; padding: 12px; border-bottom: 1px solid #f2f3f5; flex-wrap: wrap;
  }
  .toolbar input, .toolbar select {
    height: 32px; border: 1px solid #e5e6eb; border-radius: 4px; padding: 0 8px; color: #86909c; background: #fff;
  }
  .btn {
    height: 32px; padding: 0 12px; border-radius: 4px; border: 1px solid #e5e6eb; background: #fff; cursor: pointer; color: #1f2329;
  }
  .btn.primary { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  .btn.link { border: 0; background: transparent; color: #2f6fed; padding: 0 4px; height: auto; cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .table-wrap { overflow: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 1100px; }
  th, td { border-bottom: 1px solid #f2f3f5; padding: 10px 8px; text-align: left; vertical-align: top; }
  th { background: #f7f8fa; color: #4e5969; font-weight: 500; white-space: nowrap; position: sticky; top: 0; }
  tr.row:hover td { background: #f7fbff; }
  .th-filter { display: inline-flex; align-items: center; gap: 4px; position: relative; }
  .funnel {
    width: 16px; height: 16px; border: 0; background: transparent; color: #86909c; cursor: pointer; padding: 0;
  }
  .funnel.on { color: #2f6fed; }
  .dropdown {
    position: absolute; top: 22px; left: 0; z-index: 20; width: 240px;
    background: #fff; border: 1px solid #e5e6eb; box-shadow: 0 6px 16px rgba(0,0,0,.08); padding: 8px 0 8px;
  }
  .check { display: flex; align-items: center; gap: 8px; padding: 6px 12px; cursor: pointer; }
  .check:hover { background: #f7f8fa; }
  .drop-actions { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px 0; border-top: 1px solid #f2f3f5; margin-top: 6px; }
  .drop-actions .btn { flex: 1; }
  .record {
    color: #1f2329; line-height: 1.5; max-height: 60px; overflow: hidden; cursor: text;
    min-height: 20px; border-radius: 4px; padding: 2px 4px;
  }
  .record:hover { background: #f2f3f5; }
  .record.empty { color: #c9cdd4; }
  .record-edit { width: 180px; min-height: 72px; border: 1px solid #2f6fed; border-radius: 4px; padding: 6px; resize: vertical; }
  .count { color: #86909c; font-size: 12px; text-align: right; }
  .saving { color: #86909c; }
  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: #fff; border: 1px solid #ffccc7; color: #cf1322; padding: 8px 14px;
    border-radius: 4px; box-shadow: 0 6px 16px rgba(0,0,0,.08); display: none; z-index: 50;
  }
  .empty { padding: 48px; text-align: center; color: #86909c; }
  .detail-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid #f2f3f5;
  }
  .detail-actions { display: flex; gap: 8px; }
  .section-title { padding: 12px 16px 0; font-weight: 600; }
  .desc { margin: 12px 16px; border: 1px solid #e5e6eb; display: grid; grid-template-columns: 120px 1fr 120px 1fr 140px 1fr 140px 1fr; }
  .desc .k, .desc .v { border-bottom: 1px solid #e5e6eb; border-right: 1px solid #e5e6eb; padding: 8px 10px; min-height: 36px; }
  .desc .k { background: #f7f8fa; color: #4e5969; }
  .desc .span2 { grid-column: span 3; }
  .subtabs { display: flex; gap: 16px; padding: 0 16px; border-bottom: 1px solid #e5e6eb; }
  .subtab { padding: 10px 2px; color: #4e5969; cursor: pointer; }
  .subtab.on { color: #2f6fed; border-bottom: 2px solid #2f6fed; }
  .filter-bar { display: flex; gap: 8px; align-items: center; padding: 12px 16px; }
  .filter-bar input { height: 32px; width: 240px; border: 1px solid #e5e6eb; border-radius: 4px; padding: 0 8px; }
  .group-title { padding: 4px 16px 8px; font-weight: 600; }
  .auth-table { margin: 0 16px 16px; min-width: 0; }
  .auth-table th, .auth-table td { border: 1px solid #f2f3f5; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">
  <aside class="sider">
    <div class="logo">电销CRM</div>
    <div class="nav-group">
      <div class="nav-title">客户管理</div>
      <div class="nav-item active">客户池</div>
      <div class="nav-item">已成交</div>
      <div class="nav-item">付费线索池</div>
    </div>
  </aside>
  <section class="main">
    <header class="topbar">
      <div class="tabs">
        <div class="tab">首页</div>
        <div class="tab on" id="pageTab">客户池</div>
      </div>
      <div class="user">liyingping</div>
    </header>
    <div class="content">
      <div class="panel" id="listView">
        <div class="toolbar">
          <input placeholder="请输入家庭ID" disabled />
          <input placeholder="请输入洋葱ID" disabled />
          <input placeholder="请输入客户手机号" disabled />
          <button class="btn primary" disabled>搜索</button>
          <button class="btn" id="clearAll">清空筛选条件</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>家庭ID</th>
                <th>洋葱ID</th>
                <th>客户手机号</th>
                <th>用户信息记录</th>
                <th>
                  <div class="th-filter">
                    来源
                    <button class="funnel" id="funnel" type="button">▾</button>
                    <div class="dropdown hidden" id="sourceDrop"></div>
                  </div>
                </th>
                <th>用户身份</th>
                <th>客户类型</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="empty hidden" id="listEmpty">暂无符合条件的客户</div>
        </div>
      </div>

      <div class="panel hidden" id="detailView">
        <div class="detail-head">
          <strong>基础信息</strong>
          <div class="detail-actions">
            <button class="btn primary" disabled>一键拨打</button>
            <button class="btn" id="backBtn">返回</button>
          </div>
        </div>
        <div class="desc" id="desc"></div>
        <div class="subtabs">
          <div class="subtab">订单记录</div>
          <div class="subtab on">内容权限</div>
          <div class="subtab">观看记录</div>
          <div class="subtab">跟单记录</div>
        </div>
        <div class="filter-bar">
          <input id="authInput" placeholder="请输入授权名称" />
          <button class="btn" id="authClear" type="button">清空</button>
        </div>
        <div id="authGroups"></div>
        <div class="empty hidden" id="authEmpty">暂无匹配的内容权限</div>
      </div>
    </div>
  </section>
</div>
<script>
var SOURCES = ["中学业务", "人工录入", "智课线", "中学业务-人工", "企业微信", "转介绍", "普通转移"];
var customers = [
  { id: "40b394", onion: "202271302", phone: "18600006987", record: "拒接，晚上再回", source: "普通转移", role: "家长", type: "新增", name: "186***6987", region: "四川省成都市", grade: "二年级", reg: "2024-07-07 09:01:46", vip: "是", wechat: "-", family: "否", scene: "", watch: "2025-07-27 08:53:01", note: "企业微信导入", phoneType: "空", bind: "已绑定待确认" },
  { id: "N6a420", onion: "1922534", phone: "13885386801", record: "", source: "转介绍", role: "学生", type: "新增", name: "138***6801", region: "湖北省武汉市", grade: "初一", reg: "2025-03-02 11:20:08", vip: "否", wechat: "小雨", family: "是", scene: "观看教材同步课视频", watch: "2025-07-27 11:09:37", note: "", phoneType: "家长手机", bind: "已绑定" },
  { id: "10d815", onion: "20225451", phone: "1587169932", record: "晚上联系妈妈", source: "企业微信", role: "家长", type: "新增", name: "158***9932", region: "河南省郑州市", grade: "三年级", reg: "2025-01-18 16:02:11", vip: "是", wechat: "-", family: "否", scene: "观看教材同步课视频-提交习题", watch: "2025-07-27 11:27:18", note: "", phoneType: "空", bind: "未绑定" },
  { id: "849523", onion: "16678246", phone: "1377200257", record: "", source: "中学业务", role: "家长", type: "付费", name: "137***0257", region: "广东省深圳市", grade: "初二", reg: "2023-11-09 08:40:22", vip: "是", wechat: "陈妈妈", family: "否", scene: "成长场景-进入次元书桌", watch: "2025-07-27 02:15:00", note: "", phoneType: "家长手机", bind: "已绑定待确认" },
  { id: "77c901", onion: "18832011", phone: "13900001111", record: "已加微信", source: "人工录入", role: "学生", type: "新增", name: "139***1111", region: "北京市", grade: "五年级", reg: "2024-12-01 19:12:40", vip: "否", wechat: "-", family: "否", scene: "", watch: "2025-06-30 21:08:44", note: "人工录入", phoneType: "学生手机", bind: "未绑定" }
];
var auths = [
  { group: "同步课", name: "初中英语", channel: "购买获得", sid: "6aa3d5", start: "2026-09-11 18:52:49", end: "2026-09-29 23:59:59", total: "1752天5小时", left: "1714天10小时", state: "使用中" },
  { group: "同步课", name: "初中数学", channel: "购买获得", sid: "6aa3d6", start: "2026-09-11 18:52:49", end: "2026-09-29 23:59:59", total: "1752天5小时", left: "1714天10小时", state: "使用中" },
  { group: "同步课", name: "初中物理", channel: "购买获得", sid: "6aa3d7", start: "2026-09-11 18:50:15", end: "2026-09-29 23:59:59", total: "1752天7小时", left: "1714天10小时", state: "使用中" },
  { group: "培优课", name: "初中英语培优", channel: "购买获得", sid: "7bb901", start: "2026-08-01 10:00:00", end: "2026-12-31 23:59:59", total: "152天", left: "73天", state: "使用中" },
  { group: "电子试卷", name: "初中数学试卷", channel: "体验获得", sid: "8cc220", start: "2026-09-01 00:00:00", end: "2026-09-30 23:59:59", total: "30天", left: "0天", state: "已使用" }
];

var applied = [];
var draft = [];
var dropOpen = false;
var editingId = null;
var current = null;
var authKeyword = "";

function $(id) { return document.getElementById(id); }

function showToast(text) {
  var el = $("toast");
  el.textContent = text;
  el.style.display = "block";
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function () { el.style.display = "none"; }, 2000);
}

function renderDrop() {
  var html = "";
  SOURCES.forEach(function (name) {
    var checked = draft.indexOf(name) >= 0 ? "checked" : "";
    html += '<label class="check"><input type="checkbox" data-source="' + name + '" ' + checked + ' />' + name + '</label>';
  });
  html += '<div class="drop-actions"><button class="btn" id="invertBtn" type="button">反选</button><button class="btn" id="clearBtn" type="button">清空</button><button class="btn primary" id="okBtn" type="button">确定</button></div>';
  $("sourceDrop").innerHTML = html;
  $("sourceDrop").querySelectorAll("input").forEach(function (input) {
    input.addEventListener("change", function () {
      var name = input.getAttribute("data-source");
      if (input.checked) {
        if (draft.indexOf(name) < 0) draft.push(name);
      } else {
        draft = draft.filter(function (item) { return item !== name; });
      }
    });
  });
  $("invertBtn").onclick = function (e) {
    e.stopPropagation();
    draft = SOURCES.filter(function (name) { return draft.indexOf(name) < 0; });
    renderDrop();
  };
  $("clearBtn").onclick = function (e) {
    e.stopPropagation();
    draft = [];
    renderDrop();
  };
  $("okBtn").onclick = function (e) {
    e.stopPropagation();
    applied = draft.slice();
    closeDrop(false);
    renderList();
  };
}

function openDrop() {
  draft = applied.slice();
  dropOpen = true;
  $("sourceDrop").classList.remove("hidden");
  $("funnel").classList.toggle("on", applied.length > 0 || dropOpen);
  renderDrop();
}
function closeDrop(apply) {
  if (apply) applied = draft.slice();
  dropOpen = false;
  $("sourceDrop").classList.add("hidden");
  $("funnel").classList.toggle("on", applied.length > 0);
  if (apply) renderList();
}

function renderList() {
  var rows = customers.filter(function (item) {
    return applied.length === 0 || applied.indexOf(item.source) >= 0;
  });
  var html = "";
  rows.forEach(function (item) {
    var recordCell;
    if (editingId === item.id) {
      recordCell = '<textarea class="record-edit" id="editor" maxlength="500">' + escapeText(item.record) + '</textarea><div class="count"><span id="counter"></span></div>';
    } else if (item._saving) {
      recordCell = '<div class="saving">保存中</div>';
    } else {
      var text = item.record ? escapeText(item.record) : "点击编辑";
      var cls = item.record ? "record" : "record empty";
      recordCell = '<div class="' + cls + '" data-edit="' + item.id + '">' + text + '</div>';
    }
    html += '<tr class="row"><td>' + item.id + '</td><td><button class="btn link" data-open="' + item.id + '">' + item.onion + '</button></td><td>' + item.phone + '</td><td>' + recordCell + '</td><td>' + item.source + '</td><td>' + item.role + '</td><td>' + item.type + '</td></tr>';
  });
  $("tbody").innerHTML = html;
  $("listEmpty").classList.toggle("hidden", rows.length > 0);
  $("tbody").querySelectorAll("[data-open]").forEach(function (btn) {
    btn.onclick = function () { openDetail(btn.getAttribute("data-open")); };
  });
  $("tbody").querySelectorAll("[data-edit]").forEach(function (cell) {
    cell.onclick = function (e) {
      e.stopPropagation();
      editingId = cell.getAttribute("data-edit");
      renderList();
      bindEditor();
    };
  });
  if (editingId) bindEditor();
}

function bindEditor() {
  var editor = $("editor");
  if (!editor) return;
  var counter = $("counter");
  function sync() { counter.textContent = editor.value.length + "/500"; }
  sync();
  editor.oninput = sync;
  editor.focus();
  editor.onblur = function () { saveRecord(editingId, editor.value); };
}

function saveRecord(id, value) {
  var item = customers.filter(function (row) { return row.id === id; })[0];
  editingId = null;
  if (!item) return;
  if (value === item.record) {
    renderList();
    return;
  }
  item._saving = true;
  var next = value;
  renderList();
  setTimeout(function () {
    item._saving = false;
    if (next.indexOf("保存失败") >= 0) {
      showToast("保存失败，请重试");
    } else {
      item.record = next;
    }
    renderList();
  }, 400);
}

function escapeText(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function cell(label, value, wide) {
  return '<div class="k">' + label + '</div><div class="v' + (wide ? ' span2' : '') + '">' + (value || "") + '</div>';
}

function openDetail(id) {
  current = customers.filter(function (row) { return row.id === id; })[0];
  $("pageTab").textContent = "客户详情-" + current.phone;
  $("listView").classList.add("hidden");
  $("detailView").classList.remove("hidden");
  $("desc").innerHTML =
    cell("客户昵称", current.name) + cell("所在地", current.region) + cell("用户手机号", current.phone) + cell("年级", current.grade) +
    cell("用户洋葱ID", current.onion) + cell("注册时间", current.reg) + cell("是否为会员", current.vip) + cell("客户类型", current.type) +
    cell("微信昵称", current.wechat) + cell("家庭组信息", current.family) + cell("线索触发场景", current.scene, true) +
    cell("来源", current.source) + cell("最近一次看课时间", current.watch, true) + cell("知识点", "", true) +
    cell("手机号类型", current.phoneType) + cell("学情被绑定状态", current.bind) + cell("录入备注", current.note, true);
  authKeyword = "";
  $("authInput").value = "";
  renderAuth();
}

function renderAuth() {
  var key = authKeyword.trim();
  var groups = {};
  auths.forEach(function (item) {
    if (key && item.name.indexOf(key) < 0) return;
    if (!groups[item.group]) groups[item.group] = [];
    groups[item.group].push(item);
  });
  var names = Object.keys(groups);
  var html = "";
  names.forEach(function (name) {
    html += '<div class="group-title">' + name + '</div><table class="auth-table"><thead><tr><th>授权名称</th><th>来源类型</th><th>来源ID</th><th>生效时间</th><th>截止时间</th><th>总时长</th><th>剩余时长</th><th>状态</th></tr></thead><tbody>';
    groups[name].forEach(function (item) {
      html += '<tr><td>' + item.name + '</td><td>' + item.channel + '</td><td>' + item.sid + '</td><td>' + item.start + '</td><td>' + item.end + '</td><td>' + item.total + '</td><td>' + item.left + '</td><td>' + item.state + '</td></tr>';
    });
    html += '</tbody></table>';
  });
  $("authGroups").innerHTML = html;
  $("authEmpty").classList.toggle("hidden", names.length > 0);
}

$("funnel").onclick = function (e) {
  e.stopPropagation();
  if (dropOpen) closeDrop(true);
  else openDrop();
};
document.addEventListener("click", function () { if (dropOpen) closeDrop(true); });
$("sourceDrop").addEventListener("click", function (e) { e.stopPropagation(); });
$("clearAll").onclick = function () {
  applied = [];
  draft = [];
  closeDrop(false);
  renderList();
};
$("backBtn").onclick = function () {
  $("detailView").classList.add("hidden");
  $("listView").classList.remove("hidden");
  $("pageTab").textContent = "客户池";
  renderList();
};
$("authInput").addEventListener("input", function () {
  authKeyword = $("authInput").value;
  renderAuth();
});
$("authClear").onclick = function () {
  authKeyword = "";
  $("authInput").value = "";
  renderAuth();
};

renderList();
</script>
</body>
</html>
