<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企微转化统计 - 来源筛选与无等级</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; color: #303133; background: #f0f2f5; }
body { display: flex; overflow: hidden; }
.side { flex: none; width: 168px; height: 100%; background: #001529; color: #c0c8d2; overflow: auto; }
.side .logo { height: 48px; display: flex; align-items: center; padding: 0 16px; color: #fff; font-size: 17px; font-weight: 600; background: #002140; }
.side .item { padding: 11px 18px; cursor: default; }
.side .item.sub { padding-left: 32px; font-size: 12px; color: #a6adb4; }
.side .item.open { color: #fff; }
.side .item.active { background: #1677ff; color: #fff; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
.topbar { flex: none; height: 48px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; padding: 0 16px; gap: 12px; color: #909399; }
.topbar .notice { flex: 1; text-align: center; color: #e6a23c; font-size: 12px; }
.tagsbar { flex: none; height: 34px; background: #fff; border-bottom: 1px solid #ebeef5; display: flex; align-items: center; padding: 0 12px; }
.tagsbar span { border: 1px solid #dcdfe6; padding: 2px 10px; font-size: 12px; color: #606266; }
#diffPage { flex: 1; overflow: auto; padding: 14px; }
.card { background: #fff; border-radius: 4px; padding: 14px 16px 16px; min-width: 1180px; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid #e4e7ed; margin-bottom: 14px; }
.tabs div { padding: 8px 2px; color: #606266; cursor: default; }
.tabs div.on { color: #1677ff; border-bottom: 2px solid #1677ff; margin-bottom: -1px; }
.filters { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 12px; }
.f-item { position: relative; display: flex; align-items: center; gap: 6px; }
.f-label { color: #606266; white-space: nowrap; }
.f-label .req { color: #f56c6c; margin-right: 2px; }
.ctl { height: 30px; border: 1px solid #dcdfe6; border-radius: 4px; background: #fff; padding: 0 8px; font-size: 13px; color: #303133; outline: none; }
.ctl:focus { border-color: #1677ff; }
select.ctl { padding-right: 4px; }
.timebox { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border: 1px dashed transparent; border-radius: 4px; }
.timebox.err .ctl { border-color: #f56c6c; }
.timebox .clear { width: 20px; height: 20px; border: 0; border-radius: 10px; background: #c0c4cc; color: #fff; font-size: 12px; line-height: 20px; padding: 0; cursor: pointer; }
.timebox .clear[hidden] { display: none; }
.f-err { position: absolute; left: 6px; top: 36px; color: #f56c6c; font-size: 12px; white-space: nowrap; }
.ms { position: relative; }
.ms-btn { width: 150px; text-align: left; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 28px; }
.ms-btn.placeholder { color: #a8abb2; }
.ms-panel { position: absolute; top: 34px; left: 0; z-index: 50; width: 200px; max-height: 260px; overflow: auto; background: #fff; border: 1px solid #e4e7ed; border-radius: 4px; box-shadow: 0 6px 16px rgba(0,0,0,.12); padding: 4px 0; display: none; }
.ms-panel.show { display: block; }
.ms-panel label { display: flex; align-items: center; gap: 6px; padding: 6px 12px; cursor: pointer; }
.ms-panel label:hover { background: #f5f7fa; }
.ms-clear { width: 20px; height: 20px; border: 0; border-radius: 10px; background: #c0c4cc; color: #fff; font-size: 12px; line-height: 20px; padding: 0; cursor: pointer; }
.ms-clear[hidden] { display: none; }
.btn { height: 30px; padding: 0 15px; border-radius: 4px; border: 1px solid #dcdfe6; background: #fff; color: #606266; cursor: pointer; font-size: 13px; }
.btn.primary { background: #1677ff; border-color: #1677ff; color: #fff; }
.btn.primary:hover { background: #4096ff; }
.spacer { flex: 1; }
.legend { margin: 14px 0 8px; font-size: 12px; color: #909399; }
.legend .up { color: #f56c6c; } .legend .down { color: #67c23a; }
.table-wrap { overflow: auto; border: 1px solid #ebeef5; max-height: calc(100vh - 290px); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 10px; border-bottom: 1px solid #ebeef5; text-align: center; white-space: nowrap; }
th { background: #f5f7fa; color: #606266; font-weight: 500; position: sticky; top: 0; z-index: 2; cursor: pointer; user-select: none; }
th .sort { color: #c0c4cc; font-size: 10px; margin-left: 2px; }
th .sort.on { color: #1677ff; }
td .up { color: #f56c6c; margin-left: 2px; } td .down { color: #67c23a; margin-left: 2px; }
tfoot td { background: #fafafa; font-weight: 600; position: sticky; z-index: 2; }
tfoot tr.sum td { bottom: 38px; } tfoot tr.avg td { bottom: 0; }
.empty { padding: 40px; color: #909399; text-align: center; }
.loading { opacity: .45; transition: opacity .15s; }
.toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 9500; padding: 9px 18px; border-radius: 4px; font-size: 13px; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.toast.show { display: block; }
.toast.error { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
.toast.success { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
.mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 8000; display: none; align-items: center; justify-content: center; }
.mask.show { display: flex; }
.dialog { width: min(1080px, calc(100vw - 420px)); min-width: 720px; max-height: 84vh; background: #fff; border-radius: 6px; display: flex; flex-direction: column; position: relative; }
.dialog-hd { padding: 14px 18px; border-bottom: 1px solid #ebeef5; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; }
.dialog-hd .x { border: 0; background: none; font-size: 18px; color: #909399; cursor: pointer; }
.dialog-bd { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 12px 18px; gap: 8px; }
.dialog-bd .sub { color: #909399; font-size: 12px; }
.sheet-body { flex: 1; overflow: auto; border: 1px solid #d9d9d9; }
.sheet-body table th { background: #eef3f8; cursor: default; }
.sheet-body table td, .sheet-body table th { border: 1px solid #e4e7ed; padding: 6px 8px; font-size: 12px; text-align: left; }
.sheet-tabs { display: flex; gap: 2px; border-top: 1px solid #d9d9d9; background: #f3f3f3; padding: 0 6px; }
.sheet-tabs div { padding: 6px 16px; font-size: 12px; cursor: pointer; color: #606266; }
.sheet-tabs div.on { background: #fff; color: #1677ff; font-weight: 600; border-bottom: 2px solid #1677ff; }
.dialog-ft { padding: 10px 18px 14px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #ebeef5; }
</style>
</head>
<body>
<aside class="side">
  <div class="logo">电销CRM</div>
  <div class="item">搜线索</div>
  <div class="item">个人工作台</div>
  <div class="item">公海池</div>
  <div class="item">客户管理</div>
  <div class="item">订单管理</div>
  <div class="item open">数据统计</div>
  <div class="item sub">个人排行榜</div>
  <div class="item sub">小组排行榜</div>
  <div class="item sub">团队排行榜</div>
  <div class="item sub">当配转化统计</div>
  <div class="item sub">客服推送统计</div>
  <div class="item sub">转介绍业绩统计</div>
  <div class="item sub active">企微数据</div>
  <div class="item">活动管理</div>
  <div class="item">积分商城</div>
  <div class="item">系统设置</div>
</aside>
<div class="main">
  <div class="topbar"><span>☰ 数据统计</span><div class="notice">今日已领0，仅供线索池上限800(当前占用)</div><span>liyingping</span></div>
  <div class="tagsbar"><span>首页</span></div>
  <div id="diffPage">
    <div class="card">
      <div class="tabs"><div>企微数据统计</div><div class="on">企微转化统计</div></div>
      <div class="filters" id="filters">
        <div class="f-item ms" id="fGroup">
          <button class="ctl ms-btn placeholder" type="button" data-ms="group">请选择小组</button>
          <div class="ms-panel" data-panel="group"></div>
        </div>
        <div class="f-item ms" id="fWorker">
          <button class="ctl ms-btn placeholder" type="button" data-ms="worker">请选择坐席</button>
          <div class="ms-panel" data-panel="worker"></div>
        </div>
        <div class="f-item" id="fReceive">
          <div class="timebox" id="receiveBox">
            <span class="f-label"><span class="req">*</span>线索领取时间</span>
            <select class="ctl" id="receiveType"><option value="month">月份</option><option value="week">周</option><option value="custom">自定义</option></select>
            <span id="receivePicker"></span>
          </div>
          <div class="f-err" id="receiveErr" hidden>请选择线索领取时间</div>
        </div>
        <div class="f-item" id="fDeal">
          <div class="timebox" id="dealBox">
            <span class="f-label">成交时间</span>
            <select class="ctl" id="dealType"><option value="month">月份</option><option value="week">周</option><option value="custom">自定义</option></select>
            <span id="dealPicker"></span>
            <button class="clear" id="dealClear" type="button" title="清空">×</button>
          </div>
          <div class="f-err" id="dealErr" hidden></div>
        </div>
        <div class="f-item ms" id="fLevel">
          <button class="ctl ms-btn placeholder" type="button" data-ms="level">选择线索等级</button>
          <div class="ms-panel" data-panel="level"></div>
        </div>
        <div class="f-item ms" id="fSource">
          <button class="ctl ms-btn placeholder" type="button" data-ms="source">选择来源</button>
          <button class="ms-clear" type="button" data-clear="source" title="清空" hidden>×</button>
          <div class="ms-panel" data-panel="source"></div>
        </div>
        <button class="btn primary" id="btnSearch" type="button">搜索</button>
        <div class="spacer"></div>
        <button class="btn primary" id="btnExport" type="button">导出</button>
      </div>
      <div class="legend"><span class="up">↑</span>代表高于统计的平均值　<span class="down">↓</span>代表低于统计的平均值</div>
      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr id="thead">
              <th data-k="idx">序号</th>
              <th data-k="receive">领取线索量<span class="sort">⇅</span></th>
              <th data-k="conv" id="thConv">转化线索量<span class="sort">⇅</span></th>
              <th data-k="amount">转化金额<span class="sort">⇅</span></th>
              <th data-k="rate">转化率<span class="sort">⇅</span></th>
              <th data-k="price">客单价<span class="sort">⇅</span></th>
              <th data-k="arpu">ARPU<span class="sort">⇅</span></th>
              <th>坐席名称</th><th>所属组名</th><th>所属小组</th><th>所属团队</th><th>所属学段</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
          <tfoot id="tfoot"></tfoot>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="mask" id="exportMask">
  <div class="dialog">
    <div class="dialog-hd"><span id="exportTitle">导出预览</span><button class="x" id="exportClose" type="button">×</button></div>
    <div class="dialog-bd">
      <div class="sub" id="exportSub"></div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-tabs">
        <div id="sheetTabStat" class="on" data-sheet="stat">sheet1</div>
        <div id="sheetTabDetail" data-sheet="detail">转化订单明细</div>
      </div>
    </div>
    <div class="dialog-ft"><button class="btn" id="exportCancel" type="button">取消</button><button class="btn primary" id="exportDownload" type="button">下载</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var NOW = new Date(2026, 10, 23, 10, 19, 0);
  var DAY = 86400000;
  var LEVELS = ["S", "A", "B", "C"];
  var NO_LEVEL = "无等级";
  var SOURCES = ["AI机器人", "企业微信"];
  var SEATS = [
    { id: 101, name: "胡涛", group: "*馨营奋队-库兴润", sub: "1-库兴润", team: "无畏军团", stage: "电销团队初中部" },
    { id: 102, name: "段贺玉02", group: "*馨营奋队-库兴润", sub: "1-库兴润", team: "无畏军团", stage: "电销团队初中部" },
    { id: 103, name: "李天娇01", group: "*馨营奋队-库兴润", sub: "1-库兴润", team: "无畏军团", stage: "电销团队初中部" },
    { id: 104, name: "曾锦01", group: "*馨营奋队-库兴润", sub: "1-库兴润", team: "无畏军团", stage: "电销团队初中部" },
    { id: 105, name: "杨帆", group: "*勇战队-高姐", sub: "3-高姐", team: "平板军团", stage: "电销团队初中部" },
    { id: 106, name: "刘思捷", group: "*勇战队-高姐", sub: "3-高姐", team: "平板军团", stage: "电销团队初中部" },
    { id: 107, name: "周文君", group: "*勇战队-高姐", sub: "3-高姐", team: "平板军团", stage: "电销团队初中部" },
    { id: 108, name: "陈晨", group: "钞钞队-钟普", sub: "20-钟普", team: "金牌超红团", stage: "电销团队初中部" },
    { id: 109, name: "王璐03", group: "钞钞队-钟普", sub: "20-钟普", team: "金牌超红团", stage: "电销团队初中部" },
    { id: 110, name: "黄正", group: "*至王队-黄正", sub: "8-黄正", team: "第一军团", stage: "电销团队小学部" },
    { id: 111, name: "严萍01", group: "*至王队-黄正", sub: "8-黄正", team: "第一军团", stage: "电销团队小学部" },
    { id: 112, name: "孟凡", group: "*至王队-黄正", sub: "8-黄正", team: "第一军团", stage: "电销团队小学部" }
  ];
  var MY_SCOPE = ["1-库兴润", "3-高姐"];
  var PRICES = [498, 798, 998, 1498, 1998, 2998, 3998, 5998, 198];

  var seed = 20261118;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }

  var CLUES = [];
  var orderNo = 0;
  SEATS.forEach(function (seat) {
    [7, 8, 9, 10].forEach(function (m) {
      var days = m === 10 ? 23 : new Date(2026, m + 1, 0).getDate();
      var n = 50 + Math.floor(rnd() * 60);
      if (m === 10) n = Math.floor(n * 0.6);
      for (var i = 0; i < n; i++) {
        var t = new Date(2026, m, 1 + Math.floor(rnd() * days), 9 + Math.floor(rnd() * 11), Math.floor(rnd() * 60));
        if (t > NOW) t = new Date(NOW.getTime() - Math.floor(rnd() * 5) * 3600000);
        var clue = {
          seat: seat,
          uid: String(30000000 + Math.floor(rnd() * 69999999)),
          level: rnd() < 0.18 ? null : pick(LEVELS),
          source: rnd() < 0.45 ? SOURCES[0] : SOURCES[1],
          time: t,
          orders: []
        };
        if (rnd() < 0.065) {
          var cnt = rnd() < 0.15 ? 2 : 1;
          for (var k = 0; k < cnt; k++) {
            var pay = new Date(t.getTime() + Math.floor(Math.pow(rnd(), 2.5) * 60 * DAY) + 3600000);
            if (pay > NOW) continue;
            orderNo += 1;
            clue.orders.push({ no: "SO" + (202600000 + orderNo * 37), pay: pay, amount: pick(PRICES) });
          }
        }
        CLUES.push(clue);
      }
    });
  });

  var state = {
    allData: true,
    groups: [], workers: [], levels: [], sources: [],
    receive: { type: "month", value: "2026-11" },
    deal: { type: "month", value: "2026-11" },
    sort: { key: "", dir: 0 },
    rows: [], totals: null, avg: null, detail: [], applied: null
  };

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function fmtTime(d) { return fmtDate(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); }
  function money(n) { return n.toFixed(2); }
  function levelLabel(l) { return l ? l + "级" : NO_LEVEL; }
  function isoWeekStart(y, w) {
    var jan4 = new Date(y, 0, 4);
    var dow = (jan4.getDay() + 6) % 7;
    var mon = new Date(y, 0, 4 - dow);
    return new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + (w - 1) * 7);
  }
  function isoWeekOf(d) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var dow = (t.getDay() + 6) % 7;
    t.setDate(t.getDate() - dow + 3);
    var y = t.getFullYear();
    var first = new Date(y, 0, 4);
    var w = 1 + Math.round(((t - first) / DAY - 3 + ((first.getDay() + 6) % 7)) / 7);
    return y + "-W" + pad(w);
  }
  function defaultValue(type) {
    if (type === "month") return NOW.getFullYear() + "-" + pad(NOW.getMonth() + 1);
    if (type === "week") return isoWeekOf(NOW);
    return { start: "", end: "" };
  }
  function toRange(t) {
    if (!t || !t.value) return null;
    if (t.type === "month") {
      var p = t.value.split("-");
      return { start: new Date(+p[0], +p[1] - 1, 1), end: new Date(+p[0], +p[1], 1), label: t.value };
    }
    if (t.type === "week") {
      var q = t.value.split("-W");
      var s = isoWeekStart(+q[0], +q[1]);
      var e = new Date(s.getTime() + 7 * DAY);
      return { start: s, end: e, label: fmtDate(s) + " 至 " + fmtDate(new Date(e.getTime() - DAY)) };
    }
    if (!t.value.start || !t.value.end) return null;
    var a = t.value.start.split("-"), b = t.value.end.split("-");
    var st = new Date(+a[0], +a[1] - 1, +a[2]);
    var en = new Date(+b[0], +b[1] - 1, +b[2] + 1);
    return { start: st, end: en, label: t.value.start + " 至 " + t.value.end, custom: true };
  }

  function renderPicker(which) {
    var t = state[which];
    var box = document.getElementById(which + "Picker");
    var maxMonth = NOW.getFullYear() + "-" + pad(NOW.getMonth() + 1);
    var today = fmtDate(NOW);
    if (t.type === "month") {
      box.innerHTML = '<input class="ctl" type="month" min="2021-01" max="' + maxMonth + '" value="' + (t.value || "") + '">';
    } else if (t.type === "week") {
      box.innerHTML = '<input class="ctl" type="week" min="2021-W01" max="' + isoWeekOf(NOW) + '" value="' + (t.value || "") + '">';
    } else {
      var v = t.value || { start: "", end: "" };
      box.innerHTML = '<input class="ctl" type="date" data-part="start" min="2021-01-01" max="' + today + '" value="' + v.start + '"> 至 <input class="ctl" type="date" data-part="end" min="2021-01-01" max="' + today + '" value="' + v.end + '">';
    }
    box.querySelectorAll("input").forEach(function (input) {
      input.onchange = function () {
        if (t.type === "custom") {
          var cur = t.value && typeof t.value === "object" ? t.value : { start: "", end: "" };
          cur[input.getAttribute("data-part")] = input.value;
          var empty = !cur.start && !cur.end;
          t.value = empty ? null : cur;
        } else {
          t.value = input.value || null;
        }
        clearErrors();
        syncClear();
      };
    });
    syncClear();
  }
  function syncClear() {
    var v = state.deal.value;
    var has = v && (typeof v === "string" || v.start || v.end);
    document.getElementById("dealClear").hidden = !has;
  }

  var MS = {
    group: { placeholder: "请选择小组", options: function () { return uniq(scopeSeats().map(function (s) { return s.sub; })); }, key: "groups" },
    worker: { placeholder: "请选择坐席", options: function () {
      return scopeSeats().filter(function (s) { return !state.groups.length || state.groups.indexOf(s.sub) >= 0; }).map(function (s) { return s.name; });
    }, key: "workers" },
    level: { placeholder: "选择线索等级", options: function () { return LEVELS.map(levelLabel).concat([NO_LEVEL]); }, key: "levels" },
    source: { placeholder: "选择来源", options: function () { return SOURCES.slice(); }, key: "sources", single: true }
  };
  function uniq(arr) { return arr.filter(function (v, i) { return arr.indexOf(v) === i; }); }
  function scopeSeats() { return state.allData ? SEATS : SEATS.filter(function (s) { return MY_SCOPE.indexOf(s.sub) >= 0; }); }
  function paintMs(name) {
    var cfg = MS[name];
    var btn = document.querySelector('[data-ms="' + name + '"]');
    var panel = document.querySelector('[data-panel="' + name + '"]');
    var opts = cfg.options();
    state[cfg.key] = state[cfg.key].filter(function (v) { return opts.indexOf(v) >= 0; });
    var sel = state[cfg.key];
    btn.textContent = sel.length ? sel.join("、") : cfg.placeholder;
    btn.classList.toggle("placeholder", !sel.length);
    var clear = document.querySelector('[data-clear="' + name + '"]');
    if (clear) clear.hidden = !sel.length;
    panel.innerHTML = opts.map(function (o) {
      return '<label><input type="' + (cfg.single ? "radio" : "checkbox") + '" name="ms-' + name + '" value="' + o + '"' + (sel.indexOf(o) >= 0 ? " checked" : "") + '>' + o + '</label>';
    }).join("");
    panel.querySelectorAll("input").forEach(function (input) {
      input.onchange = function () {
        if (cfg.single) {
          state[cfg.key] = [input.value];
          paintMs(name);
          panel.classList.remove("show");
          return;
        }
        var list = state[cfg.key];
        if (input.checked) list.push(input.value);
        else list.splice(list.indexOf(input.value), 1);
        paintMs(name);
        if (name === "group") paintMs("worker");
        document.querySelector('[data-panel="' + name + '"]').classList.add("show");
      };
    });
  }
  document.querySelectorAll("[data-ms]").forEach(function (btn) {
    btn.onclick = function (e) {
      e.stopPropagation();
      var name = btn.getAttribute("data-ms");
      var panel = document.querySelector('[data-panel="' + name + '"]');
      var open = panel.classList.contains("show");
      document.querySelectorAll(".ms-panel").forEach(function (p) { p.classList.remove("show"); });
      if (!open) panel.classList.add("show");
    };
  });
  document.querySelectorAll("[data-clear]").forEach(function (btn) {
    btn.onclick = function (e) {
      e.stopPropagation();
      var name = btn.getAttribute("data-clear");
      state[MS[name].key] = [];
      paintMs(name);
    };
  });
  document.querySelectorAll(".ms-panel").forEach(function (p) { p.addEventListener("click", function (e) { e.stopPropagation(); }); });
  document.addEventListener("click", function () { document.querySelectorAll(".ms-panel").forEach(function (p) { p.classList.remove("show"); }); });

  function toast(msg, type) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "toast show " + (type || "success");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { el.className = "toast"; }, 2200);
  }
  function clearErrors() {
    document.getElementById("receiveErr").hidden = true;
    document.getElementById("dealErr").hidden = true;
    document.getElementById("receiveBox").classList.remove("err");
    document.getElementById("dealBox").classList.remove("err");
    if (window.__diffRemeasure) window.__diffRemeasure();
  }
  function showErr(which, msg) {
    var err = document.getElementById(which + "Err");
    err.textContent = msg;
    err.hidden = false;
    document.getElementById(which + "Box").classList.add("err");
    toast(msg, "error");
    if (window.__diffRemeasure) window.__diffRemeasure();
  }
  function validate() {
    clearErrors();
    var r = toRange(state.receive);
    if (!r) { showErr("receive", "请选择线索领取时间"); return null; }
    if (r.custom && r.end - r.start > 92 * DAY) { showErr("receive", "时间范围不能超过3个月"); return null; }
    var dv = state.deal.value;
    var dealPartial = state.deal.type === "custom" && dv && (!dv.start || !dv.end);
    if (dealPartial) { showErr("deal", "请选择完整的成交时间"); return null; }
    var d = toRange(state.deal);
    if (d && d.custom && d.end - d.start > 92 * DAY) { showErr("deal", "时间范围不能超过3个月"); return null; }
    if (d && d.end <= r.start) { showErr("deal", "成交时间不能早于线索领取时间"); return null; }
    return { receive: r, deal: d };
  }

  function compute(q) {
    var seats = scopeSeats().filter(function (s) {
      if (state.groups.length && state.groups.indexOf(s.sub) < 0) return false;
      if (state.workers.length && state.workers.indexOf(s.name) < 0) return false;
      return true;
    });
    var levels = state.levels;
    var sources = state.sources;
    var map = {};
    seats.forEach(function (s) { map[s.id] = { seat: s, receive: 0, conv: 0, amount: 0 }; });
    var detail = [];
    CLUES.forEach(function (c) {
      var row = map[c.seat.id];
      if (!row) return;
      if (levels.length && levels.indexOf(levelLabel(c.level)) < 0) return;
      if (sources.length && sources.indexOf(c.source) < 0) return;
      if (c.time < q.receive.start || c.time >= q.receive.end) return;
      row.receive += 1;
      var hit = c.orders.filter(function (o) {
        if (o.amount <= 298) return false;
        if (q.deal && (o.pay < q.deal.start || o.pay >= q.deal.end)) return false;
        return true;
      });
      if (hit.length) {
        row.conv += 1;
        hit.forEach(function (o) {
          row.amount += o.amount;
          detail.push({ clue: c, order: o });
        });
      }
    });
    var rows = Object.keys(map).map(function (k) {
      var r = map[k];
      r.rate = r.receive ? r.conv / r.receive : 0;
      r.price = r.conv ? r.amount / r.conv : 0;
      r.arpu = r.receive ? r.amount / r.receive : 0;
      return r;
    });
    var tot = { receive: 0, conv: 0, amount: 0 };
    rows.forEach(function (r) { tot.receive += r.receive; tot.conv += r.conv; tot.amount += r.amount; });
    tot.rate = tot.receive ? tot.conv / tot.receive : 0;
    tot.price = tot.conv ? tot.amount / tot.conv : 0;
    tot.arpu = tot.receive ? tot.amount / tot.receive : 0;
    var n = rows.length || 1;
    var avg = { receive: tot.receive / n, conv: tot.conv / n, amount: tot.amount / n, rate: tot.rate, price: tot.price, arpu: tot.arpu };
    detail.sort(function (a, b) { return b.order.pay - a.order.pay; });
    return { rows: rows, totals: tot, avg: avg, detail: detail };
  }

  function cell(v, key, isPct, isMoney) {
    var txt = isPct ? (v * 100).toFixed(2) + "%" : isMoney ? money(v) : String(v);
    var a = state.avg[key];
    var mark = v > a ? '<span class="up">↑</span>' : v < a ? '<span class="down">↓</span>' : "";
    return txt + mark;
  }
  function paintTable() {
    var rows = state.rows.slice();
    if (state.sort.key && state.sort.dir) {
      var k = state.sort.key, d = state.sort.dir;
      rows.sort(function (a, b) { return (a[k] - b[k]) * d; });
    }
    var tb = document.getElementById("tbody");
    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="12" class="empty">暂无数据</td></tr>';
      document.getElementById("tfoot").innerHTML = "";
    } else {
      tb.innerHTML = rows.map(function (r, i) {
        return "<tr><td>" + (i + 1) + "</td><td>" + cell(r.receive, "receive") + "</td><td>" + cell(r.conv, "conv") + "</td><td>" + cell(r.amount, "amount", false, true) + "</td><td>" + cell(r.rate, "rate", true) + "</td><td>" + cell(r.price, "price", false, true) + "</td><td>" + cell(r.arpu, "arpu", false, true) + "</td><td>" + r.seat.name + "</td><td>" + r.seat.group + "</td><td>" + r.seat.sub + "</td><td>" + r.seat.team + "</td><td>" + r.seat.stage + "</td></tr>";
      }).join("");
      var t = state.totals, a = state.avg;
      document.getElementById("tfoot").innerHTML =
        '<tr class="sum"><td>总数</td><td>' + t.receive + "</td><td>" + t.conv + "</td><td>" + money(t.amount) + "</td><td>" + (t.rate * 100).toFixed(2) + "%</td><td>" + money(t.price) + "</td><td>" + money(t.arpu) + '</td><td colspan="5"></td></tr>' +
        '<tr class="avg"><td>均值</td><td>' + a.receive.toFixed(2) + "</td><td>" + a.conv.toFixed(2) + "</td><td>" + money(a.amount) + "</td><td>" + (a.rate * 100).toFixed(2) + "%</td><td>" + money(a.price) + "</td><td>" + money(a.arpu) + '</td><td colspan="5"></td></tr>';
    }
    document.querySelectorAll("#thead th[data-k]").forEach(function (th) {
      var s = th.querySelector(".sort");
      if (!s) return;
      var on = state.sort.key === th.getAttribute("data-k") && state.sort.dir;
      s.className = "sort" + (on ? " on" : "");
      s.textContent = on ? (state.sort.dir > 0 ? "↑" : "↓") : "⇅";
    });
    if (window.__diffRemeasure) window.__diffRemeasure();
  }
  document.querySelectorAll("#thead th[data-k]").forEach(function (th) {
    var k = th.getAttribute("data-k");
    if (k === "idx") return;
    th.onclick = function () {
      if (state.sort.key !== k) state.sort = { key: k, dir: -1 };
      else state.sort.dir = state.sort.dir === -1 ? 1 : state.sort.dir === 1 ? 0 : -1;
      paintTable();
    };
  });

  function search(silent) {
    var q = validate();
    if (!q) return false;
    var wrap = document.getElementById("tableWrap");
    wrap.classList.add("loading");
    var res = compute(q);
    state.rows = res.rows; state.totals = res.totals; state.avg = res.avg; state.detail = res.detail; state.applied = q;
    setTimeout(function () { wrap.classList.remove("loading"); }, 150);
    paintTable();
    return true;
  }

  var currentSheet = "stat";
  function paintSheet() {
    document.getElementById("sheetTabStat").classList.toggle("on", currentSheet === "stat");
    document.getElementById("sheetTabDetail").classList.toggle("on", currentSheet === "detail");
    var body = document.getElementById("sheetBody");
    var html;
    if (currentSheet === "stat") {
      html = "<table><thead><tr><th>坐席ID</th><th>坐席名称</th><th>所属学段</th><th>所属团队</th><th>所属组名</th><th>所属小组</th><th>领取线索量</th><th>转化线索量</th><th>转化金额</th><th>转化率</th><th>客单价</th><th>ARPU</th></tr></thead><tbody>" +
        state.rows.map(function (r) {
          return "<tr><td>" + r.seat.id + "</td><td>" + r.seat.name + "</td><td>" + r.seat.stage + "</td><td>" + r.seat.team + "</td><td>" + r.seat.group + "</td><td>" + r.seat.sub + "</td><td>" + r.receive + "</td><td>" + r.conv + "</td><td>" + money(r.amount) + "</td><td>" + (r.rate * 100).toFixed(2) + "%</td><td>" + money(r.price) + "</td><td>" + money(r.arpu) + "</td></tr>";
        }).join("") + "</tbody></table>";
    } else {
      var list = state.detail;
      html = "<table><thead><tr><th>坐席名称</th><th>所属学段</th><th>所属团队</th><th>所属组</th><th>所属小组</th><th>洋葱ID</th><th>线索领取时间</th><th>线索等级</th><th>订单号</th><th>支付时间</th><th>支付金额</th></tr></thead><tbody>" +
        list.slice(0, 200).map(function (d) {
          var s = d.clue.seat;
          return "<tr><td>" + s.name + "</td><td>" + s.stage + "</td><td>" + s.team + "</td><td>" + s.group + "</td><td>" + s.sub + "</td><td>" + d.clue.uid + "</td><td>" + fmtTime(d.clue.time) + "</td><td>" + levelLabel(d.clue.level) + "</td><td>" + d.order.no + "</td><td>" + fmtTime(d.order.pay) + "</td><td>" + money(d.order.amount) + "</td></tr>";
        }).join("") + "</tbody></table>";
    }
    body.innerHTML = html;
    var q = state.applied;
    var sum = state.detail.reduce(function (s, d) { return s + d.order.amount; }, 0);
    document.getElementById("exportSub").textContent =
      "线索领取时间：" + q.receive.label + "　成交时间：" + (q.deal ? q.deal.label : "不限") +
      "　线索等级：" + (state.levels.length ? state.levels.join("、") : "全部") +
      "　来源：" + (state.sources.length ? state.sources.join("、") : "全部") +
      "　|　sheet1 共 " + state.rows.length + " 行　转化订单明细 共 " + state.detail.length + " 行，支付金额合计 " + money(sum);
    if (window.__diffRemeasure) window.__diffRemeasure();
  }
  document.querySelectorAll(".sheet-tabs [data-sheet]").forEach(function (tab) {
    tab.onclick = function () { currentSheet = tab.getAttribute("data-sheet"); paintSheet(); };
  });
  function openExport(sheet) {
    if (!search(true)) return false;
    document.getElementById("exportTitle").textContent = "企微转化统计_" + fmtDate(NOW) + ".xlsx";
    currentSheet = sheet || "stat";
    document.getElementById("exportMask").classList.add("show");
    paintSheet();
    return true;
  }
  function closeExport() {
    document.getElementById("exportMask").classList.remove("show");
    if (window.__diffRemeasure) window.__diffRemeasure();
  }
  document.getElementById("btnExport").onclick = function () { openExport("stat"); };

  document.getElementById("exportCancel").onclick = closeExport;
  document.getElementById("exportDownload").onclick = function () { closeExport(); toast("导出成功"); };
  document.getElementById("btnSearch").onclick = function () { search(); };

  function bindType(which) {
    var sel = document.getElementById(which + "Type");
    sel.onchange = function () {
      state[which].type = sel.value;
      var dv = defaultValue(sel.value);
      state[which].value = sel.value === "custom" ? null : dv;
      renderPicker(which);
      clearErrors();
    };
  }
  bindType("receive");
  bindType("deal");
  document.getElementById("dealClear").onclick = function () {
    state.deal.value = null;
    renderPicker("deal");
    clearErrors();
  };

  function setFilters(opts) {
    state.allData = opts.allData;
    state.groups = []; state.workers = [];
    state.levels = (opts.levels || []).slice();
    state.sources = (opts.sources || []).slice();
    state.receive = { type: opts.receive.type, value: opts.receive.value };
    state.deal = { type: opts.deal.type, value: opts.deal.value };
    state.sort = { key: "", dir: 0 };
    document.getElementById("receiveType").value = state.receive.type;
    document.getElementById("dealType").value = state.deal.type;
    renderPicker("receive");
    renderPicker("deal");
    paintMs("group"); paintMs("worker"); paintMs("level"); paintMs("source");
  }
  var DEMOS = {
    normal: { allData: true, receive: { type: "month", value: "2026-11" }, deal: { type: "month", value: "2026-11" } },
    history: { allData: true, receive: { type: "month", value: "2026-10" }, deal: { type: "month", value: "2026-11" } },

  window.DIFF_HOOKS_IMPL = {
    locate: function (change) {
      document.querySelectorAll(".ms-panel").forEach(function (p) { p.classList.remove("show"); });

        closeExport();
      }
    },
    setDemoState: applyDemo
  };

  applyDemo("normal");
})();

    ".diff-ba span { flex: none; width: 20px; height: 20px; border-radius: 4px; background: #0c2340; color: #f0b429; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }",
    ".diff-ba div { min-width: 0; }",
    ".diff-ex { margin: 8px 0 0; padding-left: 18px; color: #c5d7ea; }",
    ".diff-ex li { margin: 2px 0; }",
    ".diff-link { display: inline-block; margin-top: 8px; color: #7cc4ff; text-decoration: none; }",
    ".diff-link:hover { text-decoration: underline; }",
    ".diff-anchor { position: absolute; z-index: 9000; width: 22px; height: 22px; border: 0; border-radius: 11px; background: #f0b429; color: #1a1a1a; font-weight: 700; font-size: 12px; padding: 0; transform: translate(-2px, -2px); box-shadow: 0 2px 8px rgba(0,0,0,.25); cursor: pointer; }",
    ".diff-anchor.pin { outline: 2px solid #fff; }",
    ".diff-pulse { animation: diffPulse 1.1s ease 2; }",
    "@keyframes diffPulse { 0% { box-shadow: 0 0 0 0 rgba(240,180,41,.7); } 100% { box-shadow: 0 0 0 8px rgba(240,180,41,0); } }",
    "#diffCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 8900; pointer-events: none; }"
  ].join("\n");
  document.head.appendChild(style);

  var rail = document.createElement("div");
  rail.id = "diffRail";
  rail.innerHTML = '<div class="diff-head"><b>变更批注</b><button class="diff-icon" id="diffCollapse" type="button" aria-label="收起批注栏">›</button></div><div class="diff-demo" id="diffDemo"></div><div class="diff-mods" id="diffMods"></div><div id="diffCards"></div>';
  var fab = document.createElement("button");
  fab.id = "diffFab";
  fab.type = "button";
  fab.textContent = "变更批注";
  var canvas = document.createElement("canvas");
  canvas.id = "diffCanvas";
  document.body.appendChild(rail);
  document.body.appendChild(fab);
  document.body.appendChild(canvas);
  var ctx = canvas.getContext("2d");

  function esc(text) {
    return String(text == null ? "" : text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function pageEl() {
    return document.getElementById("diffPage") || document.querySelector(".page") || document.body;
  }
  function prdHref(item) {
    var base = String(meta.prdUrl || "").replace(/#.*$/, "");
    var blockId = item.prd && item.prd.blockId;
    if (!base) return "";
    return base + (blockId ? "#" + blockId : "");
  }

  var modules = [];
  CHANGES.forEach(function (item) {
    var key = item.page + "::" + item.module;
    if (modules.indexOf(key) < 0) modules.push(key);
  });
  var stored = null;
  try { stored = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) { stored = null; }
  var checked = {};
  modules.forEach(function (key) {
    if (!stored) checked[key] = true;
    else checked[key] = stored[key] === undefined ? true : !!stored[key];
  });
  var railOpen = localStorage.getItem(LS_RAIL) !== "0";
  var pinId = null;
  var hoverId = null;
  var demo = (meta.demoControls && meta.demoControls[0] && meta.demoControls[0].id) || "";

  function scrollTo(el) {
    if (!el) return;
    try { el.scrollIntoView({ behavior: "instant", block: "center", inline: "nearest" }); }
    catch (e) { el.scrollIntoView(); }
    var railW = rail.classList.contains("collapsed") ? 0 : 360;
    var rect = el.getBoundingClientRect();
    var limit = window.innerWidth - railW - 28;
    if (rect.left > limit - 24) {
      var scroller = el.closest(".table-wrap") || pageEl();
      scroller.scrollLeft += rect.right - limit;
    }
  }
  function pulse(el) {
    if (!el) return;
    el.classList.remove("diff-pulse");
    void el.offsetWidth;
    el.classList.add("diff-pulse");
  }
  function visibleChanges() {
    return CHANGES.filter(function (item) { return checked[item.page + "::" + item.module]; });
  }
  function saveChecked() {
    localStorage.setItem(LS_KEY, JSON.stringify(checked));
  }
  function focusChange(change) {
    if (window.DIFF_HOOKS && typeof DIFF_HOOKS.locate === "function") DIFF_HOOKS.locate(change);
    setTimeout(function () {
      var el = document.querySelector(change.target);
      scrollTo(el);
      pulse(el);
      measure();
    }, 30);
  }

  function paintDemo() {
    var box = document.getElementById("diffDemo");
    var controls = meta.demoControls || [];
    box.innerHTML = "";
    if (!controls.length) {
      box.style.display = "none";
      return;
    }
    box.style.display = "";
    controls.forEach(function (pair) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = pair.label;
      btn.className = demo === pair.id ? "on" : "";
      btn.onclick = function () {
        demo = pair.id;
        if (window.DIFF_HOOKS && typeof DIFF_HOOKS.setDemoState === "function") DIFF_HOOKS.setDemoState(pair.id);
        paintDemo();
        measure();
      };
      box.appendChild(btn);
    });
  }
  function paintMods() {
    var box = document.getElementById("diffMods");
    box.innerHTML = "";
    var pages = [];
    modules.forEach(function (key) {
      var page = key.split("::")[0];
      if (pages.indexOf(page) < 0) pages.push(page);
    });
    pages.forEach(function (page) {
      var group = document.createElement("div");
      group.className = "diff-group";
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = page;
      group.appendChild(name);
      modules.forEach(function (key) {
        if (key.split("::")[0] !== page) return;
        var label = document.createElement("label");
        label.className = "diff-check";
        var input = document.createElement("input");
        input.type = "checkbox";
        input.checked = !!checked[key];
        input.onchange = function () {
          checked[key] = input.checked;
          saveChecked();
          if (input.checked) {
            var first = CHANGES.filter(function (item) { return item.page + "::" + item.module === key; })[0];
            pinId = first.id;
            paintCards();
            focusChange(first);
          } else {
            if (pinId && !visibleChanges().some(function (item) { return item.id === pinId; })) pinId = null;
            paintCards();
            measure();
          }
        };
        var text = document.createElement("span");
        text.textContent = key.split("::")[1];
        label.appendChild(input);
        label.appendChild(text);
        group.appendChild(label);
      });
      box.appendChild(group);
    });
  }
  function paintCards() {
    var box = document.getElementById("diffCards");
    box.innerHTML = "";
    visibleChanges().forEach(function (item) {
      var index = CHANGES.indexOf(item) + 1;
      var no = (index < 10 ? "0" : "") + index;
      var card = document.createElement("article");
      card.className = "diff-card" + (pinId === item.id ? " pin" : "");
      card.setAttribute("data-id", item.id);
      var examples = (item.examples || []).map(function (line) { return "<li>" + esc(line) + "</li>"; }).join("");
      var href = prdHref(item);
      var section = item.prd && item.prd.section;
      card.innerHTML =
        '<span class="diff-no">' + no + '</span>' +
        '<h4>' + esc(item.title) + '</h4>' +
        '<div class="diff-meta">' + esc(TYPE[item.type] || item.type) + " · " + esc(LEVEL[item.level] || item.level) + '</div>' +
        '<p>' + esc(item.desc) + '</p>' +
        '<div class="diff-ba"><span>前</span><div>' + esc(item.before) + '</div></div>' +
        '<div class="diff-ba"><span>后</span><div>' + esc(item.after) + '</div></div>' +
        (examples ? '<ul class="diff-ex">' + examples + '</ul>' : '') +
        (href && section ? '<a class="diff-link" target="_blank" rel="noopener" href="' + esc(href) + '">PRD · ' + esc(section) + '</a>' : '');
      card.onmouseenter = function () { hoverId = item.id; draw(); };
      card.onmouseleave = function () { if (hoverId === item.id) hoverId = null; draw(); };
      card.onclick = function (e) {
        if (e.target.closest("a")) return;
        pinId = item.id;
        paintCards();
        var active = document.querySelector('.diff-card[data-id="' + item.id + '"]');
        if (active) active.scrollIntoView({ block: "nearest" });
        focusChange(item);
      };
      box.appendChild(card);
    });
  }
  function syncRail() {
    rail.classList.toggle("collapsed", !railOpen);
    fab.classList.toggle("show", !railOpen);
    localStorage.setItem(LS_RAIL, railOpen ? "1" : "0");
    var page = pageEl();
    var spacer = document.getElementById("diffSpacer");
    if (railOpen) {
      if (!spacer) {
        spacer = document.createElement("div");
        spacer.id = "diffSpacer";
        spacer.style.cssText = "width:calc(100% + 360px);height:1px;pointer-events:none;";
        page.appendChild(spacer);
      }
    } else if (spacer) {
      spacer.remove();
    }
  }
  function shown(el) {
    return !!(el && el.getClientRects().length);
  }
  function measure() {
    document.querySelectorAll(".diff-anchor").forEach(function (node) { node.remove(); });
    var page = pageEl();
    var pageRect = page.getBoundingClientRect();
    visibleChanges().forEach(function (item) {
      var el = document.querySelector(item.target);
      if (!shown(el)) return;
      var rect = el.getBoundingClientRect();
      var anchor = document.createElement("button");
      anchor.type = "button";
      anchor.className = "diff-anchor" + (pinId === item.id ? " pin" : "");
      anchor.setAttribute("data-id", item.id);
      var index = CHANGES.indexOf(item) + 1;
      anchor.textContent = (index < 10 ? "0" : "") + index;
      anchor.style.left = (rect.left - pageRect.left + page.scrollLeft) + "px";
      anchor.style.top = (rect.top - pageRect.top + page.scrollTop) + "px";
      anchor.onclick = function (e) {
        e.stopPropagation();
        pinId = item.id;
        hoverId = null;
        if (!railOpen) {
          railOpen = true;
          syncRail();
        }
        paintCards();
        var card = document.querySelector('.diff-card[data-id="' + item.id + '"]');
        if (card) card.scrollIntoView({ block: "nearest" });
        pulse(el);
        measure();
      };
      anchor.onmouseenter = function () { hoverId = item.id; draw(); };
      anchor.onmouseleave = function () { if (hoverId === item.id) hoverId = null; draw(); };
      page.appendChild(anchor);
      anchor.style.visibility = "hidden";
      var top = document.elementFromPoint(rect.left + 11, rect.top + 11);
      anchor.style.visibility = "";
      if (top && top.closest && top.closest("#diffRail")) anchor.style.display = "none";
    });
    draw();
  }
  window.__diffRemeasure = function () { measure(); };
  function resizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if (!railOpen) return;
    var id = pinId || hoverId;
    if (!id) return;
    var card = document.querySelector('.diff-card[data-id="' + id + '"]');
    var anchor = document.querySelector('.diff-anchor[data-id="' + id + '"]');
    if (!card || !anchor || anchor.style.display === "none") return;
    var a = card.getBoundingClientRect();
    var b = anchor.getBoundingClientRect();
    var page = pageEl().getBoundingClientRect();
    if (b.bottom < page.top || b.top > page.bottom || b.right < page.left || b.left > page.right) return;
    var x1 = a.left;
    var y1 = Math.min(Math.max(a.top + a.height / 2, 8), window.innerHeight - 8);
    var x2 = b.left + b.width / 2;
    var y2 = b.top + b.height / 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo((x1 + x2) / 2, y1, (x1 + x2) / 2, y2, x2, y2);
    ctx.strokeStyle = "#f0b429";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  document.getElementById("diffCollapse").onclick = function () { railOpen = false; syncRail(); measure(); };
  fab.onclick = function () { railOpen = true; syncRail(); measure(); };
  rail.addEventListener("click", function (e) { e.stopPropagation(); });
  pageEl().addEventListener("scroll", measure);
  window.addEventListener("resize", function () { resizeCanvas(); measure(); });
  document.querySelectorAll(".table-wrap").forEach(function (node) { node.addEventListener("scroll", measure); });
  paintDemo();
  paintMods();
  paintCards();
  syncRail();
  resizeCanvas();
  measure();
})();
</script>
</body>
</html>
