<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电销CRM - 绩效 · 时间粒度</title>
<style>
  :root {
    --pri: #409eff;
    --pri-l: #ecf5ff;
    --suc: #67c23a;
    --dan: #f56c6c;
    --warn: #e6a23c;
    --t1: #303133;
    --t2: #606266;
    --t3: #909399;
    --bd: #dcdfe6;
    --line: #ebeef5;
    --bg: #f0f2f5;
    --sb: #1f2d3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    color: var(--t1); background: var(--bg); font-size: 13px;
  }
  button, input, select { font-family: inherit; }
  .app { display: flex; height: 100vh; overflow: hidden; }
  .sidebar {
    width: 168px; background: var(--sb); color: rgba(255,255,255,.72);
    flex-shrink: 0; display: flex; flex-direction: column;
  }
  .logo {
    height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 14px;
    background: #18222c; color: #fff; font-weight: 600; font-size: 15px;
  }
  .logo i {
    width: 22px; height: 22px; border-radius: 4px; background: var(--pri);
    display: inline-flex; align-items: center; justify-content: center;
    font-style: normal; font-size: 12px; font-weight: 700;
  }
  .mi, .si { display: flex; align-items: center; height: 36px; padding: 0 14px; font-size: 13px; }
  .si { height: 34px; padding-left: 36px; font-size: 12px; color: rgba(255,255,255,.62); background: #18222c; }
  .si.act { background: var(--pri); color: #fff; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 46px; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; padding: 0 12px; gap: 10px; flex-shrink: 0;
  }
  .tabs { display: flex; align-items: flex-end; height: 100%; }
  .tab {
    height: 32px; padding: 0 12px; border-radius: 4px 4px 0 0; color: var(--t2); font-size: 12px;
    display: flex; align-items: center; margin-bottom: -1px;
  }
  .tab.act { color: var(--pri); background: var(--pri-l); border: 1px solid #d9ecff; border-bottom: none; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--t2); font-size: 12px; }
  .avatar {
    width: 24px; height: 24px; border-radius: 50%; background: var(--pri); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
  }
  #diffPage { flex: 1; overflow: auto; padding: 12px; position: relative; }
  .card { background: #fff; border-radius: 4px; padding: 0 16px 16px; min-height: 100%; }
  .page-tabs { display: flex; border-bottom: 1px solid var(--line); margin: 0 -16px 12px; padding: 0 16px; }
  .pt { padding: 12px 16px 10px; cursor: pointer; color: var(--t2); position: relative; font-size: 14px; }
  .pt.act { color: var(--pri); font-weight: 500; }
  .pt.act::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: -1px; height: 2px; background: var(--pri); }
  .filters { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; }
  .sel, .datebox, .period-btn, .grain-btn {
    height: 32px; border: 1px solid var(--bd); border-radius: 4px; background: #fff;
    color: var(--t1); padding: 0 10px; font-size: 13px; outline: none;
  }
  .sel { min-width: 132px; color: var(--t3); }
  .sel.has { color: var(--t1); }
  .btn {
    height: 32px; padding: 0 14px; border-radius: 4px; border: 1px solid var(--bd);
    background: #fff; color: var(--t2); cursor: pointer; font-size: 13px;
  }
  .btn:hover { color: var(--pri); border-color: #c6e2ff; background: var(--pri-l); }
  .btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }
  .btn.pri:hover { background: #66b1ff; border-color: #66b1ff; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  .grain { position: relative; }
  .grain-btn {
    width: 88px; display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; color: var(--t1);
  }
  .grain.open .grain-btn, .period.open .period-btn { border-color: var(--pri); color: var(--pri); }
  .grain-menu, .panel {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
    background: #fff; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
    border: 1px solid #e4e7ed;
  }
  .grain.open .grain-menu, .period.open .panel { display: block; }
  .grain-menu { min-width: 88px; padding: 6px 0; }
  .grain-menu::before, .panel::before {
    content: ""; position: absolute; top: -6px; left: 22px;
    border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 6px solid #fff;
  }
  .grain-item { padding: 8px 16px; cursor: pointer; color: var(--t1); line-height: 1.2; }
  .grain-item:hover { background: #f5f7fa; }
  .grain-item.on { color: var(--pri); font-weight: 600; }
  .period { position: relative; }
  .period-btn { min-width: 220px; text-align: left; cursor: pointer; }
  .panel { min-width: 280px; padding: 12px; }
  .panel-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; color: var(--t1); }
  .nav {
    width: 24px; height: 24px; border: none; background: transparent; cursor: pointer; color: var(--t2); border-radius: 4px;
  }
  .nav:hover { background: #f5f7fa; color: var(--pri); }
  .nav:disabled { color: #c0c4cc; cursor: not-allowed; }
  .weeks { display: flex; flex-direction: column; }
  .opt {
    padding: 8px 10px; border-radius: 4px; cursor: pointer; color: var(--t1);
  }
  .opt:hover { background: #f5f7fa; }
  .opt.on { color: var(--pri); background: var(--pri-l); }
  .opt.off { color: #c0c4cc; cursor: not-allowed; background: transparent; }
  .months, .years { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .custom { display: flex; flex-direction: column; gap: 4px; }
  .custom.hide, .period-btn.hide, .extra.hide { display: none; }
  .range-line { display: flex; align-items: center; gap: 8px; }
  .datebox { width: 196px; color: var(--t1); }
  .to { color: var(--t3); font-size: 12px; }
  .err { color: var(--dan); font-size: 12px; min-height: 0; line-height: 1.5; }
  .hint {
    margin: 10px 0 8px; color: var(--t2); font-size: 12px; line-height: 1.6;
    background: #f4f8ff; border: 1px solid #d9ecff; border-radius: 4px; padding: 6px 10px;
  }
  .legend { display: flex; gap: 14px; color: var(--t3); font-size: 12px; margin-bottom: 8px; }
  .down { color: var(--suc); font-style: normal; }
  .up { color: var(--dan); font-style: normal; }
  .table-wrap { overflow: auto; border: 1px solid var(--line); }
  table { border-collapse: collapse; min-width: 980px; width: 100%; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; white-space: nowrap; font-size: 12px; font-weight: 400; }
  th { background: #fafafa; color: var(--t2); position: sticky; top: 0; }
  tbody tr:hover td { background: #f5f7fa; }
  td.num { font-variant-numeric: tabular-nums; }
  .empty-box { padding: 48px 16px; text-align: center; color: var(--warn); background: #fdf6ec; border: 1px solid #faecd8; }
  .toast {
    position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
    background: #fff; border: 1px solid #e1f3d8; color: var(--suc);
    box-shadow: 0 4px 12px rgba(0,0,0,.08); padding: 10px 16px; border-radius: 4px;
    z-index: 40; display: none; font-size: 13px;
  }
  .toast.show { display: block; }
  .toast.warn { color: var(--warn); border-color: #faecd8; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><i>销</i>电销CRM</div>
    <div class="mi">数据统计</div>
    <div class="si">营收</div>
    <div class="si act">绩效</div>
    <div class="si">当配转化统计</div>
  </aside>
  <section class="main">
    <header class="topbar">
      <div class="tabs"><div class="tab act">绩效</div></div>
      <div class="top-right"><span class="avatar">李</span> liyingping</div>
    </header>
    <div id="diffPage">
      <div class="card">
        <div class="page-tabs">
          <div class="pt act" data-dim="clue">线索维度</div>
          <div class="pt" data-dim="family">家庭维度</div>
        </div>
        <div class="filters">
          <select class="sel" id="filterGroup">
            <option value="">请选择小组</option>
            <option>狂天卡小队</option>
            <option>梦之队-张宇昊</option>
            <option>地推春暖队</option>
          </select>
          <select class="sel"><option>请选择坐席</option></select>
          <select class="sel extra" id="filterType" data-for="clue"><option>请选择类型</option></select>
          <select class="sel extra" id="filterStage" data-for="clue"><option>请选择学段</option></select>
          <select class="sel extra hide" id="filterFamily" data-for="family"><option>请选择家庭类型</option></select>
          <div class="grain" id="grainSelect">
            <button class="grain-btn" id="grainBtn" type="button">月 <span id="grainCaret">⌄</span></button>
            <div class="grain-menu" id="grainMenu"></div>
          </div>
          <div class="period" id="periodPicker">
            <button class="period-btn" id="periodBtn" type="button"></button>
            <div class="panel" id="periodPanel"></div>
          </div>
          <div class="custom hide" id="customRange">
            <div class="range-line">
              <input class="datebox" id="startInput" type="datetime-local" step="1">
              <span class="to">至</span>
              <input class="datebox" id="endInput" type="datetime-local" step="1">
            </div>
            <div class="err" id="rangeErr"></div>
          </div>
          <button class="btn pri" id="btnSearch" type="button">搜索</button>
          <button class="btn" id="btnReset" type="button">重置</button>
          <div class="actions"><button class="btn pri" id="btnExport" type="button">导出</button></div>
        </div>
        <div class="hint" id="dataHint"></div>
        <div class="legend">
          <span><i class="down">↓</i> 代表低于统计的平均值</span>
          <span><i class="up">↑</i> 代表高于统计的平均值</span>
        </div>
        <div id="resultState">
          <div class="table-wrap" id="tableWrap">
            <table>
              <thead>
                <tr>
                  <th>拨打线索数</th><th>拨打次数</th><th>有效通话量</th><th>有效接通率</th>
                  <th>订单总额/元</th><th>订单数</th><th>坐席名称</th><th>所属小组</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div class="empty-box" id="emptyBox" style="display:none"></div>
        </div>
      </div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
const TODAY = new Date(2026, 9, 21, 15, 30, 0);
const GRAINS = [
  { id: "week", label: "周" },
  { id: "month", label: "月" },
  { id: "year", label: "年" },
  { id: "custom", label: "自定义" }
];
const BASE = [
  ["刘弥月", "狂天卡小队", 740, 1731, 180, 24, 10390, 7],
  ["张何", "梦之队-张宇昊", 597, 1009, 142, 24, 9789, 7],
  ["黄丽", "地推春暖队", 361, 885, 142, 39, 32346, 26],
  ["魏诗语", "地推春暖队", 399, 867, 119, 29, 24626, 23],
  ["汪林文", "校人队-春波", 1495, 2328, 270, 18, 31382, 27],
  ["陈露", "狂天卡小队", 1159, 1992, 177, 15, 7341, 9],
  ["马艳", "梦之队-张宇昊", 727, 1498, 241, 33, 11684, 8],
  ["曹新林", "梦之队-张宇昊", 552, 1939, 181, 33, 28472, 15]
];

function pad(n) { return String(n).padStart(2, "0"); }
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0); }
function endOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59); }
function addMonths(date, n) {
  const day = date.getDate();
  const x = new Date(date.getFullYear(), date.getMonth(), 1);
  x.setMonth(x.getMonth() + n);
  const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate();
  x.setDate(Math.min(day, last));
  x.setHours(date.getHours(), date.getMinutes(), date.getSeconds(), 0);
  return x;
}
function weekStart(d) {
  const x = startOfDay(d);
  const day = x.getDay();
  x.setDate(x.getDate() + (day === 0 ? -6 : 1 - day));
  return x;
}
function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return { year: d.getUTCFullYear(), week: Math.ceil((((d - yearStart) / 86400000) + 1) / 7) };
}
function fmtDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function fmtStamp(d) { return fmtDate(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); }
function fmtInput(d) { return fmtDate(d) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); }
function parseInput(v) { if (!v) return null; const d = new Date(v); return isNaN(d.getTime()) ? null : d; }
function md(d) { return (d.getMonth() + 1) + "月" + d.getDate() + "日"; }
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

function freshState() {
  return {
    grain: "month",
    weekAnchor: new Date(TODAY),
    monthY: 2026,
    monthM: 10,
    year: 2026,
    customStart: "2026-10-01T00:00:00",
    customEnd: "2026-10-21T23:59:59",
    panel: "",
    browseY: 2026,
    browseM: 10,
    error: "",
    view: "table",
    hint: "",
    factor: 1,
    forceUpdating: false
  };
}
const tabs = { clue: freshState(), family: freshState() };
let dim = "clue";
function S() { return tabs[dim]; }

function currentPeriod(s) {
  if (s.grain === "week") {
    const start = weekStart(s.weekAnchor);
    const end = endOfDay(new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6));
    const info = isoWeek(start);
    return { start, end, label: info.year + "年第" + info.week + "周（" + md(start) + "-" + md(end) + "）" };
  }
  if (s.grain === "month") {
    const start = new Date(s.monthY, s.monthM - 1, 1, 0, 0, 0);
    const end = endOfDay(new Date(s.monthY, s.monthM, 0));
    return { start, end, label: s.monthY + "年" + s.monthM + "月" };
  }
  if (s.grain === "year") {
    return {
      start: new Date(s.year, 0, 1, 0, 0, 0),
      end: endOfDay(new Date(s.year, 11, 31)),
      label: s.year + "年"
    };
  }
  return null;
}
function periodInFuture(start) { return startOfDay(start).getTime() > startOfDay(TODAY).getTime(); }
function exceeds3(start, end) {
  const limit = endOfDay(addMonths(startOfDay(start), 3));
  return end.getTime() > limit.getTime();
}
function customFromPeriod(period) {
  const todayEnd = endOfDay(TODAY);
  const includesToday = period.start.getTime() <= todayEnd.getTime() && period.end.getTime() >= startOfDay(TODAY).getTime();
  let end = includesToday ? todayEnd : period.end;
  if (end.getTime() - period.start.getTime() > 0 && !exceeds3(period.start, end) && period.end.getTime() - period.start.getTime() < 1000 * 60 * 60 * 24 * 40) {
    return { start: period.start, end: end };
  }
  const cap = period.end.getTime() < todayEnd.getTime() ? period.end : TODAY;
  let start = startOfDay(addMonths(startOfDay(cap), -3));
  end = endOfDay(cap);
  if (exceeds3(start, end)) start = startOfDay(new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1));
  return { start, end };
}
function hintFor(s) {
  if (s.grain === "custom") return "按所选时间实时查询";
  const period = currentPeriod(s);
  const today = startOfDay(TODAY);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
  if (period.end.getTime() < today.getTime()) return "该周期不含今天，整段为数仓数据";
  if (period.start.getTime() >= today.getTime()) return "该周期只有今天，展示当天实时数据";
  const startText = s.grain === "year" ? "1月1日" : md(period.start);
  return startText + "至" + md(yesterday) + "为数仓数据，" + md(today) + "为实时数据，相加后展示";
}
function factorFor(s) {
  if (s.grain === "week") return 0.25;
  if (s.grain === "year") return 8;
  if (s.grain === "month" && s.monthM !== 10) return 0.92;
  if (s.grain === "custom") {
    const start = parseInput(s.customStart), end = parseInput(s.customEnd);
    if (!start || !end) return 1;
    return Math.max(0.15, Math.min(3, (end - start) / (1000 * 60 * 60 * 24 * 30)));
  }
  return 1;
}
function needsWarehouse(s) {
  if (s.grain === "custom") return false;
  const period = currentPeriod(s);
  return period.start.getTime() < startOfDay(TODAY).getTime();
}
function validateCustom(s) {
  const start = parseInput(s.customStart);
  const end = parseInput(s.customEnd);
  if (!start || !end) return "请选择时间范围";
  if (start.getTime() > end.getTime()) return "开始时间不能晚于结束时间";
  if (exceeds3(start, end)) return "时间范围不能超过3个月";
  return "";
}

function closePanels() { S().panel = ""; }
function setGrain(next) {
  const s = S();
  const prevPeriod = s.grain === "custom" ? null : currentPeriod(s);
  if (next === "custom" && prevPeriod) {
    const filled = customFromPeriod(prevPeriod);
    s.customStart = fmtInput(filled.start);
    s.customEnd = fmtInput(filled.end);
  }
  if (next === "week") s.weekAnchor = new Date(TODAY);
  if (next === "month") { s.monthY = 2026; s.monthM = 10; }
  if (next === "year") s.year = 2026;
  s.grain = next;
  s.error = "";
  s.panel = "";
  s.forceUpdating = false;
  render();
}
function checkAction() {
  const s = S();
  if (s.grain === "custom") {
    s.error = validateCustom(s);
    return !s.error;
  }
  s.error = "";
  if (s.forceUpdating && needsWarehouse(s)) return "updating";
  return true;
}
function search() {
  const s = S();
  const result = checkAction();
  if (result === "updating") {
    s.view = "updating";
    s.hint = hintFor(s);
    s.panel = "";
    render();
    return;
  }
  if (!result) { s.panel = ""; render(); return; }
  s.view = "table";
  s.hint = hintFor(s);
  s.factor = factorFor(s);
  s.panel = "";
  render();
}
function resetState() {
  const next = freshState();
  next.hint = hintFor(next);
  next.factor = 1;
  tabs[dim] = next;
  render();
}

function toast(msg, type) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (type ? " " + type : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = "toast"; }, 2200);
}
function renderGrain() {
  const s = S();
  const item = GRAINS.filter(g => g.id === s.grain)[0];
  document.getElementById("grainBtn").firstChild.textContent = item.label + " ";
  document.getElementById("grainCaret").textContent = s.panel === "grain" ? "⌃" : "⌄";
  document.getElementById("grainSelect").classList.toggle("open", s.panel === "grain");
  document.getElementById("grainMenu").innerHTML = GRAINS.map(g =>
    '<div class="grain-item' + (g.id === s.grain ? " on" : "") + '" data-grain="' + g.id + '">' + g.label + "</div>"
  ).join("");
}
function renderPeriod() {
  const s = S();
  const btn = document.getElementById("periodBtn");
  const custom = document.getElementById("customRange");
  const picker = document.getElementById("periodPicker");
  picker.classList.toggle("open", s.panel === "period" && s.grain !== "custom");
  if (s.grain === "custom") {
    btn.classList.add("hide");
    custom.classList.remove("hide");
    document.getElementById("startInput").value = s.customStart;
    document.getElementById("endInput").value = s.customEnd;
    document.getElementById("rangeErr").textContent = s.error;
  } else {
    btn.classList.remove("hide");
    custom.classList.add("hide");
    btn.textContent = currentPeriod(s).label;
    document.getElementById("periodPanel").innerHTML = panelHtml(s);
  }
}
function panelHtml(s) {
  if (s.grain === "month") {
    const cells = [];
    for (let m = 1; m <= 12; m++) {
      const future = s.browseY > TODAY.getFullYear() || (s.browseY === TODAY.getFullYear() && m > TODAY.getMonth() + 1);
      const on = s.monthY === s.browseY && s.monthM === m;
      cells.push('<div class="opt' + (future ? " off" : on ? " on" : "") + '" data-month="' + m + '" data-off="' + (future ? 1 : 0) + '">' + m + "月</div>");
    }
    return head(s.browseY + "年", s.browseY >= TODAY.getFullYear()) + '<div class="months">' + cells.join("") + "</div>";
  }
  if (s.grain === "year") {

}

    var limit = window.innerWidth - railW - 28;
    if (rect.left > limit - 24) {
      var scroller = el.closest(".table-wrap") || pageEl();
      scroller.scrollLeft += rect.right - limit;
    }
  }
  function pulse(el) {
    if (!el) return;
    el.classList.remove("diff-pulse");
    void el.offsetWidth;
    el.classList.add("diff-pulse");
  }
  function visibleChanges() {
    return CHANGES.filter(function (item) { return checked[item.page + "::" + item.module]; });
  }
  function saveChecked() {
    localStorage.setItem(LS_KEY, JSON.stringify(checked));
  }
  function focusChange(change) {
    if (window.DIFF_HOOKS && typeof DIFF_HOOKS.locate === "function") DIFF_HOOKS.locate(change);
    setTimeout(function () {
      var el = document.querySelector(change.target);
      scrollTo(el);
      pulse(el);
      measure();
    }, 30);
  }

  function paintDemo() {
    var box = document.getElementById("diffDemo");
    var controls = meta.demoControls || [];
    box.innerHTML = "";
    if (!controls.length) {
      box.style.display = "none";
      return;
    }
    box.style.display = "";
    controls.forEach(function (pair) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = pair.label;
      btn.className = demo === pair.id ? "on" : "";
      btn.onclick = function () {
        demo = pair.id;
        if (window.DIFF_HOOKS && typeof DIFF_HOOKS.setDemoState === "function") DIFF_HOOKS.setDemoState(pair.id);
        paintDemo();
        measure();
      };
      box.appendChild(btn);
    });
  }
  function paintMods() {
    var box = document.getElementById("diffMods");
    box.innerHTML = "";
    var pages = [];
    modules.forEach(function (key) {
      var page = key.split("::")[0];
      if (pages.indexOf(page) < 0) pages.push(page);
    });
    pages.forEach(function (page) {
      var group = document.createElement("div");
      group.className = "diff-group";
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = page;
      group.appendChild(name);
      modules.forEach(function (key) {
        if (key.split("::")[0] !== page) return;
        var label = document.createElement("label");
        label.className = "diff-check";
        var input = document.createElement("input");
        input.type = "checkbox";
        input.checked = !!checked[key];
        input.onchange = function () {
          checked[key] = input.checked;
          saveChecked();
          if (input.checked) {
            var first = CHANGES.filter(function (item) { return item.page + "::" + item.module === key; })[0];
            pinId = first.id;
            paintCards();
            focusChange(first);
          } else {
            if (pinId && !visibleChanges().some(function (item) { return item.id === pinId; })) pinId = null;
            paintCards();
            measure();
          }
        };
        var text = document.createElement("span");
        text.textContent = key.split("::")[1];
        label.appendChild(input);
        label.appendChild(text);
        group.appendChild(label);
      });
      box.appendChild(group);
    });
  }
  function paintCards() {
    var box = document.getElementById("diffCards");
    box.innerHTML = "";
    visibleChanges().forEach(function (item) {
      var index = CHANGES.indexOf(item) + 1;
      var no = (index < 10 ? "0" : "") + index;
      var card = document.createElement("article");
      card.className = "diff-card" + (pinId === item.id ? " pin" : "");
      card.setAttribute("data-id", item.id);
      var examples = (item.examples || []).map(function (line) { return "<li>" + esc(line) + "</li>"; }).join("");
      var href = prdHref(item);
      var section = item.prd && item.prd.section;
      card.innerHTML =
        '<span class="diff-no">' + no + '</span>' +
        '<h4>' + esc(item.title) + '</h4>' +
        '<div class="diff-meta">' + esc(TYPE[item.type] || item.type) + " · " + esc(LEVEL[item.level] || item.level) + '</div>' +
        '<p>' + esc(item.desc) + '</p>' +
        '<div class="diff-ba"><span>前</span><div>' + esc(item.before) + '</div></div>' +
        '<div class="diff-ba"><span>后</span><div>' + esc(item.after) + '</div></div>' +
        (examples ? '<ul class="diff-ex">' + examples + '</ul>' : '') +
        (href && section ? '<a class="diff-link" target="_blank" rel="noopener" href="' + esc(href) + '">PRD · ' + esc(section) + '</a>' : '');
      card.onmouseenter = function () { hoverId = item.id; draw(); };
      card.onmouseleave = function () { if (hoverId === item.id) hoverId = null; draw(); };
      card.onclick = function (e) {
        if (e.target.closest("a")) return;
        pinId = item.id;
        paintCards();
        var active = document.querySelector('.diff-card[data-id="' + item.id + '"]');
        if (active) active.scrollIntoView({ block: "nearest" });
        focusChange(item);
      };
      box.appendChild(card);
    });
  }
  function syncRail() {
    rail.classList.toggle("collapsed", !railOpen);
    fab.classList.toggle("show", !railOpen);
    localStorage.setItem(LS_RAIL, railOpen ? "1" : "0");
    var page = pageEl();
    var spacer = document.getElementById("diffSpacer");
    if (railOpen) {
      if (!spacer) {
        spacer = document.createElement("div");
        spacer.id = "diffSpacer";
        spacer.style.cssText = "width:calc(100% + 360px);height:1px;pointer-events:none;";
        page.appendChild(spacer);
      }
    } else if (spacer) {
      spacer.remove();
    }
  }
  function shown(el) {
    return !!(el && el.getClientRects().length);
  }
  function measure() {
    document.querySelectorAll(".diff-anchor").forEach(function (node) { node.remove(); });
    var page = pageEl();
    var pageRect = page.getBoundingClientRect();
    visibleChanges().forEach(function (item) {
      var el = document.querySelector(item.target);
      if (!shown(el)) return;
      var rect = el.getBoundingClientRect();
      var anchor = document.createElement("button");
      anchor.type = "button";
      anchor.className = "diff-anchor" + (pinId === item.id ? " pin" : "");
      anchor.setAttribute("data-id", item.id);
      var index = CHANGES.indexOf(item) + 1;
      anchor.textContent = (index < 10 ? "0" : "") + index;
      anchor.style.left = (rect.left - pageRect.left + page.scrollLeft) + "px";
      anchor.style.top = (rect.top - pageRect.top + page.scrollTop) + "px";
      anchor.onclick = function (e) {
        e.stopPropagation();
        pinId = item.id;
        hoverId = null;
        if (!railOpen) {
          railOpen = true;
          syncRail();
        }
        paintCards();
        var card = document.querySelector('.diff-card[data-id="' + item.id + '"]');
        if (card) card.scrollIntoView({ block: "nearest" });
        pulse(el);
        measure();
      };
      anchor.onmouseenter = function () { hoverId = item.id; draw(); };
      anchor.onmouseleave = function () { if (hoverId === item.id) hoverId = null; draw(); };
      page.appendChild(anchor);
      anchor.style.visibility = "hidden";
      var top = document.elementFromPoint(rect.left + 11, rect.top + 11);
      anchor.style.visibility = "";
      if (top && top.closest && top.closest("#diffRail")) anchor.style.display = "none";
    });
    draw();
  }
  window.__diffRemeasure = function () { measure(); };
  function resizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if (!railOpen) return;
    var id = pinId || hoverId;
    if (!id) return;
    var card = document.querySelector('.diff-card[data-id="' + id + '"]');
    var anchor = document.querySelector('.diff-anchor[data-id="' + id + '"]');
    if (!card || !anchor || anchor.style.display === "none") return;
    var a = card.getBoundingClientRect();
    var b = anchor.getBoundingClientRect();
    var page = pageEl().getBoundingClientRect();
    if (b.bottom < page.top || b.top > page.bottom || b.right < page.left || b.left > page.right) return;
    var x1 = a.left;
    var y1 = Math.min(Math.max(a.top + a.height / 2, 8), window.innerHeight - 8);
    var x2 = b.left + b.width / 2;
    var y2 = b.top + b.height / 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo((x1 + x2) / 2, y1, (x1 + x2) / 2, y2, x2, y2);
    ctx.strokeStyle = "#f0b429";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  document.getElementById("diffCollapse").onclick = function () { railOpen = false; syncRail(); measure(); };
  fab.onclick = function () { railOpen = true; syncRail(); measure(); };
  rail.addEventListener("click", function (e) { e.stopPropagation(); });
  pageEl().addEventListener("scroll", measure);
  window.addEventListener("resize", function () { resizeCanvas(); measure(); });
  document.querySelectorAll(".table-wrap").forEach(function (node) { node.addEventListener("scroll", measure); });
  paintDemo();
  paintMods();
  paintCards();
  syncRail();
  resizeCanvas();
  measure();
})();

</script>

</body>
</html>
