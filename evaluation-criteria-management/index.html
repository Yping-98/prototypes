<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI质培中台 - 评价标准管理</title>
<style>
  :root {
    --primary: #409eff;
    --primary-light: #ecf5ff;
    --primary-border: #b3d8ff;
    --success: #67c23a;
    --success-light: #f0f9eb;
    --warning: #e6a23c;
    --warning-light: #fdf6ec;
    --danger: #f56c6c;
    --danger-light: #fef0f0;
    --info: #909399;
    --info-light: #f4f4f5;
    --text-primary: #303133;
    --text-regular: #606266;
    --text-secondary: #909399;
    --text-placeholder: #a8abb2;
    --border: #dcdfe6;
    --border-light: #e4e7ed;
    --border-lighter: #ebeef5;
    --bg-page: #f2f3f5;
    --sidebar-bg: #001529;
    --table-header-bg: #f6f7fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; color: var(--text-primary); background: var(--bg-page); overflow: hidden;
  }
  .app-layout { display: flex; height: 100vh; }
  .sidebar { width: 220px; background: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; }
  .logo { height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .logo-icon { width: 30px; height: 30px; border-radius: 6px; background: linear-gradient(135deg,#409eff,#36cfc9); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; }
  .logo-title { font-size: 18px; font-weight: 600; color: #fff; }
  .menu { flex: 1; overflow-y: auto; padding: 6px 8px; }
  .menu-group-title, .menu-item { display:flex; align-items:center; gap:8px; height:44px; padding:0 12px; color: rgba(255,255,255,.65); cursor:pointer; border-radius:4px; user-select:none; font-size:14px; white-space:nowrap; }
  .menu-group-title:hover, .menu-item:hover { background: rgba(255,255,255,.08); color:#fff; }
  .menu-item.active { background: var(--primary); color:#fff; }
  .menu-sub { max-height: 520px; }
  .menu-sub .menu-item { padding-left: 40px; height:40px; }
  .menu-arrow { margin-left:auto; font-size:12px; transform: rotate(180deg); }
  .body-wrap { flex:1; display:flex; flex-direction:column; min-width:0; }
  .navbar { height:56px; background:#fff; border-bottom:1px solid var(--border-light); display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0; }
  .breadcrumb { display:flex; align-items:center; gap:8px; color: var(--text-secondary); font-size:14px; }
  .breadcrumb .cur { color: var(--text-primary); }
  .nav-user { display:flex; align-items:center; gap:8px; }
  .avatar { width:30px; height:30px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .main { flex:1; padding:10px; overflow:auto; }
  .card { background:#fff; border-radius:4px; border:1px solid var(--border-lighter); padding:20px; }
  .form-inline { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:16px; }
  .toolbar-right { margin-left:auto; display:flex; gap:10px; }
  .input, .select { height:32px; border:1px solid var(--border); border-radius:4px; padding:0 11px; font-size:14px; color:var(--text-regular); outline:none; background:#fff; }
  .input:focus, .select:focus, textarea.input:focus { border-color: var(--primary); }
  .input::placeholder, textarea.input::placeholder { color: var(--text-placeholder); }
  textarea.input { height:auto; padding:8px 11px; resize:vertical; line-height:1.6; font-family:inherit; width:100%; }
  .input:disabled, .select:disabled, textarea.input:disabled { background:#f5f7fa; color:var(--text-secondary); cursor:not-allowed; }
  .btn { height:32px; padding:0 15px; border-radius:4px; border:1px solid var(--border); background:#fff; color:var(--text-regular); font-size:14px; cursor:pointer; white-space:nowrap; }
  .btn:hover { color:var(--primary); border-color:var(--primary-border); background:var(--primary-light); }
  .btn-primary { background:var(--primary); border-color:var(--primary); color:#fff; }
  .btn-primary:hover { background:#66b1ff; border-color:#66b1ff; color:#fff; }
  .btn-primary:disabled { background:#a0cfff; border-color:#a0cfff; cursor:not-allowed; }
  .btn-sm { height:26px; padding:0 10px; font-size:12px; }
  .btn-link { border:none; background:none; color:var(--primary); padding:0 4px; height:auto; font-size:14px; cursor:pointer; }
  .btn-link:hover { color:#66b1ff; }
  .btn-link.danger { color: var(--danger); }
  .btn-link.danger:hover { color:#f89898; }
  .btn-link.warn { color: var(--warning); }
  .btn-link.warn:hover { color:#eebe77; }
  .btn-link:disabled { color: var(--text-placeholder); cursor:not-allowed; }
  .table-wrap { overflow-x:auto; }
  table.el-table { width:100%; border-collapse:collapse; font-size:14px; }
  table.el-table th { background:var(--table-header-bg); font-weight:600; color:var(--text-primary); text-align:left; padding:10px 12px; border-bottom:1px solid var(--border-lighter); white-space:nowrap; }
  table.el-table td { padding:10px 12px; border-bottom:1px solid var(--border-lighter); color:var(--text-regular); vertical-align:middle; }
  table.el-table tbody tr:hover { background:#f5f7fa; }
  .tag { display:inline-flex; align-items:center; height:24px; padding:0 9px; border-radius:4px; font-size:12px; border:1px solid; white-space:nowrap; }
  .tag-primary { background:var(--primary-light); border-color:var(--primary-border); color:var(--primary); }
  .tag-success { background:var(--success-light); border-color:#c2e7b0; color:var(--success); }
  .tag-warning { background:var(--warning-light); border-color:#f5dab1; color:var(--warning); }
  .tag-danger  { background:var(--danger-light); border-color:#fbc4c4; color:var(--danger); }
  .tag-info    { background:var(--info-light); border-color:#d3d4d6; color:var(--info); }
  .link-num { color:var(--primary); cursor:pointer; }
  .link-num:hover { text-decoration:underline; }
  .name-link { color:var(--primary); cursor:pointer; }
  .name-link:hover { text-decoration:underline; }
  .tip-bar { background:var(--primary-light); border:1px solid var(--primary-border); border-radius:4px; padding:8px 12px; font-size:13px; color:var(--text-regular); margin-bottom:14px; line-height:1.6; }
  .pagination { display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-top:16px; color:var(--text-regular); font-size:13px; }
  .page-btn { min-width:28px; height:28px; border:none; background:var(--info-light); border-radius:3px; color:var(--text-regular); font-size:13px; }
  .page-btn.active { background:var(--primary); color:#fff; }
  .empty { padding:48px 0; text-align:center; color:var(--text-secondary); }
  .page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .page-head h2 { font-size:16px; font-weight:600; }
  .section-title { font-size:15px; font-weight:600; margin-bottom:16px; border-left:3px solid var(--primary); padding-left:10px; }
  .form-item { display:flex; margin-bottom:16px; }
  .form-label { width:120px; flex-shrink:0; text-align:right; padding-right:12px; line-height:32px; color:var(--text-regular); }
  .form-label.req::before { content:"*"; color:var(--danger); margin-right:4px; }
  .form-content { flex:1; min-width:0; }
  .form-tip { margin-top:6px; font-size:12px; color:var(--text-secondary); line-height:1.6; }
  .count { float:right; font-size:12px; color:var(--text-placeholder); }
  .editor-grid { display:grid; grid-template-columns: minmax(0,1.2fr) minmax(320px,.8fr); gap:12px; align-items:start; }
  .dim-card { border:1px solid var(--border-lighter); border-radius:4px; padding:12px 14px; margin-bottom:10px; background:#fff; }
  .dim-card-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .dim-index { width:22px; height:22px; border-radius:50%; background:var(--primary-light); color:var(--primary); font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-weight:600; }
  .dim-card-head .input { flex:1; }
  .score-input { width:88px; }
  .dim-actions { display:flex; gap:2px; flex-shrink:0; }
  .sum-bar { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:4px; background:#f5f7fa; font-size:13px; }
  .sum-bar.ok { background:var(--success-light); color:#529b2e; }
  .sum-bar.bad { background:var(--danger-light); color:var(--danger); }
  .switch { display:inline-flex; align-items:center; gap:8px; height:32px; cursor:pointer; }
  .switch input { accent-color: var(--primary); }
  .preview-card { position:sticky; top:0; }
  .preview-cap { font-size:12px; color:var(--text-secondary); margin-bottom:10px; }
  .score-hero { text-align:center; padding:8px 0 14px; }
  .score-hero .num { font-size:40px; font-weight:700; color:var(--danger); line-height:1; }
  .score-hero .label { margin-top:6px; color:var(--text-secondary); font-size:13px; }
  .formula { background:#f5f7fa; border-radius:4px; padding:8px 10px; font-size:12px; color:var(--text-regular); line-height:1.6; margin-bottom:12px; }
  .dim-line { margin-bottom:12px; }
  .dim-line-head { display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; }
  .bar { height:8px; background:#ebeef5; border-radius:4px; overflow:hidden; }
  .bar > div { height:100%; background:var(--primary); border-radius:4px; }
  .evidence { margin-top:4px; font-size:12px; color:var(--text-secondary); line-height:1.5; }
  .block-title { font-size:13px; font-weight:600; margin:12px 0 6px; }
  .block-list { padding-left:18px; color:var(--text-regular); font-size:13px; line-height:1.7; }
  .summary { font-size:13px; color:var(--text-regular); line-height:1.7; background:#f5f7fa; border-radius:4px; padding:8px 10px; }
  .dialog-mask { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-start; justify-content:center; z-index:100; overflow:auto; padding:8vh 20px 40px; }
  .dialog-mask.show { display:flex; }
  .dialog { background:#fff; border-radius:6px; width:520px; max-width:96vw; box-shadow:0 12px 32px rgba(0,0,0,.15); }
  .dialog.wide { width:1040px; }
  .dialog-mask.drawer { justify-content:flex-end; padding:0; overflow:hidden; align-items:stretch; }
  .dialog-mask.drawer .dialog { height:100vh; border-radius:0; width:720px; max-width:92vw; display:flex; flex-direction:column; }
  .dialog-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border-lighter); font-weight:600; }
  .dialog-close { border:none; background:none; font-size:20px; cursor:pointer; color:var(--text-secondary); line-height:1; }
  .dialog-body { padding:16px 20px; overflow:auto; }
  .dialog-mask.drawer .dialog-body { flex:1; }
  .dialog-mask.drawer .dialog-footer { border-top:1px solid var(--border-lighter); }
  .dialog-mask.drawer .split { flex:1; height:auto; min-height:0; }
  .report-sec { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; margin:16px 0 10px; }
  .report-sec::before { content:""; width:3px; height:14px; background:var(--primary); border-radius:1px; }
  .point-list { margin:0; padding:0; list-style:none; }
  .point-list li { margin-bottom:12px; font-size:13px; line-height:1.75; color:var(--text-regular); }
  .point-list b { color:var(--text-primary); }
  .q-card { border:1px solid var(--border-lighter); border-radius:6px; padding:10px 12px; margin-bottom:8px; background:#fff; }
  .q-card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .q-title { font-size:13px; font-weight:600; line-height:1.6; }
  .q-meta { margin-top:6px; font-size:12px; line-height:1.7; color:var(--text-secondary); }
  .q-meta b { color:var(--text-regular); font-weight:600; }
  .dialog-footer { padding:12px 20px 16px; text-align:right; display:flex; justify-content:flex-end; gap:10px; }
  .detail-row { display:flex; margin-bottom:12px; font-size:14px; }
  .detail-label { width:108px; flex-shrink:0; color:var(--text-secondary); text-align:right; padding-right:14px; }
  .detail-value { flex:1; line-height:1.7; }
  .split { display:flex; height: 68vh; min-height: 480px; }
  .split-left, .split-right { overflow:auto; }
  .split-left { width:46%; background:#f7f8fa; border-right:1px solid var(--border-lighter); padding:16px; }
  .split-right { width:54%; padding:16px 18px; }
  .audio { background:#fff; border:1px solid var(--border-lighter); border-radius:4px; padding:10px 12px; margin-bottom:14px; }
  .audio-top { display:flex; justify-content:space-between; font-size:12px; color:var(--text-secondary); margin-bottom:6px; }
  .audio-bar { height:6px; background:#e4e7ed; border-radius:3px; }
  .audio-bar > div { width:35%; height:100%; background:var(--primary); border-radius:3px; }
  .bubble { max-width:86%; padding:8px 10px; border-radius:6px; font-size:13px; line-height:1.6; margin-bottom:10px; }
  .bubble.sale { background:#fff; border:1px solid var(--border-lighter); }
  .bubble.ai { background:var(--primary-light); margin-left:auto; }
  .who { font-size:12px; color:var(--text-secondary); margin-bottom:2px; }
  .q-table td, .q-table th { font-size:12px; }
  .exam-tag { margin-left:8px; }
  .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#303133; color:#fff; padding:10px 16px; border-radius:4px; font-size:14px; z-index:200; display:none; max-width:520px; }
  .toast.show { display:block; }
  .bands { margin-top:8px; background:#f5f7fa; border-radius:4px; padding:8px 10px; }
  .band-row { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .band-row:last-child { margin-bottom:0; }
  .band-row .input { height:28px; font-size:12px; }
  .snapshot { margin-top:14px; font-size:12px; color:var(--text-secondary); }
  .checkbox-line { display:flex; gap:18px; align-items:center; min-height:32px; flex-wrap:wrap; }
  .checkbox-line label { display:flex; gap:5px; align-items:center; cursor:pointer; color:var(--text-regular); }
  .page-title-line { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .page-title-line h2 { font-size:17px; font-weight:600; }
  .type-option { flex:1; padding:20px; border:2px solid var(--border-light); border-radius:8px; text-align:center; cursor:pointer; }
  .type-option:hover { border-color:var(--primary); background:#f0f9ff; }
  .type-option.selected { border-color:var(--primary); background:var(--primary-light); }
  .type-icon { width:60px; height:60px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:26px; }
  .type-title { font-size:16px; font-weight:600; margin-bottom:8px; }
  .type-desc { font-size:13px; color:var(--text-regular); line-height:1.5; }
  .detail-block { background:#f5f7fa; border-radius:6px; padding:12px 14px; white-space:pre-wrap; line-height:1.8; color:var(--text-regular); font-size:13.5px; }
  .drag-handle { cursor:move; color:var(--primary); margin-right:6px; }
  .qa-panel { margin-top:10px; padding:12px; background:#f5f7fa; border:1px solid var(--border-lighter); border-radius:8px; }
  .test-pane { width:340px; flex-shrink:0; border-left:1px solid var(--border-lighter); padding-left:20px; display:flex; flex-direction:column; }
  .test-box { flex:1; min-height:300px; background:#f5f7fa; border-radius:6px; padding:12px; overflow-y:auto; font-size:13px; line-height:1.7; }
  .picked-tags { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
  .member-toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .member-title { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .member-title h2 { font-size:16px; font-weight:600; }
  .progress-cell { display:flex; align-items:center; gap:8px; color:var(--text-regular); }
  .progress-track { width:72px; height:6px; background:#ebeef5; border-radius:100px; overflow:hidden; }
  .progress-track i { display:block; height:100%; background:var(--primary); border-radius:100px; }
  .scene-nest { background:#fafafa; }
  .scene-nest td { padding:8px 16px 14px 40px !important; }
  .scene-nest table { background:#fff; }
  .member-sub { color:var(--text-secondary); font-size:13px; margin-bottom:16px; }
  .metric-row { display:flex; gap:12px; margin-bottom:8px; }
  .metric { flex:1; background:#f5f7fa; border-radius:6px; padding:12px 14px; text-align:center; }
  .metric b { display:block; font-size:26px; line-height:1.2; color:var(--danger); }
  .metric span { font-size:12px; color:var(--text-secondary); }
  .metric.ok b { color:var(--success); }
  .score-formula { font-size:12px; color:var(--text-secondary); margin:0 0 8px; }
  .sec-title { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; margin:16px 0 10px; }
  .sec-title::before { content:""; width:3px; height:14px; background:var(--primary); border-radius:1px; }
  .scene-block { border:1px solid var(--border-lighter); border-radius:6px; padding:12px 14px 4px; margin-bottom:10px; }
  .scene-block.muted { padding-bottom:12px; background:#fafafa; color:var(--text-secondary); }
  .scene-block-head { display:flex; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .scene-block-name { font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .scene-block-std { margin-top:4px; font-size:12px; color:var(--text-secondary); }
  .scene-block-score { text-align:right; font-size:22px; font-weight:700; color:var(--danger); line-height:1; }
  .scene-block-score span { display:block; margin-top:4px; font-size:12px; font-weight:400; color:var(--text-secondary); }
  .m-bar-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .m-bar-name { width:72px; flex-shrink:0; font-size:14px; color:var(--text-primary); }
  .m-bar-track { flex:1; height:8px; background:#ebeef5; border-radius:4px; overflow:hidden; }
  .m-bar-track i { display:block; height:100%; background:#409eff; border-radius:4px; }
  .m-bar-pct { width:52px; text-align:right; font-size:13px; color:var(--text-regular); }
  .m-bar-frac { width:58px; text-align:right; font-size:13px; color:var(--text-secondary); }
  .same-std { background:#f5f7fa; border-radius:6px; padding:12px 14px 4px; margin-bottom:10px; }
  .snap-block { background:#f5f7fa; border-radius:6px; padding:10px 12px 2px; margin-bottom:10px; }
  .snap-head { display:flex; justify-content:space-between; gap:12px; margin-bottom:8px; }
  .snap-score { text-align:right; font-size:16px; font-weight:700; color:var(--text-primary); line-height:1; }
  .snap-score span { display:block; margin-top:4px; font-size:12px; font-weight:400; color:var(--text-secondary); }
  .call-split { display:flex; gap:16px; min-height:0; }
  .call-side { width:300px; flex-shrink:0; border-right:1px solid var(--border-lighter); padding-right:12px; }
  .call-main { flex:1; min-width:0; }
  .audio-bar { background:#f5f7fa; border-radius:4px; padding:8px 10px; font-size:12px; color:var(--text-secondary); margin-bottom:10px; }
  .bubble { margin-bottom:10px; }
  .bubble .who { font-size:12px; color:var(--text-secondary); margin-bottom:2px; }
  .bubble .txt { background:#f5f7fa; border-radius:4px; padding:8px 10px; font-size:13px; line-height:1.6; }
  .bubble.sale .txt { background:#ecf5ff; }
  .bullet { margin:0 0 8px 18px; color:var(--text-regular); line-height:1.6; }
  .comment-box { background:var(--primary-light); border-radius:4px; padding:12px 14px; color:var(--text-regular); line-height:1.7; font-size:13px; }
  .tag .close { cursor:pointer; margin-left:4px; font-style:normal; }
</style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="logo"><span class="logo-icon">质</span><span class="logo-title">AI质培中台</span></div>
    <nav class="menu">
      <div class="menu-group-title"><span>AI陪练</span><span class="menu-arrow">&#9662;</span></div>
      <div class="menu-sub">
        <div class="menu-item" data-page="locked">优秀话术库</div>
        <div class="menu-item" id="nav-scene" data-page="scene">场景配置</div>
        <div class="menu-item active" id="nav-list" data-page="list">评价标准管理</div>
        <div class="menu-item" data-page="locked">行为画像库</div>
        <div class="menu-item" data-page="locked">对练台配置管理</div>
        <div class="menu-item" data-page="locked">角色音色管理</div>
        <div class="menu-item" id="nav-task" data-page="task">任务管理</div>
        <div class="menu-item" id="nav-mytask" data-page="mytask">我的任务</div>
        <div class="menu-item" data-page="locked">客户池</div>
      </div>
    </nav>
  </aside>
  <div class="body-wrap">
    <header class="navbar">
      <div class="breadcrumb">AI陪练 <span>/</span> <span class="cur" id="crumb">评价标准管理</span></div>
      <div class="nav-user"><span class="avatar">李</span><span>李莹萍</span></div>
    </header>
    <main class="main" id="main"></main>
  </div>
</div>

function dim(name, max, rubric) {
  return { name, max, rubric, bandsOpen: false, bands: [
    { range: "", text: "" },
    { range: "", text: "" }
  ]};
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}

function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

function sumMax(list) { return list.reduce((n, d) => n + (Number(d.max) || 0), 0); }

function publishedOf(type) {
  return standards.filter(s => s.status === "published" && s.type === type);
}

function findStandard(id) { return standards.find(s => s.id === id); }

function setCrumb(text) { document.getElementById("crumb").textContent = text; }

function setNav(page) {
  document.querySelectorAll(".menu-item").forEach(el => el.classList.remove("active"));
  const id = page === "scene" || page === "sceneEdit" ? "nav-scene" : (page === "task" || page === "taskMember" ? "nav-task" : (page === "mytask" ? "nav-mytask" : "nav-list"));
  document.getElementById(id).classList.add("active");
}

function render() {
  if (view === "list") renderList();
  else if (view === "editor") renderEditor();
  else if (view === "sceneEdit") renderSceneEdit();
  else if (view === "task") renderTask();
  else if (view === "taskMember") renderTaskMember();
  else if (view === "mytask") renderMyTask();

}

function refsOf(standard) {
  return scenes.filter(sc => Number(sc.standardId) === Number(standard.id)).map(sc => ({
    name: sc.name, status: sc.status, task: !!sc.refRunning
  }));
}
function citedByPublishedScene(standard) {
  if (!standard) return false;
  return refsOf(standard).some(r => r.status === "已发布");
}
function lockedByTask(standard) { return refsOf(standard).some(r => r.task); }

function renderList() {
  setCrumb("评价标准管理");
  setNav("list");
  const kw = filters.kw.trim();
  const type = filters.type;
  const status = filters.status;
  const rows = standards.filter(s => {
    if (kw && !s.name.includes(kw)) return false;
    if (type && s.type !== type) return false;
    if (status && s.status !== status) return false;
    return true;
  });
  document.getElementById("main").innerHTML = `
    <div class="card">
      <div class="tip-bar">评价标准按量表维护。场景发布时从已发布标准中选择一条。查询评分结果时固定展示总分、维度得分、判断依据、优势、待改进和综合评语，维度内容随所选标准变化。</div>
      <div class="form-inline">
        <input class="input" id="f-kw" placeholder="标准名称" style="width:180px" value="${esc(kw)}">
        <select class="select" id="f-type" style="width:140px">
          <option value="">适用类型</option>
          <option value="ai" ${type==="ai"?"selected":""}>AI客户</option>
          <option value="qa" ${type==="qa"?"selected":""}>问答对练</option>
        </select>
        <select class="select" id="f-status" style="width:140px">
          <option value="">状态</option>
          <option value="published" ${status==="published"?"selected":""}>已发布</option>
          <option value="draft" ${status==="draft"?"selected":""}>草稿</option>
          <option value="disabled" ${status==="disabled"?"selected":""}>已停用</option>
        </select>
        <button class="btn" id="btn-reset">重置</button>
        <div class="toolbar-right"><button class="btn btn-primary" id="btn-create">＋ 新建标准</button></div>
      </div>
      <table class="el-table">
        <thead><tr>
          <th>标准名称</th><th>适用类型</th><th>维度数</th><th>引用场景数</th><th>状态</th><th>更新人</th><th>更新时间</th><th>操作</th>
        </tr></thead>
        <tbody>
          ${rows.length ? rows.map(rowHtml).join("") : `<tr><td colspan="8"><div class="empty">没有符合条件的评价标准</div></td></tr>`}
        </tbody>
      </table>
      <div class="pagination"><span>共 ${rows.length} 条</span><button class="page-btn active">1</button><span>10条/页</span></div>
    </div>`;

  document.getElementById("f-type").addEventListener("change", e => { filters.type = e.target.value; renderList(); });
  document.getElementById("f-status").addEventListener("change", e => { filters.status = e.target.value; renderList(); });
  document.getElementById("btn-reset").onclick = () => { filters = { kw: "", type: "", status: "" }; renderList(); };
  document.getElementById("btn-create").onclick = () => openEditor(null);
  bindListActions();
  const kwEl = document.getElementById("f-kw");
  if (kw) { kwEl.focus(); kwEl.setSelectionRange(kw.length, kw.length); }
}

function rowHtml(s) {
  const ops = [];
  if (s.status !== "disabled") ops.push(`<button class="btn-link" data-act="edit" data-id="${s.id}">编辑</button>`);
  if (s.status === "published" && citedByPublishedScene(s)) ops.push(`<button type="button" class="btn-link" disabled title="该标准正在被已发布的场景引用，不允许停用">停用</button>`);
  else if (s.status === "published") ops.push(`<button type="button" class="btn-link danger" data-act="disable" data-id="${s.id}">停用</button>`);
  if (s.status === "draft") ops.push(`<button class="btn-link danger" data-act="del" data-id="${s.id}">删除</button>`);
  if (s.status === "disabled") ops.push(`<button class="btn-link" data-act="enable" data-id="${s.id}">启用</button>`);
  if (s.status !== "draft") ops.push(`<button class="btn-link" data-act="report" data-id="${s.id}">结果示例</button>`);
  return `<tr>
    <td><span class="name-link" data-act="detail" data-id="${s.id}">${esc(s.name)}</span></td>
    <td><span class="tag tag-primary">${TYPE_LABEL[s.type]}</span></td>
    <td>${s.dimensions.length} 个维度</td>
    <td>${refsOf(s).length ? `<span class="link-num" data-act="refs" data-id="${s.id}">${refsOf(s).length}</span>` : "0"}</td>
    <td><span class="tag ${STATUS_TAG[s.status]}">${STATUS_LABEL[s.status]}</span></td>
    <td>${esc(s.updatedBy)}</td>
    <td>${esc(s.updatedAt)}</td>
    <td>${ops.join("")}</td>
  </tr>`;
}

function bindListActions() {
  document.querySelectorAll("[data-act]").forEach(el => {
    el.onclick = () => {
      const s = findStandard(Number(el.dataset.id));
      const act = el.dataset.act;
      if (act === "detail") openDetail(s);
      if (act === "refs") openRefs(s);
      if (act === "edit") openEditor(s);
      if (act === "report") openReport(s, s.name);
      if (act === "enable") { s.status = "published"; s.updatedAt = now(); toast("已启用，可被场景选择"); renderList(); }
      if (act === "del") confirm("删除评价标准", `确认删除「${s.name}」？删除后不可恢复。`, () => {
        standards = standards.filter(x => x.id !== s.id); toast("已删除"); renderList();
      });
      if (act === "disable") {
        if (citedByPublishedScene(s)) { toast("该标准正在被已发布的场景引用，不允许停用"); return; }
        const refs = refsOf(s);
        const msg = refs.length
          ? `「${s.name}」已被 ${refs.length} 个场景引用。停用后这些场景保持原绑定，新场景不能再选择它。`
          : `确认停用「${s.name}」？停用后不再出现在场景的可选列表中。`;
        confirm("停用评价标准", msg, () => {
          if (citedByPublishedScene(s)) { toast("该标准正在被已发布的场景引用，不允许停用"); return; }
          s.status = "disabled"; s.updatedAt = now(); toast("已停用"); renderList();
        });
      }
    };
  });
}

function now() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

    </div>`).join("");
  document.querySelectorAll("#dim-list [data-field]").forEach(el => {
    el.oninput = () => {
      const item = d.dimensions[Number(el.dataset.i)];

function saveEditor(status) {
  const d = editor.data;
  if (!d.name.trim()) { toast("请填写标准名称"); return; }
  if (standards.some(s => s.id !== d.id && s.type === d.type && s.name === d.name.trim())) {
    toast("同类型下标准名称不能重复"); return;
  }
  if (status === "published") {
    if (!d.dimensions.length) { toast("请至少添加 1 个维度"); return; }
    if (d.dimensions.some(item => !item.name.trim() || !item.rubric.trim() || !(Number(item.max) > 0))) {
      toast("请补全每个维度的名称、满分和评分说明"); return;
    }
    if (sumMax(d.dimensions) !== 100) { toast("满分合计需要等于 100"); return; }
  }
  d.name = d.name.trim();
  d.status = status;
  d.updatedBy = "管理员";
  d.updatedAt = now();
  if (editor.mode === "create") {
    d.id = nextId++;
    d.refs = [];
    d.lockedByTask = false;
    standards.unshift(d);
  } else {
    const idx = standards.findIndex(s => s.id === d.id);
    const prev = standards[idx];
    d.refs = prev.refs;
    d.lockedByTask = prev.lockedByTask;
    standards[idx] = d;
  }
  const extra = editor.mode === "edit" && editor.originStatus === "published" ? "修改后仅对新发起的练习生效。" : "";
  toast(status === "published" ? `已发布。${extra}` : "已保存草稿");
  view = "list";
  editor = null;
  render();
}

function sceneAttempts(scene) {
  if (scene.attempts && scene.attempts.length) return scene.attempts;
  if (scene.copies && scene.copies.length) {
    const list = [];
    scene.copies.forEach(copy => {
      for (let i = 0; i < copy.calls; i++) {
        list.push({
          duration: "06:42",
          standardName: (scene.standard || "评价标准") + (copy.label ? "（" + copy.label + "）" : ""),
          dims: copy.dims,
          lines: [
          { role: "sale", time: "00:03", text: "您好，我是洋葱学园的老师，想跟您对一下最近的学习情况。" },
          { role: "ai", time: "00:12", text: "孩子数学成绩一般。" },
          { role: "sale", time: "00:20", text: "我先确认是步骤问题还是计算问题，再讲下一步安排。" }
        ] });
      }
    });
    return list;
  }
  if (!scene.dims) return [];
  return [{ duration: "03:42", standardName: scene.standard || "评价标准", perQuestion: scene.perQuestion, dims: scene.dims, lines: [
    { role: "sale", time: "00:03", text: "您好，我是洋葱学园的老师，请问是孩子家长吗？" },
    { role: "ai", time: "00:10", text: "是我。你说吧。" },

  ] }];
}

  if (act === "enable") { s.status = "已发布"; s.time = shortNow(); toast("场景「" + s.name + "」已启用"); return renderScene(); }
  if (act === "del") return confirm("删除场景", "确认删除「" + s.name + "」？删除后不可恢复。", () => {

function readSceneForm() {
  const d = sceneDraft;
  d.name = document.getElementById("se-name").value;
  d.stages = [...document.querySelectorAll("#se-stages input:checked")].map(el => el.value);
  d.goal = document.getElementById("se-goal").value;
  d.interval = Number(document.getElementById("se-gap").value) || d.interval;
  d.standardId = document.getElementById("se-std").value;
  if (d.type === "ai") {
    d.scope = document.getElementById("se-scope").value;
    d.maxMin = Number(document.getElementById("se-max").value) || d.maxMin;
    d.prompt = document.getElementById("se-prompt").value;
  }
}
function bindSceneEdit() {
  const d = sceneDraft;
  document.getElementById("sc-back").onclick = () => { view = "scene"; sceneDraft = null; render(); };
  document.getElementById("sc-draft").onclick = () => saveScene("草稿");
  document.getElementById("sc-pub").onclick = () => saveScene("已发布");
  document.getElementById("se-tag").onchange = e => {
    const name = e.target.value;
    if (name && !d.tags.includes(name)) d.tags.push(name);
    e.target.value = "";
    readSceneForm();
    renderSceneEdit();
  };
  document.querySelectorAll("[data-rm-tag]").forEach(el => {
    el.onclick = () => { readSceneForm(); d.tags = d.tags.filter(t => t !== el.dataset.rmTag); renderSceneEdit(); };
  });
  document.getElementById("se-preview").onclick = () => {
    readSceneForm();
    const std = findStandard(Number(d.standardId));
    if (!std) { toast("请先选择评价标准"); return; }
    openReport(std, d.name || "未命名场景");
  };
  if (d.type === "ai") {
    document.getElementById("se-test-send").onclick = () => {
      const inp = document.getElementById("se-test-input");
      const v = inp.value.trim();
      if (!v) return;
      const box = document.getElementById("se-test-msgs");
      if (box.querySelector("div[style*='padding-top']")) box.innerHTML = "";
      box.innerHTML += `<div style="text-align:right;margin-bottom:8px;"><span style="display:inline-block;background:var(--primary);color:#fff;border-radius:8px 8px 2px 8px;padding:6px 10px;max-width:85%;text-align:left;">${esc(v)}</span></div>`;
      box.innerHTML += `<div style="margin-bottom:8px;"><span style="display:inline-block;background:#fff;border:1px solid var(--border-lighter);border-radius:8px 8px 8px 2px;padding:6px 10px;max-width:85%;">嗯…你是哪个机构的老师？我最近挺忙的，有什么事你先说。</span></div>`;
      box.scrollTop = box.scrollHeight;
      inp.value = "";
    };
    document.getElementById("se-test-reset").onclick = () => {
      document.getElementById("se-test-msgs").innerHTML = `<div style="color:var(--text-secondary);text-align:center;padding-top:100px;">对话已重置</div>`;

    document.getElementById("qa-toggle").onclick = () => { qaPanelOpen = !qaPanelOpen; qaChecked = new Set(); paintQa(); };

}
function paintQa() {
  const panel = document.getElementById("qa-panel");
  if (!panel) return;
  panel.style.display = qaPanelOpen ? "" : "none";
  if (qaPanelOpen) {
    const kw = (document.getElementById("qa-kw")?.value || "").trim();
    const cat = document.getElementById("qa-cat")?.value || "全部分类";
    const list = qaBank.filter(x => !sceneDraft.questions.some(p => p.q === x.q)).filter(x => (!kw || x.q.includes(kw)) && (cat === "全部分类" || x.cat === cat));
    document.getElementById("qa-pick-body").innerHTML = list.length ? list.map(x => `
      <tr><td><input type="checkbox" data-q="${esc(x.q)}" ${qaChecked.has(x.q)?"checked":""}></td><td>${esc(x.q)}</td><td style="color:var(--text-secondary);">${esc(x.a)}</td><td>${esc(x.cat)}</td></tr>`).join("")
      : `<tr><td colspan="4" style="text-align:center;color:var(--text-placeholder);padding:20px;">无匹配问题</td></tr>`;
    document.querySelectorAll("#qa-pick-body input").forEach(el => {
      el.onchange = () => { el.checked ? qaChecked.add(el.dataset.q) : qaChecked.delete(el.dataset.q); document.getElementById("qa-count").textContent = "已勾选 " + qaChecked.size + " 个问题"; };
    });
    document.getElementById("qa-count").textContent = "已勾选 " + qaChecked.size + " 个问题";
    document.getElementById("qa-kw").oninput = paintQa;
    document.getElementById("qa-cat").onchange = paintQa;
    document.getElementById("qa-cancel").onclick = () => { qaPanelOpen = false; paintQa(); };
    document.getElementById("qa-ok").onclick = () => {
      qaBank.forEach(x => { if (qaChecked.has(x.q) && !sceneDraft.questions.some(p => p.q === x.q)) sceneDraft.questions.push(x); });
      qaPanelOpen = false;
      qaChecked = new Set();
      paintQa();
      toast("已添加所选问题");
    };
  }
  const body = document.getElementById("qa-picked-body");
  body.innerHTML = sceneDraft.questions.length ? sceneDraft.questions.map((x, i) => `
    <tr draggable="true" data-i="${i}">
      <td><i class="drag-handle">⠿</i></td>
      <td>${esc(x.q)}</td><td style="color:var(--text-secondary);">${esc(x.a)}</td>
      <td><button class="btn-link danger" data-qi="${i}">删除</button></td>
    </tr>`).join("") : `<tr><td colspan="4" style="text-align:center;color:var(--text-placeholder);padding:16px;">暂未选择问题</td></tr>`;
  body.querySelectorAll("[data-qi]").forEach(el => {
    el.onclick = () => { sceneDraft.questions.splice(Number(el.dataset.qi), 1); paintQa(); };
  });
  body.querySelectorAll("tr[data-i]").forEach(row => {
    row.ondragstart = e => e.dataTransfer.setData("text/plain", row.dataset.i);
    row.ondragover = e => e.preventDefault();
    row.ondrop = e => {
      e.preventDefault();
      const from = Number(e.dataTransfer.getData("text/plain"));
      const to = Number(row.dataset.i);
      if (Number.isNaN(from) || from === to) return;
      const [item] = sceneDraft.questions.splice(from, 1);
      sceneDraft.questions.splice(to, 0, item);
      paintQa();
    };
  });
}
function saveScene(status) {
  readSceneForm();
  const d = sceneDraft;
  if (!d.name.trim()) { toast("请填写场景名称"); return; }
  if (d.name.trim().length > 20) { toast("场景名称不超过 20 个字符"); return; }
  if (status === "已发布") {
    if (!d.stages.length) { toast("请至少选择一个适用学段"); return; }
    const std = findStandard(Number(d.standardId));
    if (!std || std.status !== "published" || std.type !== d.type) { toast("请选择已发布且类型一致的评价标准"); return; }
    if (d.type === "ai" && (!String(d.prompt).trim() || !String(d.goal).trim())) { toast("请填写场景提示词和对话目标"); return; }
    if (d.type === "qa" && !d.questions.length) { toast("请至少选择 1 个问题"); return; }
    if (d.type === "qa" && !String(d.goal).trim()) { toast("请填写对话目标"); return; }
  }
  d.name = d.name.trim();
  d.status = status;
  d.updater = "管理员";
  d.time = shortNow();
  const wasPublished = d.id && scenes.find(s => s.id === d.id)?.status === "已发布";
  if (!d.id) { d.id = sceneNextId++; scenes.unshift(d); }
  else {
    const idx = scenes.findIndex(s => s.id === d.id);
    d.refRunning = scenes[idx].refRunning;
    scenes[idx] = d;
  }
  toast(status === "已发布" ? (wasPublished ? "场景已发布，修改后仅对新发起的练习生效" : "场景已发布") : "已保存为草稿");
  view = "scene";
  sceneDraft = null;
  render();
}

function renderTagManage() {
  document.getElementById("tagBody").innerHTML = `
    <div style="display:flex;align-items:center;margin-bottom:14px;">
      <button class="btn btn-primary" id="tag-add-btn">＋ 添加标签</button>
      <span style="margin-left:auto;font-size:13px;color:var(--text-secondary);">共 ${sceneTags.length} 个标签</span>
    </div>
    ${tagAddOpen ? `<div style="padding:14px;margin-bottom:14px;background:#f5f7fa;border-radius:8px;">
      <div class="form-item" style="margin-bottom:10px;"><div class="form-label req" style="width:88px;">标签名称</div><div class="form-content">
        <input class="input" id="tag-add-input" style="width:100%;" maxlength="20" placeholder="请输入标签名称，不超过 20 个字">
        <div class="form-tip">标签名称不可与现有标签重复</div>
      </div></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;"><button class="btn" id="tag-add-cancel">取消</button><button class="btn btn-primary" id="tag-add-ok">确定添加</button></div>
    </div>` : ""}
    <table class="el-table"><thead><tr><th>标签名称</th><th>引用场景数</th><th>添加人</th><th>添加时间</th><th>操作</th></tr></thead>
    <tbody>${sceneTags.map((t, i) => {
      const ref = tagRefCount(t.name);
      const nameCell = tagEditing === i
        ? `<input class="input" id="tag-edit-input" value="${esc(t.name)}" maxlength="20" style="width:160px;">`
        : esc(t.name);
      const ops = tagEditing === i
        ? `<button class="btn-link" data-tag-save="${i}">保存</button><button class="btn-link" id="tag-edit-cancel">取消</button>`
        : `<button class="btn-link" data-tag-edit="${i}">编辑</button>${ref === 0 ? `<button class="btn-link danger" data-tag-del="${i}">删除</button>` : ""}`;
      return `<tr><td>${nameCell}</td><td>${ref}</td><td>${esc(t.creator)}</td><td>${esc(t.time)}</td><td>${ops}</td></tr>`;
    }).join("")}</tbody></table>`;
  document.getElementById("tag-add-btn").onclick = () => { tagAddOpen = !tagAddOpen; renderTagManage(); };
  const cancel = document.getElementById("tag-add-cancel");
  if (cancel) cancel.onclick = () => { tagAddOpen = false; renderTagManage(); };
  const ok = document.getElementById("tag-add-ok");
  if (ok) ok.onclick = () => {
    const name = document.getElementById("tag-add-input").value.trim();
    if (!name) { toast("请输入标签名称"); return; }
    if (sceneTags.some(t => t.name === name)) { toast("标签名称不可与现有标签重复"); return; }
    sceneTags.unshift({ name, creator: "管理员", time: now() });
    tagAddOpen = false;
    toast("已添加标签");
    renderTagManage();
  };
  document.querySelectorAll("[data-tag-edit]").forEach(el => el.onclick = () => { tagEditing = Number(el.dataset.tagEdit); renderTagManage(); });
  document.querySelectorAll("[data-tag-save]").forEach(el => el.onclick = () => {
    const name = document.getElementById("tag-edit-input").value.trim();
    const i = Number(el.dataset.tagSave);
    if (!name) { toast("请输入标签名称"); return; }
    if (sceneTags.some((t, idx) => t.name === name && idx !== i)) { toast("标签名称不可与现有标签重复"); return; }
    const old = sceneTags[i].name;
    sceneTags[i].name = name;
    scenes.forEach(s => { s.tags = (s.tags || []).map(t => t === old ? name : t); });
    tagEditing = -1;
    renderTagManage();
  });
  const editCancel = document.getElementById("tag-edit-cancel");
  if (editCancel) editCancel.onclick = () => { tagEditing = -1; renderTagManage(); };
  document.querySelectorAll("[data-tag-del]").forEach(el => el.onclick = () => {
    const i = Number(el.dataset.tagDel);
    confirm("删除标签", "确认删除标签「" + sceneTags[i].name + "」？", () => {
      sceneTags.splice(i, 1);
      renderTagManage();
      toast("已删除");
    });
  });
}

function getTaskStatusText(status) {
  if (status === "CREATE") return "未开始";
  if (status === "PROCESS") return "进行中";
  if (status === "END") return "已结束";
  return status || "";
}
function getTaskStatusTag(status) {
  if (status === "PROCESS") return "tag-primary";
  return "tag-info";
}

function copyTotal(copy) {
  const got = copy.dims.reduce((n, d) => n + Number(d.score), 0);
  const max = copy.dims.reduce((n, d) => n + Number(d.max), 0);
  return max ? Math.round(got / max * 1000) / 10 : 0;
}
function scenePoint(scene) {
  if (scene.copies && scene.copies.length) {
    const calls = scene.copies.reduce((n, c) => n + c.calls, 0);
    const sum = scene.copies.reduce((n, c) => n + copyTotal(c) * c.calls, 0);
    return calls ? Math.round(sum / calls * 10) / 10 : null;
  }
  if (!scene.dims) return null;
  const got = scene.dims.reduce((n, d) => n + Number(d.score), 0);
  const max = scene.dims.reduce((n, d) => n + Number(d.max), 0);
  return max ? Math.round(got / max * 100) : 0;
}
function sceneScored(scene) {
  return !!(scene.dims || (scene.copies && scene.copies.length));
}
function personScore(member) {
  const scores = member.scenes.map(scenePoint).filter(n => n !== null);
  if (!scores.length) return null;
  const avg = scores.reduce((n, s) => n + s, 0) / scores.length;
  return Math.round(avg * 10) / 10;
}
function pctLabel(score, max) {
  const p = max ? score / max * 100 : 0;
  return (Math.round(p * 10) / 10).toString().replace(/\.0$/, "") + "%";
}
function dimBars(dims) {
  return dims.map(d => `<div class="m-bar-row">
    <span class="m-bar-name">${esc(d.name)}</span>
    <span class="m-bar-track"><i style="width:${d.max ? d.score / d.max * 100 : 0}%"></i></span>
    <span class="m-bar-pct">${pctLabel(d.score, d.max)}</span>
    <span class="m-bar-frac">${d.score}/${d.max}</span>
  </div>`).join("");
}
function snapshotBlocks(scene) {
  const calls = scene.copies.reduce((n, c) => n + c.calls, 0);
  const parts = scene.copies.map(c => `${copyTotal(c)} × ${c.calls}`).join(" + ");
  return `
    <div class="score-formula">场景得分 =（${parts}）/ ${calls} = ${scenePoint(scene)}。副本不同只平均总分。</div>
    ${scene.copies.map(c => `<div class="snap-block">
      <div class="snap-head">
        <div>
          <div class="scene-block-name">${esc(c.label)}</div>
          <div class="scene-block-std">${esc(c.note)}，环节分是这 ${c.calls} 通的平均</div>
        </div>
        <div class="snap-score">${copyTotal(c)}<span>副本总分</span></div>
      </div>
      ${dimBars(c.dims)}
    </div>`).join("")}
    <div class="form-tip" style="margin:0 0 10px;">两份副本的环节对不上，不合成一张图，也不做同标准平均。</div>`;
}
function sameStandardBlocks(member) {
  const groups = {};
  member.scenes.forEach(s => {
    if (!s.dims || s.copies) return;
    (groups[s.standardId] = groups[s.standardId] || { name: s.standard, scenes: [] }).scenes.push(s);
  });
  return Object.values(groups).filter(g => g.scenes.length > 1).map(g => {
    const dims = g.scenes[0].dims.map((d, i) => {
      const avg = g.scenes.reduce((n, s) => n + s.dims[i].score, 0) / g.scenes.length;
      return { name: d.name, score: Math.round(avg * 10) / 10, max: d.max };
    });
    return `<div class="same-std"><div class="scene-block-name">同标准平均 · ${esc(g.name)}</div><div class="scene-block-std" style="margin-bottom:10px;">${g.scenes.map(s => esc(s.name)).join("、")} 使用同一条标准，维度可以平均</div>${dimBars(dims)}</div>`;
  }).join("");
}

function sceneStatusText(s) {
  if (s.status === "已完成" || s.status === "已交卷" || s.status === "已评分") return "已完成";
  return sceneScored(s) ? "已完成" : "未完成";
}
function sceneTimes(s) {
  if (s.times != null) return s.times;
  if (s.copies) return s.copies.reduce((n, c) => n + c.calls, 0);
  return sceneScored(s) ? 1 : 0;
}
function sceneHigh(s) {
  if (s.high != null) return s.high;
  const point = scenePoint(s);
  return point === null ? "—" : point;
}
function sceneLast(s, member) {
  return s.last || member.last;
}
function sceneDuration(scene) {
  if (scene.duration) return scene.duration;
  if (scene.copies && scene.copies.length) return scene.copies.reduce((n, c) => n + c.calls, 0) * 6 + "分钟";
  const times = sceneTimes(scene);
  return times ? times * 6 + "分钟" : "—";
}
function openMemberExport(task, members) {
  const free = task.mode === "自由练习";
  const overviewHead = ["学员", "部门", "完成进度", "最近练习时间", "综合得分"];
  const overviewRows = members.map(m => [m.name, m.org || "—", memberProgress(m), m.last, memberScoreText(m)]);
  const detailHead = free
    ? ["线索昵称", "手机号", "练习场景", "练习次数", "累计时长", "最近练习时间"]
    : ["学员", "场景名称", "完成状态", "练习次数", "最高得分", "最近练习时间"];
  const detailRows = free
    ? members.flatMap(m => m.scenes.map(s => [m.clueName || m.name, m.phone || "138****2618", s.name, sceneTimes(s), sceneDuration(s), sceneLast(s, m)]))
    : members.flatMap(m => m.scenes.map(s => [m.name, s.name, sceneStatusText(s), sceneTimes(s), sceneHigh(s), sceneLast(s, m)]));
  const sheet = (title, head, rows) => `
    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">工作表：${esc(title)}</div>
    <table class="el-table"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.length ? rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${head.length}"><div class="empty">暂无数据</div></td></tr>`}</tbody></table>`;
  document.getElementById("detailTitle").textContent = "导出明细 · " + task.name;
  document.getElementById("detailBody").innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="btn btn-primary btn-sm" id="sheet-overview">学员总览</button>
      <button class="btn btn-sm" id="sheet-detail">学员明细</button>
    </div>
    <div id="sheet-body">${sheet("学员总览", overviewHead, overviewRows)}</div>`;
  const show = (which) => {
    document.getElementById("sheet-overview").className = "btn btn-sm" + (which === "overview" ? " btn-primary" : "");
    document.getElementById("sheet-detail").className = "btn btn-sm" + (which === "detail" ? " btn-primary" : "");
    document.getElementById("sheet-body").innerHTML = which === "overview"
      ? sheet("学员总览", overviewHead, overviewRows)
      : sheet("学员明细", detailHead, detailRows);
  };
  document.getElementById("sheet-overview").onclick = () => show("overview");
  document.getElementById("sheet-detail").onclick = () => show("detail");
  document.getElementById("detailMask").classList.add("show");
}

  document.querySelectorAll("[data-scene-report]").forEach(el => el.onclick = () => {
    const [mid, index] = el.dataset.sceneReport.split(":");

function openMemberReport(id) {
  const m = taskMembers.find(x => x.id === id);
  if (!m.strengths) {
    const scene = m.scenes[0];
    if (scene) openSceneAttemptReport(m, scene);
    return;
  }
  const scored = m.scenes.filter(sceneScored);
  const scores = scored.map(s => ({ name: s.name, score: scenePoint(s) }));
  const total = personScore(m);
  document.getElementById("memberTitle").textContent = m.name + " · 整体评价与分析";
  document.getElementById("memberDialog").style.width = "760px";
  document.getElementById("memberBody").innerHTML = `
    <div class="metric-row">
      <div class="metric"><b>${total}</b><span>综合得分</span></div>
      <div class="metric"><b style="color:var(--text-primary)">${scored.length}/${m.scenes.length}</b><span>已评分场景</span></div>
    </div>
    <div class="score-formula">综合得分 =（${scores.map(s => esc(s.name) + " " + s.score).join(" + ")}）/ ${scores.length} = ${total}。未评分场景不计入。</div>
    <div class="sec-title">分场景表现</div>
    ${m.scenes.map(s => {
      const point = scenePoint(s);
      if (!sceneScored(s)) return `<div class="scene-block muted"><div class="scene-block-name">${esc(s.name)} <span class="tag tag-info">${esc(s.status)}</span></div><div class="scene-block-std">评价标准：${esc(s.standard)}。未评分，不计入综合得分，也不展示维度。</div></div>`;
      return `<div class="scene-block">
        <div class="scene-block-head">
          <div>
            <div class="scene-block-name">${esc(s.name)} <span class="tag ${s.type === "AI客户" ? "tag-primary" : "tag-warning"}">${esc(s.type)}</span>${s.copies ? `<span class="tag tag-warning">${s.copies.length} 份标准副本</span>` : ""}</div>
            <div class="scene-block-std">评价标准：${esc(s.standard)}</div>
          </div>
          <div class="scene-block-score">${point}<span>场景得分</span></div>
        </div>
        ${s.copies ? snapshotBlocks(s) : dimBars(s.dims)}
        ${s.perQuestion ? questionSection() : ""}
      </div>`;
    }).join("")}
    ${sameStandardBlocks(m)}
    <div class="sec-title">优势表现</div>
    <ul>${m.strengths.map(t => `<li class="bullet">${esc(t)}</li>`).join("")}</ul>
    <div class="sec-title">待改进项</div>
    <ul>${m.weaknesses.map(t => `<li class="bullet">${esc(t)}</li>`).join("")}</ul>
    <div class="sec-title">AI 综合评语与建议</div>
    <div class="comment-box">${esc(m.comment)}</div>`;
  document.getElementById("memberMask").classList.add("show");
}

function filteredMyTasks() {
  return myTasks.filter(t => {
    if (myTaskQuery.name && !t.name.includes(myTaskQuery.name)) return false;
    if (myTaskQuery.status && t.status !== myTaskQuery.status) return false;
    if (myTaskQuery.mode && t.mode !== myTaskQuery.mode) return false;
    return true;
  });
}
