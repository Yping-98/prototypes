<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>渠道活码备注固定与动态 - 可交互原型</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #fff;
      --line: #e8e8e8;
      --text: #262626;
      --muted: #8c8c8c;
      --primary: #1677ff;
      --side: #001529;
      --ok: #52c41a;
      --danger: #ff4d4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    .layout { display: flex; min-height: 100vh; }
    .side {
      width: 200px;
      background: var(--side);
      color: rgba(255,255,255,.75);
      padding: 16px 0;
      flex: none;
    }
    .side .brand { color: #fff; font-weight: 600; padding: 0 16px 16px; }
    .side .item { padding: 10px 20px; font-size: 13px; }
    .side .item.active { background: #1677ff; color: #fff; }
    .main { flex: 1; min-width: 0; }
    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .content { padding: 16px 20px 40px; }
    #diffPage { position: relative; max-width: 920px; }
    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 20px 24px 28px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      align-items: flex-start;
    }
    .form-label {
      width: 96px;
      flex: none;
      text-align: right;
      color: var(--text);
      line-height: 32px;
      padding-right: 4px;
    }
    .form-label .req { color: var(--danger); margin-right: 2px; }
    .form-body { flex: 1; min-width: 0; }
    .input, .select-like {
      height: 32px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      padding: 0 11px;
      width: 100%;
      max-width: 420px;
      background: #fff;
      font-size: 14px;
    }
    .select-like {
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hint { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.5; }
    .switch {
      width: 44px;
      height: 22px;
      border-radius: 11px;
      background: #bfbfbf;
      position: relative;
      cursor: pointer;
      border: 0;
      margin-top: 5px;
      transition: background .2s;
    }
    .switch.on { background: var(--ok); }
    .switch::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      top: 2px;
      left: 2px;
      transition: left .2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .switch.on::after { left: 24px; }
    .type-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      background: #fafafa;
      border: 1px solid var(--line);
      border-radius: 8px;
      max-width: 520px;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .check input { width: 16px; height: 16px; accent-color: var(--primary); }
    .sub-field { margin: 4px 0 0 24px; }
    .preview {
      margin-top: 12px;
      padding: 10px 12px;
      background: #f0f7ff;
      border: 1px dashed #91caff;
      border-radius: 6px;
      max-width: 520px;
      font-size: 13px;
      line-height: 1.6;
    }
    .preview b { color: var(--primary); font-weight: 600; }
    .preview .label { color: var(--muted); }
    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 28px;
      max-width: 640px;
    }
    .btn {
      height: 32px;
      border-radius: 6px;
      border: 1px solid #d9d9d9;
      background: #fff;
      padding: 0 16px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.78);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 9500;
      display: none;
    }
    .toast.show { display: block; }
    .sim {
      margin-top: 16px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      max-width: 520px;
    }
    .sim h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
    .sim .result {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      word-break: break-all;
    }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 4px;
      background: #f5f5f5;
      border: 1px solid #d9d9d9;
      color: var(--muted);
      font-size: 12px;
    }
    .err { color: var(--danger); font-size: 12px; margin-top: 6px; display: none; }
    .err.show { display: block; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="brand">电销 CRM</div>
      <div class="item">活动管理</div>
      <div class="item active">渠道活码</div>
    </aside>
    <div class="main">
      <div class="topbar">
        <h1>编辑活码场景</h1>
        <div style="color:#8c8c8c;font-size:12px;">原型 · 备注固定与动态</div>
      </div>
      <div class="content">
        <div id="diffPage" class="page">
          <div class="card">
            <div class="form-row">
              <div class="form-label"><span class="req">*</span>活码名称</div>
              <div class="form-body">
                <input class="input" value="春季投放活码-A" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-label"><span class="req">*</span>使用成员</div>
              <div class="form-body">
                <div class="select-like" style="max-width:420px;">请选择成员 <span>▾</span></div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-label">添加标签</div>
              <div class="form-body">
                <span class="tag-chip">+ 添加客户标签</span>
                <div class="hint">客户通过该活码添加时，会自动打上配置的标签</div>
              </div>
            </div>

            <div class="form-row" id="remarkSwitchRow">
              <div class="form-label">添加备注</div>
              <div class="form-body">
                <button type="button" class="switch on" id="remarkSwitch" aria-label="添加备注开关"></button>
                <div class="hint">开启后，客户通过该活码添加时，会自动加上备注</div>
              </div>
            </div>

            <div class="form-row" id="remarkConfigRow">
              <div class="form-label"></div>
              <div class="form-body">
                <div class="type-group" id="remarkTypeGroup">
                  <label class="check"><input type="checkbox" id="chkFixed" checked /> 固定备注</label>
                  <div class="sub-field" id="fixedRemarkField">
                    <input class="input" id="fixedRemarkInput" maxlength="40" placeholder="请输入固定备注" value="春季投放" />
                    <div class="err" id="fixedErr">请填写固定备注</div>
                  </div>
                  <label class="check"><input type="checkbox" id="chkDynamic" checked /> 动态备注</label>
                  <div class="sub-field" id="dynamicRemarkHint">
                    <div class="hint" style="margin-top:0;">按客户添加成功当天写入日期，格式为年月日八位数字，例如 20260606。无需手工填写。</div>
                  </div>
                  <div class="err" id="typeErr">请至少选择一种备注类型</div>
                </div>

                <div class="preview" id="remarkPreview">
                  <div class="label">最终备注预览（示例昵称：张三，示例日期：20260606）</div>
                  <div>将写入：<b id="previewText">20260606春季投放-张三</b></div>
                </div>

                <div class="sim" id="addSuccessSim">
                  <h3>添加成功写入模拟</h3>
                  <div class="result" id="simResult">20260606春季投放-张三</div>
                  <div class="hint" style="margin-top:8px;">假设客户「张三」于 2026-06-06 通过该活码添加成功。</div>
                </div>
              </div>
            </div>

            <div class="footer-actions">
              <button type="button" class="btn" id="btnCancel">取消</button>
              <button type="button" class="btn primary" id="btnSave">保存</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    window.DIFF_CHANGESET = {
      meta: {
        slug: "channel-code-remark-fixed-dynamic",
        prdUrl: "https://guanghe.feishu.cn/docx/XiwKd3WDwoXcEsxLc4ScWo1unhf",
        demoControls: [
          { id: "both", label: "同时使用" },
          { id: "fixedOnly", label: "仅固定" },
          { id: "dynamicOnly", label: "仅动态" },
          { id: "off", label: "关闭备注" }
        ]
      },
      changes: [
        {
          id: "chg-1",
          page: "渠道活码编辑",
          pageKey: "channelEdit",
          module: "添加备注",
          target: "#remarkTypeGroup",
          level: "field",
          type: "new",
          title: "备注类型可勾选固定与动态",
          desc: "开启「添加备注」后，新增固定备注、动态备注两类勾选项，可单选或同时勾选。",
          before: "无此功能；开启后仅可填写一段固定文案",
          after: "可勾选固定备注、动态备注，或同时勾选；至少勾选一类才可保存",
          examples: [
            "只勾固定备注：按固定文案写入",
            "只勾动态备注：按添加成功日写入日期",
            "两类都勾：日期在前、固定文案在后，中间无分隔符"
          ],
          prd: { section: "7.1 【新增】备注类型选择", blockId: "doxcncvC7b3yrCRQUxkNxCJeQfT" }
        },
        {
          id: "chg-2",
          page: "渠道活码编辑",
          pageKey: "channelEdit",
          module: "固定备注",
          target: "#fixedRemarkField",
          level: "field",
          type: "logic",
          title: "固定备注仅在勾选后填写",
          desc: "勾选固定备注后展示原备注输入框；未勾选时不展示、不写入固定文案。",
          before: "开启添加备注后始终展示备注输入框",
          after: "仅勾选固定备注时展示输入框；勾选后文案必填",
          examples: [
            "勾选固定备注且未填文案：提示填写固定备注后不可保存",
            "取消勾选固定备注：隐藏输入框，提交时不带固定文案"
          ],
          prd: { section: "7.2 【修改】固定备注填写时机", blockId: "doxcnkcV58OxiPpSMxQmH5kbZ4b" }
        },
        {
          id: "chg-3",
          page: "渠道活码编辑",
          pageKey: "channelEdit",
          module: "动态备注",
          target: "#dynamicRemarkHint",
          level: "field",
          type: "new",
          title: "动态备注按添加成功日写入",
          desc: "勾选动态备注后，客户添加成功当天按年月日八位数字写入备注，例如 20260606；配置页只展示规则说明，无需人工填写日期。",
          before: "无此功能",
          after: "勾选即启用；日期取客户通过该活码添加企微成功当天，格式为年月日八位数字",
          examples: [
            "2026年6月6日添加成功 → 写入 20260606",
            "仅勾动态备注且客户昵称为张三 → 最终备注为 20260606-张三"
          ],
          prd: { section: "7.1 【新增】动态备注", blockId: "doxcn2R7HNKkkpqf7bNtjLUawee" }
        },
        {
          id: "chg-4",
          page: "渠道活码编辑",
          pageKey: "channelEdit",
          module: "备注预览",
          target: "#remarkPreview",
          level: "module",
          type: "new",
          title: "展示最终备注拼接预览",
          desc: "开启添加备注并完成类型勾选后，展示最终写入客户备注的拼接预览；同时使用时日期在前、固定文案在后且无分隔符，末尾仍拼接客户昵称。",
          before: "无预览；输入框旁仅提示会拼接客户昵称",
          after: "按当前勾选实时预览最终备注形态，并保留客户昵称后缀",
          examples: [
            "固定=春季投放、动态开启、昵称=张三 → 20260606春季投放-张三",
            "仅固定=春季投放、昵称=张三 → 春季投放-张三",
            "仅动态、昵称=张三 → 20260606-张三"
          ],
          prd: { section: "7.1 【新增】备注拼接预览", blockId: "doxcnikIkYZZGrzZkuHM24BAje5" }
        }
      ]
    };

    var state = {
      remarkOn: true,
      fixedOn: true,
      dynamicOn: true,
      fixedText: "春季投放",
      sampleDate: "20260606",
      sampleNick: "张三"
    };

    function $(id) { return document.getElementById(id); }

    function toast(msg) {
      var el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function () { el.classList.remove("show"); }, 1800);
    }

    function buildRemark() {
      if (!state.remarkOn) return "（未开启添加备注，不写入）";
      var parts = [];
      if (state.dynamicOn) parts.push(state.sampleDate);
      if (state.fixedOn) parts.push((state.fixedText || "").trim());
      var body = parts.join("");
      if (!body) return "（请至少选择一种备注类型）";
      return body + "-" + state.sampleNick;
    }

    function render() {
      $("remarkSwitch").classList.toggle("on", state.remarkOn);
      $("remarkConfigRow").style.display = state.remarkOn ? "" : "none";
      $("chkFixed").checked = state.fixedOn;
      $("chkDynamic").checked = state.dynamicOn;
      $("fixedRemarkField").style.display = state.fixedOn ? "" : "none";
      $("dynamicRemarkHint").style.display = state.dynamicOn ? "" : "none";
      $("fixedRemarkInput").value = state.fixedText;
      var text = buildRemark();
      $("previewText").textContent = text;
      $("simResult").textContent = text;
      $("fixedErr").classList.remove("show");
      $("typeErr").classList.remove("show");
      if (window.__diffRemeasure) window.__diffRemeasure();
    }

    function validate() {
      $("fixedErr").classList.remove("show");
      $("typeErr").classList.remove("show");
      if (!state.remarkOn) return true;
      if (!state.fixedOn && !state.dynamicOn) {
        $("typeErr").classList.add("show");
        return false;
      }
      if (state.fixedOn && !(state.fixedText || "").trim()) {
        $("fixedErr").classList.add("show");
        return false;
      }
      return true;
    }

    $("remarkSwitch").onclick = function () {
      state.remarkOn = !state.remarkOn;
      render();
    };
    $("chkFixed").onchange = function () {
      state.fixedOn = this.checked;
      render();
    };
    $("chkDynamic").onchange = function () {
      state.dynamicOn = this.checked;
      render();
    };
    $("fixedRemarkInput").oninput = function () {
      state.fixedText = this.value;
      render();
    };
    $("btnSave").onclick = function () {
      if (!validate()) {
        toast("请完善备注配置后再保存");
        if (window.__diffRemeasure) window.__diffRemeasure();
        return;
      }
      toast("保存成功");
    };
    $("btnCancel").onclick = function () { toast("已取消"); };

    window.DIFF_HOOKS = {
      locate: function () {},
      setDemoState: function (id) {
        if (id === "both") {
          state.remarkOn = true; state.fixedOn = true; state.dynamicOn = true; state.fixedText = "春季投放";
        } else if (id === "fixedOnly") {
          state.remarkOn = true; state.fixedOn = true; state.dynamicOn = false; state.fixedText = "春季投放";
        } else if (id === "dynamicOnly") {
          state.remarkOn = true; state.fixedOn = false; state.dynamicOn = true; state.fixedText = "春季投放";
        } else if (id === "off") {
          state.remarkOn = false; state.fixedOn = true; state.dynamicOn = true; state.fixedText = "春季投放";
        }
        render();
      }
    };

    render();
  </script>
  <script>

  var LEVEL = { page: "页面", module: "模块", field: "字段" };
  var slug = meta.slug || "prd";
  var LS_KEY = "proto-note:" + slug + ":modules:v1";
  var LS_RAIL = "proto-note:" + slug + ":rail:v1";

  var style = document.createElement("style");
  style.textContent = [

    ".diff-card { background: #14365c; border: 1px solid transparent; border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer; }",
    ".diff-card:hover, .diff-card.pin { border-color: #f0b429; }",

    ".diff-card h4 { margin: 8px 0 4px; font-size: 14px; color: #fff; font-weight: 600; }",
    ".diff-meta { color: #8fb4d6; font-size: 12px; }",
    ".diff-card p { margin: 8px 0; line-height: 1.55; color: #d7e4f2; }",
    ".diff-ba { display: flex; gap: 8px; margin-top: 6px; line-height: 1.5; }",
    ".diff-ba span { flex: none; width: 20px; height: 20px; border-radius: 4px; background: #0c2340; color: #f0b429; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }",
    ".diff-ba div { min-width: 0; }",

    ".diff-link:hover { text-decoration: underline; }",
    ".diff-anchor { position: absolute; z-index: 9000; width: 22px; height: 22px; border: 0; border-radius: 11px; background: #f0b429; color: #1a1a1a; font-weight: 700; font-size: 12px; padding: 0; transform: translate(-2px, -2px); box-shadow: 0 2px 8px rgba(0,0,0,.25); cursor: pointer; }",
    ".diff-anchor.pin { outline: 2px solid #fff; }",
    ".diff-pulse { animation: diffPulse 1.1s ease 2; }",
    "@keyframes diffPulse { 0% { box-shadow: 0 0 0 0 rgba(240,180,41,.7); } 100% { box-shadow: 0 0 0 8px rgba(240,180,41,0); } }",
    "#diffCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 8900; pointer-events: none; }"
  ].join("\n");
  document.head.appendChild(style);

  var rail = document.createElement("div");
  rail.id = "diffRail";
  rail.innerHTML = '<div class="diff-head"><b>变更批注</b><button class="diff-icon" id="diffCollapse" type="button" aria-label="收起批注栏">›</button></div><div class="diff-demo" id="diffDemo"></div><div class="diff-mods" id="diffMods"></div><div id="diffCards"></div>';
  var fab = document.createElement("button");
  fab.id = "diffFab";
  fab.type = "button";
  fab.textContent = "变更批注";
  var canvas = document.createElement("canvas");
  canvas.id = "diffCanvas";
  document.body.appendChild(rail);
  document.body.appendChild(fab);
  document.body.appendChild(canvas);
  var ctx = canvas.getContext("2d");

  function esc(text) {
    return String(text == null ? "" : text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function pageEl() {
    return document.getElementById("diffPage") || document.querySelector(".page") || document.body;
  }
  function prdHref(item) {
    var base = String(meta.prdUrl || "").replace(/#.*$/, "");
    var blockId = item.prd && item.prd.blockId;
    if (!base) return "";
    return base + (blockId ? "#" + blockId : "");
  }

  var modules = [];
  CHANGES.forEach(function (item) {
    var key = item.page + "::" + item.module;
    if (modules.indexOf(key) < 0) modules.push(key);
  });
  var stored = null;
  try { stored = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) { stored = null; }
  var checked = {};
  modules.forEach(function (key) {
    if (!stored) checked[key] = true;
    else checked[key] = stored[key] === undefined ? true : !!stored[key];
  });
  var railOpen = localStorage.getItem(LS_RAIL) !== "0";
  var pinId = null;
  var hoverId = null;
  var demo = (meta.demoControls && meta.demoControls[0] && meta.demoControls[0].id) || "";

  function scrollTo(el) {
    if (!el) return;
    try { el.scrollIntoView({ behavior: "instant", block: "center", inline: "nearest" }); }
    catch (e) { el.scrollIntoView(); }
    var railW = rail.classList.contains("collapsed") ? 0 : 360;
    var rect = el.getBoundingClientRect();
    var limit = window.innerWidth - railW - 28;
    if (rect.left > limit - 24) {
      var scroller = el.closest(".table-wrap") || pageEl();
      scroller.scrollLeft += rect.right - limit;
    }
  }
  function pulse(el) {
    if (!el) return;
    el.classList.remove("diff-pulse");
    void el.offsetWidth;
    el.classList.add("diff-pulse");
  }
  function visibleChanges() {
    return CHANGES.filter(function (item) { return checked[item.page + "::" + item.module]; });
  }
  function saveChecked() {
    localStorage.setItem(LS_KEY, JSON.stringify(checked));
  }
  function focusChange(change) {
    if (window.DIFF_HOOKS && typeof DIFF_HOOKS.locate === "function") DIFF_HOOKS.locate(change);
    setTimeout(function () {
      var el = document.querySelector(change.target);
      scrollTo(el);
      pulse(el);
      measure();
    }, 30);
  }

  function paintDemo() {
    var box = document.getElementById("diffDemo");
    var controls = meta.demoControls || [];
    box.innerHTML = "";
    if (!controls.length) {
      box.style.display = "none";
      return;
    }
    box.style.display = "";
    controls.forEach(function (pair) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = pair.label;
      btn.className = demo === pair.id ? "on" : "";
      btn.onclick = function () {
        demo = pair.id;
        if (window.DIFF_HOOKS && typeof DIFF_HOOKS.setDemoState === "function") DIFF_HOOKS.setDemoState(pair.id);
        paintDemo();
        measure();
      };
      box.appendChild(btn);
    });
  }
  function paintMods() {
    var box = document.getElementById("diffMods");
    box.innerHTML = "";
    var pages = [];
    modules.forEach(function (key) {
      var page = key.split("::")[0];
      if (pages.indexOf(page) < 0) pages.push(page);
    });
    pages.forEach(function (page) {
      var group = document.createElement("div");
      group.className = "diff-group";
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = page;
      group.appendChild(name);
      modules.forEach(function (key) {
        if (key.split("::")[0] !== page) return;
        var label = document.createElement("label");
        label.className = "diff-check";
        var input = document.createElement("input");
        input.type = "checkbox";
        input.checked = !!checked[key];
        input.onchange = function () {
          checked[key] = input.checked;
          saveChecked();
          if (input.checked) {
            var first = CHANGES.filter(function (item) { return item.page + "::" + item.module === key; })[0];
            pinId = first.id;
            paintCards();
            focusChange(first);
          } else {
            if (pinId && !visibleChanges().some(function (item) { return item.id === pinId; })) pinId = null;
            paintCards();
            measure();
          }
        };
        var text = document.createElement("span");
        text.textContent = key.split("::")[1];
        label.appendChild(input);
        label.appendChild(text);
        group.appendChild(label);
      });
      box.appendChild(group);
    });
  }
  function paintCards() {
    var box = document.getElementById("diffCards");
    box.innerHTML = "";
    visibleChanges().forEach(function (item) {
      var index = CHANGES.indexOf(item) + 1;
      var no = (index < 10 ? "0" : "") + index;
      var card = document.createElement("article");
      card.className = "diff-card" + (pinId === item.id ? " pin" : "");
      card.setAttribute("data-id", item.id);
      var examples = (item.examples || []).map(function (line) { return "<li>" + esc(line) + "</li>"; }).join("");
      var href = prdHref(item);
      var section = item.prd && item.prd.section;
      card.innerHTML =
        '<span class="diff-no">' + no + '</span>' +
        '<h4>' + esc(item.title) + '</h4>' +
        '<div class="diff-meta">' + esc(TYPE[item.type] || item.type) + " · " + esc(LEVEL[item.level] || item.level) + '</div>' +
        '<p>' + esc(item.desc) + '</p>' +
        '<div class="diff-ba"><span>前</span><div>' + esc(item.before) + '</div></div>' +
        '<div class="diff-ba"><span>后</span><div>' + esc(item.after) + '</div></div>' +
        (examples ? '<ul class="diff-ex">' + examples + '</ul>' : '') +
        (href && section ? '<a class="diff-link" target="_blank" rel="noopener" href="' + esc(href) + '">PRD · ' + esc(section) + '</a>' : '');
      card.onmouseenter = function () { hoverId = item.id; draw(); };
      card.onmouseleave = function () { if (hoverId === item.id) hoverId = null; draw(); };
      card.onclick = function (e) {
        if (e.target.closest("a")) return;
        pinId = item.id;
        paintCards();
        var active = document.querySelector('.diff-card[data-id="' + item.id + '"]');
        if (active) active.scrollIntoView({ block: "nearest" });
        focusChange(item);
      };
      box.appendChild(card);
    });
  }
  function syncRail() {
    rail.classList.toggle("collapsed", !railOpen);
    fab.classList.toggle("show", !railOpen);
    localStorage.setItem(LS_RAIL, railOpen ? "1" : "0");
    var page = pageEl();
    var spacer = document.getElementById("diffSpacer");
    if (railOpen) {
      if (!spacer) {
        spacer = document.createElement("div");
        spacer.id = "diffSpacer";
        spacer.style.cssText = "width:calc(100% + 360px);height:1px;pointer-events:none;";
        page.appendChild(spacer);
      }
    } else if (spacer) {
      spacer.remove();
    }
  }
  function shown(el) {
    return !!(el && el.getClientRects().length);
  }
  function measure() {
    document.querySelectorAll(".diff-anchor").forEach(function (node) { node.remove(); });
    var page = pageEl();
    var pageRect = page.getBoundingClientRect();
    visibleChanges().forEach(function (item) {
      var el = document.querySelector(item.target);
      if (!shown(el)) return;
      var rect = el.getBoundingClientRect();
      var anchor = document.createElement("button");
      anchor.type = "button";
      anchor.className = "diff-anchor" + (pinId === item.id ? " pin" : "");
      anchor.setAttribute("data-id", item.id);
      var index = CHANGES.indexOf(item) + 1;
      anchor.textContent = (index < 10 ? "0" : "") + index;
      anchor.style.left = (rect.left - pageRect.left + page.scrollLeft) + "px";
      anchor.style.top = (rect.top - pageRect.top + page.scrollTop) + "px";
      anchor.onclick = function (e) {
        e.stopPropagation();
        pinId = item.id;
        hoverId = null;
        if (!railOpen) {
          railOpen = true;
          syncRail();
        }
        paintCards();
        var card = document.querySelector('.diff-card[data-id="' + item.id + '"]');
        if (card) card.scrollIntoView({ block: "nearest" });
        pulse(el);
        measure();
      };
      anchor.onmouseenter = function () { hoverId = item.id; draw(); };
      anchor.onmouseleave = function () { if (hoverId === item.id) hoverId = null; draw(); };
      page.appendChild(anchor);
      anchor.style.visibility = "hidden";
      var top = document.elementFromPoint(rect.left + 11, rect.top + 11);
      anchor.style.visibility = "";
      if (top && top.closest && top.closest("#diffRail")) anchor.style.display = "none";
    });
    draw();
  }
  window.__diffRemeasure = function () { measure(); };
  function resizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if (!railOpen) return;
    var id = pinId || hoverId;
    if (!id) return;
    var card = document.querySelector('.diff-card[data-id="' + id + '"]');
    var anchor = document.querySelector('.diff-anchor[data-id="' + id + '"]');
    if (!card || !anchor || anchor.style.display === "none") return;
    var a = card.getBoundingClientRect();
    var b = anchor.getBoundingClientRect();
    var page = pageEl().getBoundingClientRect();
    if (b.bottom < page.top || b.top > page.bottom || b.right < page.left || b.left > page.right) return;
    var x1 = a.left;
    var y1 = Math.min(Math.max(a.top + a.height / 2, 8), window.innerHeight - 8);
    var x2 = b.left + b.width / 2;
    var y2 = b.top + b.height / 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo((x1 + x2) / 2, y1, (x1 + x2) / 2, y2, x2, y2);
    ctx.strokeStyle = "#f0b429";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  document.getElementById("diffCollapse").onclick = function () { railOpen = false; syncRail(); measure(); };
  fab.onclick = function () { railOpen = true; syncRail(); measure(); };
  rail.addEventListener("click", function (e) { e.stopPropagation(); });
  pageEl().addEventListener("scroll", measure);
  window.addEventListener("resize", function () { resizeCanvas(); measure(); });
  document.querySelectorAll(".table-wrap").forEach(function (node) { node.addEventListener("scroll", measure); });
  paintDemo();
  paintMods();
  paintCards();
  syncRail();
  resizeCanvas();
  measure();
})();

  </script>
</body>
</html>
